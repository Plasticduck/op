<!doctype html>
<!--
  Secret Shopper phone app, served at /shop (vercel.json rewrite; a dev-server
  plugin in vite.config.ts does the same locally). It's a separate page from
  index.html so it has its own manifest and home-screen icon: saving it to a
  phone's home screen opens the shopper app, not Operator. Nothing in Operator
  links here; shoppers get the link or QR code from /app/secret-shoppers.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F14" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wl-theme') || 'system'
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/png" sizes="192x192" href="/shop-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/shop-icon-180.png" />
    <link rel="manifest" href="/shop.webmanifest" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Secret Shopper" />
    <meta name="description" content="Rate a visit to any of our car wash sites." />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
    <title>Secret Shopper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/shop.tsx"></script>
  </body>
</html>
