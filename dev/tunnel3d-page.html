<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Tunnel page preview (dev only)</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Dev only: the real Tunnel page (3D, diagram, list, side panel, a machine's page)
         on a pretend server with sample data, no sign-in. Not part of the production build
         (vite.config.ts lists the build's pages). Options are in the header of
         src/features/maintenance/inventory/tunnel/three/dev/pageHarness.tsx. -->
    <div id="root"></div>
    <script>
      // This page needs no Supabase project (the pretend server answers everything), so it
      // needs no .env.local either. src/lib/supabase.ts still reports the missing keys as it
      // loads, which is about the app, not this page: drop that one line while the modules
      // load. Vite writes import.meta.env into each module, so the page can't supply the
      // keys instead. pageHarness.tsx puts console.error back once everything has loaded.
      (function () {
        var error = console.error
        console.error = function (first) {
          if (typeof first === 'string' && first.indexOf('[supabase] Missing VITE_SUPABASE_URL') === 0) return
          return error.apply(console, arguments)
        }
        window.__restoreConsole = function () { console.error = error }
      })()
    </script>
    <script type="module" src="/src/features/maintenance/inventory/tunnel/three/dev/pageHarness.tsx"></script>
  </body>
</html>
