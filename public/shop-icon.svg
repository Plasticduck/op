<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Secret Shopper app icon (home screen). Full-bleed square so iOS and
       Android can round or mask it; the artwork stays inside the maskable
       safe zone. PNGs in public/shop-icon-*.png are rendered from this. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a" />
      <stop offset="1" stop-color="#0b0f14" />
    </linearGradient>
    <path id="star" d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" />
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <!-- mask -->
  <g transform="translate(256 214) scale(13.5) translate(-12 -12.5)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6a2 2 0 0 0-2 2v4a5 5 0 0 0 5 5 8 8 0 0 1 5 2 8 8 0 0 1 5-2 5 5 0 0 0 5-5V8a2 2 0 0 0-2-2h-3a8 8 0 0 0-5 2 8 8 0 0 0-5-2z" />
    <path d="M6 11c1.5 0 2.5.5 3 2" />
    <path d="M18 11c-1.5 0-2.5.5-3 2" />
  </g>
  <!-- five-star rating -->
  <g fill="#fbbf24">
    <use href="#star" transform="translate(128 336) scale(2.1)" />
    <use href="#star" transform="translate(180 336) scale(2.1)" />
    <use href="#star" transform="translate(232 336) scale(2.1)" />
    <use href="#star" transform="translate(284 336) scale(2.1)" />
    <use href="#star" transform="translate(336 336) scale(2.1)" />
  </g>
</svg>
