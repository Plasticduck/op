    html+=`<div id="sc" style="margin-top:20px">`;
    SELFCHECK.forEach((t,i)=>{ html+=`<label class="check ${S.selfcheck.checks[i]?'on':''}"><input type="checkbox" id="sc${i}" data-i="${i}" ${S.selfcheck.checks[i]?'checked':''}><span>${t}</span></label>`; });
    const open=SELFCHECK.map((t,i)=>({t,i})).filter(x=>!S.selfcheck.checks[x.i]);
    html+=`<div class="focusbox"><div class="eyebrow blue">This week's focus</div>`;
    if(open.length===0) html+=`<p style="margin:6px 0 0">Every box is checked. Pick one to re-verify on your next site walk anyway; standards drift quietly.</p><label class="f" for="focus">Item to re-verify</label><select id="focus"><option value="">Choose one</option>${SELFCHECK.map((t,i)=>`<option value="${i}" ${S.selfcheck.focus===String(i)?'selected':''}>${t}</option>`).join('')}</select>`;
    else html+=`<p style="margin:6px 0 0">You have ${open.length} unchecked. Pick the one you will fix this week.</p><label class="f" for="focus">The one I will fix this week</label><select id="focus"><option value="">Choose one</option>${open.map(x=>`<option value="${x.i}" ${S.selfcheck.focus===String(x.i)?'selected':''}>${x.t}</option>`).join('')}</select>`;
    html+=`<div class="actions"><button class="btn primary" id="saveSc">Save self-check</button>${done?`<span class="pill good">Saved ${fmtDate(S.lessons[l.id].at)}</span>`:''}</div></div></div>`;
  } else {
    html+=quizHtml(l.quiz,'Knowledge check',`All ${l.quiz.length} correct marks the lesson complete.`);
  }
  html+=`<div class="actions" style="margin-top:30px;justify-content:space-between">${prev?`<button class="btn" data-go="${prev.id}">← ${prev.title}</button>`:`<button class="btn" data-go="lvl-${L.id}">← Level overview</button>`}${nxt?`<button class="btn ${done?'primary':''}" data-go="${nxt.id}">${nxt.title} →</button>`:`<button class="btn ${done?'primary':''}" data-go="sc-${L.id}">Scenario practice →</button>`}</div></div>`;
  main.innerHTML=html; wire();
  if(l.selfcheck){
    main.querySelectorAll('#sc input[type=checkbox]').forEach(cb=>cb.addEventListener('change',()=>{ S.selfcheck.checks[+cb.dataset.i]=cb.checked; S.selfcheck.focus=''; lsSave(); renderLesson(l); }));
    document.getElementById('saveSc').addEventListener('click',()=>{ const f=document.getElementById('focus').value; if(!f){ toast('Choose your focus item first'); return; } S.selfcheck.focus=f; S.lessons[l.id]={done:true,at:Date.now()}; save(); renderRail(l.id); renderLesson(l); toast('Self-check saved'); });
  } else {
    wireQuiz(l.quiz,(allRight,score)=>{ if(allRight){ const was=done; S.lessons[l.id]={done:true,score,at:Date.now()}; save(); renderRail(l.id); toast(was?'Still perfect':'Lesson complete'); if(!was) main.querySelector('.eyebrow').innerHTML+=' <span class="pill good" style="margin-left:8px">Complete</span>'; const nb=main.querySelector('.actions [data-go]:last-child'); if(nb) nb.classList.add('primary'); } });
  }

/* ---------- Quiz engine ---------- */
function quizHtml(qs,title,sub){
  let h=`<div class="quiz"><div class="qh"><h2>${title}</h2><span class="note">${sub}</span></div>`;
  qs.forEach((q,i)=>{ h+=`<div class="q" data-q="${i}"><div class="qt"><span class="n">${i+1}.</span>${q.q}</div>`; q.o.forEach((o,j)=>{ h+=`<label class="opt"><input type="radio" name="q${i}" id="q${i}o${j}" value="${j}"><span>${o}</span></label>`; }); h+=`<div class="why"></div></div>`; });
  h+=`<div class="qfoot"><button class="btn primary" id="checkBtn">Check answers</button><span class="score" id="scoreOut"></span></div></div>`;
  return h;
}
function wireQuiz(qs,onDone){
  const btn=document.getElementById('checkBtn'); if(!btn) return;
  btn.addEventListener('click',()=>{
    let right=0, answered=0;
    qs.forEach((q,i)=>{
      const sel=main.querySelector(`input[name=q${i}]:checked`); const box=main.querySelector(`.q[data-q="${i}"]`); const why=box.querySelector('.why');
      box.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','wrong'));
      if(!sel){ why.className='why show'; why.textContent='Pick an answer.'; return; }
      answered++; const j=+sel.value; const opts=box.querySelectorAll('.opt');
      if(j===q.a){ right++; opts[j].classList.add('correct'); why.className='why show ok'; why.textContent='Correct. '+(q.why||''); }
      else{ opts[j].classList.add('wrong'); opts[q.a].classList.add('correct'); why.className='why show no'; why.textContent='Not quite. '+(q.why||''); }
    });
    const score=Math.round(right/qs.length*100); const out=document.getElementById('scoreOut');
    out.textContent=answered<qs.length?`${answered} of ${qs.length} answered`:`${right} of ${qs.length} correct (${score}%)`;
    if(answered===qs.length) onDone(right===qs.length,score,right);
  });
}

  html+=`</div>`;
  main.innerHTML=html; wire();
  const sb=document.getElementById('signBtn'); if(sb) sb.addEventListener('click',()=>{ const name=document.getElementById('ackName').value.trim(), site=document.getElementById('ackSite').value.trim(), date=document.getElementById('ackDate').value, rm=document.getElementById('ackRm').value.trim(); if(!name||!site){ toast('Enter your name and site'); return; } if(!document.getElementById('ackAgree').checked){ toast('Check the signature box to sign'); return; } S.ack[L.id]={name,site,date,rm,at:Date.now()}; save(); renderRail('ack-'+L.id); renderAck(L); toast(formal?'Acknowledgment signed':'Level signed off'); });
  const us=document.getElementById('unsign'); if(us) us.addEventListener('click',()=>{ delete S.ack[L.id]; save(); renderRail('ack-'+L.id); renderAck(L); });
}

/* ---------- Team view ---------- */
let teamUnsub=null;
function renderTeam(){
  if(teamUnsub){ teamUnsub(); teamUnsub=null; }
  main.innerHTML=`<div class="col wide team"><div class="eyebrow red">Leadership view</div><h1 style="margin:8px 0 10px">Team progress</h1><p class="lead">Everyone who has opened the Academy while signed in and saved progress. Updates live. Level cells show percent complete; a check means signed off.</p><div id="teamBody"><div class="empty">Loading...</div></div></div>`;
  const body=document.getElementById('teamBody');
  if(!db){ body.innerHTML=`<div class="empty">Team progress needs the shared data store, which is not available in this view. Open the Academy from claude.ai while signed in.</div>`; return; }
  teamUnsub=db.collection('completions').orderBy('updatedAt','desc').limit(500).onSnapshot(async snap=>{
    if(snap.empty){ body.innerHTML=`<div class="empty">No one has saved progress yet. Share the Academy with your team as Contributors so their progress is recorded here.</div>`; return; }
    const ids=snap.docs.map(d=>d.id); let ps={}; try{ ps=await user.profiles(ids); }catch(e){}
    let t=`<div class="tablewrap"><table><tr><th>Team member</th><th>Role</th><th>Overall</th>${LEVELS.map(L=>`<th title="${L.title}">L${L.num}</th>`).join('')}<th>Last activity</th></tr>`;
    for(const d of snap.docs){ const r=d.data()||{}; const role=levelById(r.role); const lv=r.levels||{};
      t+=`<tr><td><div class="pc"><img alt="" class="av"><span class="nm"></span></div><div class="note" style="margin-left:32px">${esc(r.ackSite||'')}</div></td><td>${role?esc(role.short):'<span class="note">not set</span>'}</td><td><span class="minibar"><i style="width:${r.pct||0}%"></i></span><b style="font-variant-numeric:tabular-nums">${r.pct||0}%</b></td>${LEVELS.map(L=>{ const q=lv[L.id]||{}; const pc=q.pct||0; return `<td><span class="lvcell ${q.signed&&pc===100?'d':pc>0?'p':''}" title="${L.title}: ${pc}%${q.signed?', signed':''}${q.score!=null?', assessment '+q.score+'%':''}">${q.signed&&pc===100?'✓':pc+'%'}</span></td>`; }).join('')}<td class="note">${r.updatedAt?fmtDate(r.updatedAt):''}</td></tr>`; }
    t+=`</table></div>`; body.innerHTML=t;
    const rows=body.querySelectorAll('tr'); let k=1;
    for(const d of snap.docs){ const r=d.data()||{}; const p=ps[d.id]||{}; const row=rows[k++]; if(!row) continue; const nm=row.querySelector('.nm'); const av=row.querySelector('.av'); if(nm) nm.textContent=p.name||r.ackName||'Someone'; if(av){ if(p.avatarUrl) av.src=p.avatarUrl; else av.remove(); } }
  }, err=>{ body.innerHTML=`<div class="empty">Could not load team progress right now.</div>`; });
}

/* ---------- Boot ---------- */
lsLoad();
render();
initCaps();
</script>
