<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mighty Wash Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell. Fixed top bar with progress, left level rail (collapsible groups), reading column at 68ch. Rail collapses to a drawer on phones. */
:root{
  --bg:#F5F7F9; --surface:#FFFFFF; --surface-2:#EDF1F4; --ink:#13191F; --muted:#5C6873; --line:#DDE3E8;
  --red:#DB1E2D; --red-ink:#B8151F; --blue:#28AAE1; --blue-ink:#1584B3; --blue-soft:#E3F4FB; --red-soft:#FCE6E8;
  --good:#1E8E5A; --good-soft:#E1F3EA; --warn:#B7791F; --warn-soft:#FBF0DC;
  --display:"Barlow","Arial Narrow",Arial,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(19,25,31,.06),0 6px 20px rgba(19,25,31,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1418; --surface:#171D23; --surface-2:#1F262E; --ink:#EDF1F4; --muted:#9AA6B1; --line:#2A333C;
  --red:#F04553; --red-ink:#FF6B76; --blue:#3DB8EC; --blue-ink:#6FCBF2; --blue-soft:#13303D; --red-soft:#3A1A1E;
  --good:#3FBF82; --good-soft:#15312A; --warn:#E0A33A; --warn-soft:#3A2D14;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1418; --surface:#171D23; --surface-2:#1F262E; --ink:#EDF1F4; --muted:#9AA6B1; --line:#2A333C;
  --red:#F04553; --red-ink:#FF6B76; --blue:#3DB8EC; --blue-ink:#6FCBF2; --blue-soft:#13303D; --red-soft:#3A1A1E;
  --good:#3FBF82; --good-soft:#15312A; --warn:#E0A33A; --warn-soft:#3A2D14;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
a{color:var(--blue-ink)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,4vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700;margin-top:34px;margin-bottom:10px}
h3{font-size:17px;font-weight:700;margin-top:22px;margin-bottom:6px}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-left:22px}
li{margin:4px 0}
.eyebrow{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:12px;color:var(--muted)}
.eyebrow.red{color:var(--red)}
.eyebrow.blue{color:var(--blue-ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;height:58px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--red) 0 62%,var(--blue) 62% 100%)}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand .wm{font-family:var(--display);font-weight:800;font-style:italic;font-size:21px;letter-spacing:.01em;text-transform:uppercase}
.brand .wm b{color:var(--red);font-weight:800}
.brand .sub{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;cursor:pointer;align-items:center;justify-content:center}
.menu-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.who img{width:28px;height:28px;border-radius:50%;border:1px solid var(--line)}
.ring{position:relative;width:38px;height:38px}
.ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .track{stroke:var(--surface-2)}
.ring .bar{stroke:var(--red);stroke-linecap:round;transition:stroke-dasharray .4s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:11px;font-variant-numeric:tabular-nums}

/* Shell */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100% - 58px)}
.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:14px 40px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:10px;position:sticky;top:calc(58px + env(safe-area-inset-top,0px));height:calc(100vh - 58px - env(safe-area-inset-top,0px));overflow-y:auto}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:14px;line-height:1.3;color:var(--ink)}
.navitem:hover{background:var(--surface-2)}
.navitem.active{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.navitem .dot{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;font-family:var(--display);font-weight:700;color:var(--muted);background:var(--surface)}
.navitem.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.navitem.done .dot::before{content:"✓"}
.navitem.util .dot{border-radius:5px}
.lvl{margin:4px 0}
.lvlhead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.lvlhead:hover{background:var(--surface-2)}
.lvlhead.cur{background:var(--surface-2)}
.lvlhead .n{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;color:var(--muted)}
.lvlhead.done .n{background:var(--good);color:#fff}
.lvlhead.mine .n{background:var(--red);color:#fff}
.lvlhead .t{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:14.5px;line-height:1.15}
.lvlhead .t small{display:block;font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px}
.lvlhead .chev{flex:none;width:14px;height:14px;transition:transform .2s}
.lvlhead.open .chev{transform:rotate(90deg)}
.lvlbody{display:none;padding:2px 0 6px 12px}
.lvl.open .lvlbody{display:block}
.lvlbody .sub{margin:6px 0 2px;padding:0 10px}

.main{padding-block:28px 72px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.col{max-width:68ch;margin:0 auto}
.col.wide{max-width:1000px}

/* Content pieces */
.lead{font-size:18px;color:var(--muted);margin-bottom:22px}
.callout{border-left:4px solid var(--red);background:var(--surface);border-radius:0 var(--radius) var(--radius) 0;padding:14px 18px;margin:20px 0;box-shadow:var(--shadow)}
.callout.blue{border-left-color:var(--blue)}
.callout .eyebrow{margin-bottom:4px}
.callout p:last-child{margin:0}
.callout em{font-style:italic;font-weight:500}
.whybox{background:var(--blue-soft);border:1px solid var(--blue);border-radius:var(--radius);padding:14px 18px;margin:0 0 24px}
.whybox .eyebrow{margin-bottom:6px}
.whybox p{margin:0;font-size:15.5px}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:12px 0 20px}
.tablewrap{overflow-x:auto;margin:0 0 6px}
th{text-align:left;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;min-width:0}
td.k{font-weight:600;white-space:nowrap}
td.v{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.wash{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 22px}
.wash>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px 12px}
.wash .L{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--red)}
.wash .w{font-family:var(--display);font-weight:700;font-size:15px;margin:4px 0 6px}
.wash p{font-size:13px;color:var(--muted);margin:0;line-height:1.4}
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.loop>div{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:6px;padding:12px}
.loop>div:nth-child(2){border-top-color:var(--blue-ink)}
.loop>div:nth-child(3){border-top-color:var(--red)}
.loop>div:nth-child(4){border-top-color:var(--good)}
.loop .st{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.04em}
.loop p{font-size:13.5px;margin:4px 0 0;color:var(--muted)}
.steps li{margin:8px 0}
.pill{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.red{background:var(--red-soft);color:var(--red-ink)}
.pill.blue{background:var(--blue-soft);color:var(--blue-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-ink);border-color:var(--red-ink)}
.btn.blue{background:var(--blue-ink);border-color:var(--blue-ink);color:#fff}
.btn.blue:hover{filter:brightness(1.08)}
.btn.sm{padding:7px 12px;font-size:13.5px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}

/* Quiz */
.quiz{margin-top:36px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.quiz .qh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.quiz .qh h2{margin:0;font-size:20px}
.q{padding:18px 20px;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q .qt{font-weight:600;margin-bottom:10px}
.q .qt .n{font-family:var(--display);color:var(--muted);font-weight:700;margin-right:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--blue)}
.opt input{margin-top:3px;accent-color:var(--blue-ink)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.why{display:none;margin-top:10px;font-size:14px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.why.show{display:block}
.why.ok{background:var(--good-soft);color:var(--good)}
.why.no{background:var(--red-soft);color:var(--red-ink)}
.qfoot{padding:16px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.score{font-family:var(--display);font-weight:700;font-size:16px}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start;margin-bottom:26px}
.hero h1{font-size:clamp(34px,4.6vw,48px)}
.hero .lead{margin-top:10px}
.progress-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.progress-card .big{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.progress-card .big small{font-size:20px;color:var(--muted);font-weight:700}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:10px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--blue));width:0;transition:width .4s}
.stat{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line);gap:10px}
.stat b{font-variant-numeric:tabular-nums;white-space:nowrap}
.rolesel{margin-top:14px}
.rolesel label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.ladder{display:grid;gap:10px;margin:8px 0 30px}
.rung{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.rung.mine{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft),var(--shadow)}
.rung.done{border-color:var(--good)}
.rung .n{width:52px;height:52px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted)}
.rung.mine .n{background:var(--red);color:#fff}
.rung.done .n{background:var(--good);color:#fff}
.rung h2{margin:0;font-size:20px}
.rung .meta{font-size:13px;color:var(--muted);margin-top:2px}
.rung .bar{margin:8px 0 0;max-width:360px}
.rung .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.rung .pct{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tool h3{margin:0}
.tool p{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.banner{border:1px solid var(--good);background:var(--good-soft);border-radius:var(--radius);padding:16px 18px;margin-bottom:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner .mark{font-family:var(--display);font-weight:800;font-size:28px;color:var(--good)}
.note{font-size:13px;color:var(--muted)}
.draft{border:1px dashed var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin:0 0 18px}

/* Level page */
.lessonlist{display:grid;gap:8px;margin:10px 0 6px}
.lrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;text-align:left;cursor:pointer;width:100%;min-width:0}
.lrow:hover{border-color:var(--blue)}
.lrow .dot{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;color:#fff}
.lrow.done .dot{background:var(--good);border-color:var(--good)}
.lrow.done .dot::before{content:"✓"}
.lrow .t{flex:1;min-width:0;font-weight:600;font-size:14.5px}
.lrow .m{font-size:12.5px;color:var(--muted);white-space:nowrap}

/* Scenarios */
.scn{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:16px 0;box-shadow:var(--shadow)}
.scn .sit{font-size:16px;margin:8px 0 12px}
.scn .opt{background:var(--bg)}

/* Self check */
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:8px 0;cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--good)}
.check.on{border-color:var(--good);background:var(--good-soft)}
.focusbox{margin-top:22px;padding:18px;border-radius:var(--radius);background:var(--blue-soft);border:1px solid var(--blue)}
select,input[type=text],input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;max-width:100%}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* Acknowledgment */
.ackcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.signed{border:2px solid var(--good);border-radius:var(--radius);padding:20px;background:var(--surface)}
.signed .sig{font-family:var(--display);font-style:italic;font-weight:700;font-size:30px;border-bottom:1px solid var(--ink);display:inline-block;padding:0 4px 2px;margin:8px 0}

/* Team */
.team table td{font-size:14px}
.team .pc{display:flex;align-items:center;gap:8px}
.team .pc img{width:24px;height:24px;border-radius:50%}
.minibar{height:6px;width:90px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.minibar i{display:block;height:100%;background:var(--blue)}
.lvcell{display:inline-grid;place-items:center;width:30px;height:24px;border-radius:6px;font-family:var(--display);font-weight:700;font-size:11px;background:var(--surface-2);color:var(--muted);margin-right:2px}
.lvcell.p{background:var(--blue-soft);color:var(--blue-ink)}
.lvcell.d{background:var(--good);color:#fff}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .menu-btn{display:inline-flex}
  .rail{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:0;bottom:0;width:min(330px,88vw);height:auto;transform:translateX(-105%);transition:transform .25s;z-index:8;box-shadow:var(--shadow)}
  .rail.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:7;display:none}
  .scrim.show{display:block}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hero,.form-grid{grid-template-columns:1fr}
  .tools{grid-template-columns:1fr}
  .wash,.loop{grid-template-columns:1fr 1fr}
  .rung{grid-template-columns:44px minmax(0,1fr)}
  .rung .n{width:44px;height:44px;font-size:18px}
  .rung .right{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
  .who .nm{display:none}
  .brand .sub{display:none}
}
@media (max-width:420px){.wash,.loop{grid-template-columns:1fr}}
</style>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Open navigation"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="brand" href="#home"><span class="wm">Mighty <b>Wash</b></span><span class="sub">Academy</span></a>

<script>
/* Draft levels 1 to 5 and 7. Level 6 (GM) comes from the issued documents. */
const L1 = { id:'l1', num:1, title:'Quality Control / Passenger Side Prep', short:'QC / Passenger Prep', draft:true,
  role:'Entry level. Every Mighty Wash career starts here. You prep the passenger side before the tunnel and inspect every car at the exit.',
  blurb:'Safety, prep technique, exit quality control, conduct on the lot, and site readiness.',
  why:`You are the first hands on the car and the last eyes on it. The tunnel does most of the work, but what it cannot reach and what it misses is yours. A car that leaves dirty blames the wash, not the equipment.`,
  courses:[{ id:'l1c', title:'Quality Control and Passenger Side Prep', lessons:[
  { id:'p1', title:'Welcome to Mighty Wash', minutes:4,
    why:`Every task on the lot makes more sense once you know what the business is for. Mighty Wash is not selling one wash; it is building a membership business, and members decide every month whether to keep paying. Your greeting, your prep, and your exit check are part of that decision.`,
    html:`<p class="lead">Mighty Wash is a local, community-rooted express car wash. Most of our sites are express exterior with free vacuums, and some add Express Interiors. We also run Mighty Express Auto Center for oil, tires, and more.</p>
    <h2>Who we serve</h2>
    <ul><li><strong>Members</strong> pay a monthly Membership for unlimited washes. Membership is the engine of the company and the target is 75 to 80% of revenue.</li><li><strong>Retail Customers</strong> pay per wash. Every retail customer is a future member.</li><li><strong>Fleet accounts</strong> are businesses that wash their vehicles with us on an account.</li></ul>
    <h2>Words we use</h2>
    <ul><li>Our three wash packages are <strong>Wonder</strong>, <strong>Super Shine</strong>, and <strong>Mighty Protector</strong>. Know them in order; customers will ask.</li><li>The monthly plan is called <strong>Membership</strong>. Not "the subscription" or "the plan". A Membership is available for every package.</li><li><strong>MVP</strong> is a Membership plus Express Interiors: unlimited exterior and the inside done too.</li><li><strong>MSA</strong> is a Mighty Sales Associate, the person who signs up Members. On sites that have one, the MSA works from the <strong>Sales Booth</strong>.</li><li><strong>Mighty Max</strong> is our mascot. He is a brush. He shows up at community events and in kids' materials.</li></ul>
    <h2>The Road Map to Success</h2>
    <p>Every role at Mighty Wash is a step on one ladder: Quality Control / Passenger Side Prep, Driver's Side Prep, Tunnel Captain, Supervisor and MSA, Assistant General Manager, General Manager, Regional Manager. Each level has its own standards and its own training in this Academy. Ask your leader where you stand and what it takes to reach the next level.</p>
    <div class="callout"><div class="eyebrow red">The one rule</div><p><em>Every customer should feel like the #1 customer of the day.</em></p></div>`,
    quiz:[
      {q:'What is the monthly unlimited plan officially called?',o:['The subscription','Membership','The club','The unlimited pass'],a:1,why:'Use the word Membership. Customers on it are Members; everyone else is a Retail Customer.'},
      {q:'What is MVP?',o:['The employee of the month','Unlimited exterior plus Express Interiors','A fleet account','The top retail wash'],a:1,why:'MVP is the top Membership: unlimited exterior washes plus Express Interiors.'},
      {q:'What drives the company forward, according to the standards?',o:['Retail volume','The membership business','Fleet accounts','The auto center'],a:1,why:'Membership is the engine. The company target is 75 to 80% of revenue from Members.'},
      {q:'What are the three wash packages?',o:['Basic, Deluxe, Ultimate','Wonder, Super Shine, Mighty Protector','Bronze, Silver, Gold','Express, Interior, MVP'],a:1,why:'Wonder, Super Shine, and Mighty Protector. Each one is available as a Membership.'},
      {q:'Where does the MSA work on a site that has one?',o:['The tunnel exit','The Sales Booth','The vacuums','Wherever they like'],a:1,why:'The MSA works from the Sales Booth where the site is equipped. That is where customers go for Membership.'}
    ]},
  { id:'p2', title:'Safety on the Lot', minutes:5,
    why:`A tunnel moves a vehicle every 20 to 30 seconds and the lot has cars rolling all day. Almost every serious car wash injury comes from one of four things: a moving vehicle, moving equipment, chemicals, or a wet surface. Each rule below exists because someone, somewhere, got hurt without it.`,
    html:`<p class="lead">Nothing on this lot is worth getting hurt for. These rules are not optional and they apply to everyone, including managers.</p>
    <h2>Moving vehicles</h2>
    <ul><li>Stand where drivers can see you. Never assume a driver has seen you.</li><li>Never step between the conveyor and a vehicle that is loading or moving.</li><li>Keep your feet clear of the conveyor rollers at all times.</li></ul>
    <h2>Tunnel equipment</h2>
    <ul><li>Never enter the tunnel while equipment is running, for any reason. A dropped towel is not a reason.</li><li>Know where every emergency stop is. Use it the moment you see a person, an animal, or a vehicle problem in the tunnel.</li><li>After an emergency stop, only the Tunnel Captain or shift leader restarts the tunnel, after checking why it stopped.</li></ul>
    <h2>Chemicals</h2>
    <ul><li>Gloves and eye protection whenever you handle concentrate.</li><li>Never mix chemicals. Never pour one into another's container.</li><li>Skin or eye contact: rinse with water right away and tell your leader. Know where the Safety Data Sheets are kept.</li></ul>
    <h2>Surfaces and weather</h2>
    <ul><li>Wet concrete and tunnel floors are slick. Walk, do not run. Wear the approved footwear.</li><li>Lightning in the area: the leader clears the lot. Do not stay outside working.</li></ul>
    <div class="callout"><div class="eyebrow red">Report every injury</div><p>Every injury, however small, is reported to your leader on the same shift. A scratch that is not reported cannot be treated or learned from.</p></div>`,
    quiz:[
      {q:'A towel falls inside the tunnel while cars are running through. What do you do?',o:['Step in quickly and grab it','Wait for a gap between cars and grab it','Tell the Tunnel Captain; nobody enters until the equipment is stopped','Ignore it until closing'],a:2,why:'Nobody enters the tunnel while equipment is running, for any reason. The Tunnel Captain stops it first.'},
      {q:'Who restarts the tunnel after an emergency stop?',o:['Whoever pressed the stop','The Tunnel Captain or shift leader, after checking the cause','Any team member once the tunnel is clear','The customer in the car'],a:1,why:'Only the Tunnel Captain or shift leader restarts, after finding out why it stopped.'},
      {q:'When do you report an injury?',o:['Only if it needs a doctor','At the end of the week','On the same shift, every time, however small','Only if a customer saw it'],a:2,why:'Every injury is reported on the same shift. Small injuries are how we learn about hazards before they cause big ones.'},
      {q:'You find two chemical jugs with the same label and one is almost empty. What do you do?',o:['Pour the rest into the fuller jug','Leave both and tell your leader','Mix them into a bucket','Rinse one out and refill it from the other'],a:1,why:'Never mix or transfer chemicals. Leave them and tell your leader.'}
    ]},
  { id:'p3', title:'Passenger Side Prep', minutes:5,
    why:`The tunnel's chemistry and friction handle most of the dirt. Prep removes what the tunnel reaches least: bugs baked on the front, road film on the lower panels, brake dust in the wheels. Skip the prep and the car leaves with the exact dirt the customer noticed when they decided to come in. A rewash costs a minute of tunnel time and, more important, the customer's confidence.`,
    html:`<p class="lead">Your job is to get the dirt the tunnel cannot. You have about the time it takes the car ahead to load, so the order matters.</p>
    <h2>Prep order, passenger side</h2>
    <ol class="steps"><li><strong>Front bumper and grille.</strong> Bugs, tar, and the license plate area. This is the first thing the customer looks at.</li><li><strong>Lower panels and rocker.</strong> Road film under the doors, behind the front wheel, and ahead of the rear wheel.</li><li><strong>Wheels and wheel wells.</strong> Brake dust on the face of the wheel and mud in the well.</li><li><strong>Mirror and door handles.</strong> Quick pass.</li><li><strong>Rear bumper and tailgate</strong> if there is time, coordinated with the driver's side.</li></ol>
    <h2>Prep gun technique</h2>
    <ul><li>Keep the tip about a foot from the paint and keep it moving. Holding it on one spot can lift paint or trim.</li><li>Angle the spray across the surface, not straight into seams, badges, or window trim.</li><li>Back off on loose trim, peeling paint, aftermarket wraps, and anything already damaged.</li><li>Hoses stay out of the drive path. A hose across the lane is a trip hazard and a slip hazard.</li></ul>
    <h2>Pace</h2>
    <p>Match the conveyor. On a heavy-soil day, if you cannot finish a car, signal the driver's side and the Tunnel Captain rather than sending it in half-prepped. The tunnel does not get a second chance.</p>`,
    quiz:[
      {q:'What is the first area you prep on the passenger side?',o:['Wheels','Front bumper and grille','Rear bumper','Mirror'],a:1,why:'The front takes the bugs and is the first thing the customer looks at.'},
      {q:'Why do lower panels get prepped by hand?',o:['They are the easiest to reach','They are the part of the car tunnel equipment reaches least','The customer cannot see them','They do not need chemical'],a:1,why:'Road film sits low where tunnel friction and spray reach least. Prep makes up the difference.'},
      {q:'You see a piece of trim that is already loose. What do you do with the prep gun?',o:['Blast it to clean under it','Back off and let the tunnel handle it gently; note it to the Tunnel Captain','Hold the spray on it until it is clean','Pull it off so it does not snag'],a:1,why:'Pressure on loose trim can finish the damage. Back off, and point it out before the car loads.'},
      {q:'It is a heavy mud day and you cannot finish prepping a truck in time. What do you do?',o:['Send it in and hope the tunnel gets it','Signal the driver\'s side and Tunnel Captain so the car is not loaded half-prepped','Skip the wheels','Tell the customer to come back another day'],a:1,why:'The tunnel does not get a second chance. Signal rather than send a car in unprepped.'}
    ]},
  { id:'p4', title:'Quality Control at the Exit', minutes:4,
    why:`You are the only person who sees the finished product on every car. The Tunnel Captain sees the equipment, the MSA sees the pay station, and the GM sees the numbers. If a dirty car gets past you, nobody at Mighty Wash sees it again until the customer decides not to come back. The rewash rule exists because a free re-run costs a minute and a lost member costs months.`,
    html:`<p class="lead">The last ten seconds of the wash are yours. Every car gets a look, every time.</p>
    <h2>Inspect every car</h2>
    <ul><li>Rear bumper and tailgate: the most common miss.</li><li>Lower panels and rockers: road film the tunnel did not lift.</li><li>Mirrors and windshield: water spots and dryer misses.</li><li>Wheels: brake dust still on the face.</li></ul>
    <h2>The rewash rule</h2>
    <p>If a car is not clean, <strong>offer a re-run before the customer asks</strong>. "That rear bumper did not come clean. Pull around and we will run it again, no charge." No debate, no judgment about the car. The customer who asks for a rewash is already annoyed; the one you offer it to is impressed.</p>
    <h2>Damage</h2>
    <p>If anything looks unusual at the exit, a hanging piece of trim, a mirror folded wrong, a new mark, tell the Tunnel Captain immediately and note the vehicle. Do not argue with a customer about damage and do not say whose fault it was. Get a leader.</p>
    <h2>Send them off well</h2>
    <p>Wave, make eye contact, and thank them. Point members and first-timers to the vacuums and the interior lane. Keep the exit clear so cars do not bunch up at the dryer.</p>`,
    quiz:[
      {q:'A car exits with a dirty rear bumper. The customer has not noticed. What do you do?',o:['Let it go; they did not notice','Offer a re-run before they ask, no charge','Wipe it with a towel while they drive off','Tell the MSA'],a:1,why:'Offer the re-run before the customer asks. It is cheaper than a lost member and it builds trust.'},
      {q:'A customer at the exit says the wash scratched their door. What is your first move?',o:['Explain that the tunnel cannot scratch cars','Apologize for the experience, do not argue or assign fault, note the vehicle, and get the Tunnel Captain','Offer a free wash to end the conversation','Tell them to call corporate'],a:1,why:'Never argue and never admit or deny fault. Get a leader and document the vehicle.'},
      {q:'Which area is the most common miss at the exit?',o:['Hood','Rear bumper and tailgate','Roof','Windshield'],a:1,why:'The rear takes the least mechanical action in most tunnels. Check it on every car.'},
      {q:'Why does the exit need to stay clear?',o:['So the cameras can see the lot','So cars do not bunch up at the dryer and the conveyor keeps moving','So the MSA can sell at the exit','So you can take a break'],a:1,why:'Bunching at the exit backs up the dryer and the conveyor. Keep cars moving off the belt.'}
    ]},
  { id:'p5', title:'Appearance, Conduct, and the Greeting', minutes:4,
    why:`A customer cannot see the chemistry or the conveyor. They see you. A phone in your hand says nobody is paying attention; a greeting from across the lot says this place is run well. And the Leadership Manual is clear: the next new hire learns the real standard from what you do, not from what the handbook says.`,
    html:`<p class="lead">Your appearance and conduct are part of the product. These are the same rules the GM is held to.</p>
    <ul><li><strong>Uniform and dress code</strong> every shift, as issued. Clean, complete, and name visible if your site uses name tags.</li><li><strong>No personal cell phone</strong> on the lot or in front of customers. Phones stay in your locker or vehicle unless a leader says otherwise.</li><li><strong>No vaping</strong> on the lot or in view of customers.</li><li><strong>Greet every customer within the first 10 feet.</strong> Eye contact, a wave, a word. Members by name when you know it.</li><li><strong>Respect</strong> in every interaction, with customers and with each other. No side conversations while a customer is in front of you.</li></ul>
    <h2>When a customer has a problem</h2>
    <p>Listen all the way through. Apologize for the experience. If you can fix it on the spot, do it. If you cannot, get a leader and stay with the customer until the leader arrives. Never send a customer away to "call someone".</p>
    <div class="callout"><div class="eyebrow red">You set a standard too</div><p><em>Whatever you let slide in front of a new hire becomes their version of normal. The standard you walk past is the standard you accept.</em></p></div>`,
    quiz:[
      {q:'How soon should a customer be greeted?',o:['When they reach the pay station','Within the first 10 feet of the lot','After the wash','Only if they look at you'],a:1,why:'Greet every customer within the first 10 feet, every shift.'},
      {q:'Where is your personal phone during a shift?',o:['In your pocket on silent','Off the lot, unless a leader says otherwise','In your hand if the lot is empty','Clipped to your belt'],a:1,why:'No personal phone on the lot or in front of customers, even when the lot is empty. The cameras and the team both notice.'},
      {q:'A customer has a complaint you cannot fix. What do you do?',o:['Tell them to call corporate','Listen, apologize, get a leader, and stay with them until the leader arrives','Offer a free wash and move on','Explain company policy'],a:1,why:'Listen, apologize, get a leader, and stay with the customer. Never send them away to call someone.'},
      {q:'A veteran coworker vapes behind the tunnel out of sight. Why does it still matter?',o:['It does not, if customers cannot see','The standard is no vaping on the lot, and the next new hire learns normal from what they see','Only the GM has to follow conduct rules','It only matters on camera'],a:1,why:'The rule is the lot, not the line of sight. And what new hires see tolerated becomes their standard.'}
    ]},
  { id:'p6', title:'Opening, Closing, and Site Readiness', minutes:4,
    why:`The Regional Manager checks three things on camera every morning: did the site open on time, did a test car run before the first customer, and was the site cleaned the night before. Those three are checked daily because they are the foundation of everything else. A site that opens late and dirty has already lost the day's first members.`,
    html:`<p class="lead">A customer-ready site is built the night before and confirmed the morning of.</p>
    <h2>Closing: the nightly clean</h2>
    <ul><li>Trash cans emptied and relined, including the vacuum area.</li><li>Vacuum area blown or swept, hoses hung, nozzles checked.</li><li>Pay stations and menu boards wiped. Screens clean.</li><li>Tunnel bay and exit hosed down. Towels restocked.</li><li>Restrooms cleaned and stocked if your site has them.</li><li>Anything broken or missing written down for the leader.</li></ul>
    <h2>Opening</h2>
    <ul><li>The site opens on time, every day. If it will be late for any reason, the leader reports it to leadership immediately.</li><li>The Tunnel Captain runs a <strong>test car</strong> before the first customer. You check it at the exit like any other car.</li><li>Walk the lot once: trash, hoses, signs, anything a customer would notice.</li></ul>
    <h2>During the day</h2>
    <p>Report maintenance issues that affect customers (a dead vacuum, a flickering sign, a leaking hose) to your leader right away. Follow up if it is still broken tomorrow.</p>`,
    quiz:[
      {q:'When does the test car run?',o:['After the first customer','Before the first customer','At noon','Only on Mondays'],a:1,why:'A test car runs before the first customer so the first paying car gets a proven wash.'},
      {q:'Who verifies opening time, the test car, and the nightly clean?',o:['The GM, by walking the lot','The Regional Manager, by camera each morning','Corporate, monthly','Nobody; it is on the honor system'],a:1,why:'The RM checks all three by camera every morning.'},
      {q:'When is the thorough site clean done?',o:['First thing in the morning','The night before, so the site opens customer-ready','During slow periods','Once a week'],a:1,why:'The nightly clean is done the night before so the site opens customer-ready.'},
      {q:'A vacuum is dead and customers are noticing. What do you do?',o:['Put an out-of-order sign on it and move on','Report it to your leader promptly and follow up if it is still down tomorrow','Try to fix it yourself','Wait for the RM visit'],a:1,why:'Maintenance affecting customer experience is reported promptly and followed until resolved.'}
    ]}
  ]}],
  scenarios:[
    {t:'The dropped towel',s:'A drying towel blows off the rack into the tunnel. Cars are running through. The Tunnel Captain is at the far end of the lot.',o:['Wait for a gap between cars and dart in to grab it.','Call or signal the Tunnel Captain and wait. Nobody enters until the equipment is stopped.','Grab it with a broom handle from the entrance.','Leave it until closing.'],a:1,why:'Nobody enters a running tunnel for any reason. Signal the Tunnel Captain; it comes out when the equipment stops.'},
    {t:'Bugs on the bumper',s:'A car comes off the belt with bug residue still on the front bumper. The customer is already pulling toward the vacuums and has not noticed.',o:['Let it go. They did not notice.','Wave them down and offer a re-run before they ask, no charge.','Mention it to the MSA so she can offer a discount next time.','Wipe it with a towel as they roll by.'],a:1,why:'Offer the re-run before the customer asks. A free minute of tunnel time beats a member who quietly decides the wash does not work.'},
    {t:'The scratch',s:'At the exit, a customer gets out and points at a mark on his door. He is angry and says the wash did it.',o:['Tell him the tunnel cannot scratch paint.','Apologize for the experience without saying whose fault it is, ask him to pull aside, note the vehicle, and get the Tunnel Captain.','Offer a free wash so he leaves.','Hand him the corporate phone number.'],a:1,why:'Never argue and never admit or deny fault. Document the vehicle and get a leader. The claim process starts from there.'},
    {t:'Empty lot, buzzing phone',s:'It is a slow Tuesday afternoon. No cars on the lot. Your phone buzzes in your pocket.',o:['Check it quickly; there are no customers.','Leave it. No personal phone on the lot, and the camera and the new hire across the lot both see what normal looks like.','Step behind the tunnel to check it.','Check it only if it buzzes twice.'],a:1,why:'The rule is the lot, not the customer count. A new hire who sees you check it learns that the phone rule is optional.'},
    {t:'Skip the restrooms',s:'Closing time. A tenured coworker says the restrooms looked fine this morning and you can skip them tonight.',o:['Skip them; he has been here longer.','Clean them to standard. The nightly clean is the whole list, and the RM sees the result on camera and on the next visit.','Clean them halfway.','Report him to the GM.'],a:1,why:'The nightly clean is the full checklist. Tenure does not change the standard, and the site opens customer-ready or it does not.'}
  ],
  assessment:[
    {q:'Membership should be what share of company revenue?',o:['25 to 35%','50%','75 to 80%','100%'],a:2},
    {q:'Who restarts the tunnel after an emergency stop?',o:['Anyone once it is clear','The Tunnel Captain or shift leader, after checking the cause','The customer','The MSA'],a:1},
    {q:'When is an injury reported?',o:['If it needs treatment','Same shift, every time','Weekly','Never for minor ones'],a:1},
    {q:'First area to prep on the passenger side?',o:['Wheels','Front bumper and grille','Rear','Roof'],a:1},
    {q:'A car exits dirty. The customer has not noticed. You ...',o:['let it go','offer a re-run before they ask','wipe it with a towel','tell the MSA'],a:1},
    {q:'A customer claims damage at the exit. You ...',o:['explain it was not the wash','apologize for the experience, do not assign fault, note the vehicle, get a leader','offer a free wash','give them the corporate number'],a:1},
    {q:'Greet every customer within ...',o:['the first 10 feet','30 seconds','the pay station','the exit'],a:0},
    {q:'Personal phones on the lot are ...',o:['fine when it is slow','not allowed','allowed on silent','allowed for managers'],a:1},
    {q:'The test car runs ...',o:['after the first customer','before the first customer','at closing','weekly'],a:1},
    {q:'The thorough site clean happens ...',o:['in the morning','the night before','when it is slow','on Mondays'],a:1}
  ],
  ack:{ statement:'I have completed the Quality Control / Passenger Side Prep training. I know the safety rules, the prep standard, the exit quality check, the conduct rules, and the site readiness standard, and I will perform them on every shift.' }
};

const L2 = { id:'l2', num:2, title:"Driver's Side Prep", short:"Driver's Side Prep", draft:true,
  role:'You load every vehicle onto the conveyor, prep the driver\'s side, and are the last safety check before the tunnel.',
  blurb:'Loading, driver-side prep, damage pre-check, pace, member handoffs, and teaching the passenger side.',
  why:`Loading is where most tunnel incidents and most damage claims begin. The driver's side prep is also the first face-to-face moment with the customer. This level is about doing both well at pace.`,
  courses:[{ id:'l2c', title:"Driver's Side Prep", lessons:[
  { id:'d1', title:'Loading the Tunnel', minutes:6,
    why:`A vehicle loaded wrong can jump the roller, hit the car ahead, or drag equipment. Almost every tunnel collision traces back to a loading mistake: a car in gear, a wheel off the guide, a mirror left out, a gap that closed. The loader is the last safety check before the belt, and the instructions you give the driver are the only ones they will get.`,
    html:`<p class="lead">You guide every vehicle onto the conveyor. The customer is trusting you to tell them exactly what to do.</p>
    <h2>The driver instructions, every car</h2>
    <ol class="steps"><li><strong>"Pull forward slowly, follow my hand."</strong> Guide the driver-side tire onto the conveyor guide rail.</li><li><strong>"Stop."</strong> Clear stop signal, palm up.</li><li><strong>"Put it in neutral, hands off the wheel, foot off the brake."</strong> Say all three, every time, even to members.</li><li><strong>"Mirrors in, wipers off, windows up."</strong> Fold the driver mirror yourself if the customer cannot.</li></ol>
    <h2>Hand signals</h2>
    <p>Use the same signals every time: come forward (wave in), stop (palm out), turn left or right (point). Big, slow, visible. Stand where the driver can see you in the windshield, never beside the front wheel.</p>
    <h2>Spacing</h2>
    <p>Load on the roller the Tunnel Captain calls. Too close and vehicles touch in the tunnel; too far and throughput drops. At peak, one roller gap is the standard unless the Captain says otherwise.</p>
    <h2>What does not go in</h2>
    <ul><li>Vehicles over the posted height or width, or that exceed the site's lift and tire limits.</li><li>Trailers, hitches that will catch equipment, bike racks, and open beds with loose cargo.</li><li>Roof cargo, ladders, loose trim, cracked windshields, and anything the customer will not let you fold or remove.</li><li>When in doubt, call the Tunnel Captain. A turned-away car is a conversation; a damaged car is a claim.</li></ul>`,
    quiz:[
      {q:'Which three instructions does every driver get before loading?',o:['Windows down, radio off, lights on','Neutral, hands off the wheel, foot off the brake','Park, parking brake on, engine off','Drive, foot on brake, steer straight'],a:1,why:'Neutral, hands off the wheel, foot off the brake. Say all three to every driver, including members who have heard it a hundred times.'},
      {q:'Where do you stand while guiding a vehicle onto the guide rail?',o:['Beside the front wheel','Where the driver can see you through the windshield','Behind the vehicle','Inside the tunnel entrance'],a:1,why:'Stand in the driver\'s line of sight and clear of the wheels and the conveyor.'},
      {q:'A pickup arrives with a loaded open bed and a ball hitch. What do you do?',o:['Load it; the tunnel can handle it','Do not load it until the Tunnel Captain checks it; loose cargo and hitches damage equipment and vehicles','Load it with extra spacing','Ask the customer to hold the cargo down'],a:1,why:'Open beds with loose cargo and hitches are on the do-not-load list. Call the Captain.'},
      {q:'What is the standard spacing at peak?',o:['Bumper to bumper','One roller gap unless the Tunnel Captain says otherwise','Three rollers','Whatever the driver prefers'],a:1,why:'One roller gap keeps throughput up without vehicles touching in the tunnel.'}
    ]},
  { id:'d2', title:"Driver's Side Prep Standard", minutes:4,
    why:`The driver's side is the side the customer gets out on. It is also the side they see first at the exit. The driver-side prep carries the same areas as the passenger side plus the greeting and the loading, so the sequence has to be tight or the belt starves.`,
    html:`<p class="lead">Same prep standard as the passenger side, plus the greeting and the load. The order makes it fit.</p>
    <h2>Sequence per car</h2>
    <ol class="steps"><li><strong>Greet</strong> as the car approaches. Eye contact, "Welcome to Mighty Wash."</li><li><strong>Prep</strong> front bumper and grille, driver-side lower panels, wheels and wells, mirror and handles. Rear bumper if the passenger side has not reached it.</li><li><strong>Load</strong> with the full driver instructions and hand signals.</li><li><strong>Confirm</strong> neutral and hands off before you wave the next car up.</li></ol>
    <h2>Coordination</h2>
    <ul><li>Call the rear: whichever side reaches the rear bumper first says so. Do not both skip it.</li><li>On a heavy-soil day, agree with the passenger side and the Tunnel Captain whether to slow the belt rather than send cars in unprepped.</li><li>Wipers: confirm off before the car enters. A wiper arm caught in the mitter is a claim.</li></ul>
    <h2>Technique reminders</h2>
    <p>A foot from the paint, keep moving, angle across seams, back off on loose trim and damaged paint. Hoses out of the lane.</p>`,
    quiz:[
      {q:'What is the sequence per car on the driver\'s side?',o:['Load, prep, greet','Greet, prep, load, confirm','Prep, greet, load','Load, confirm, prep'],a:1,why:'Greet as they approach, prep, load with full instructions, confirm neutral and hands off, then wave up the next car.'},
      {q:'Both sides are busy and neither has reached the rear bumper. What is the rule?',o:['Skip it; the tunnel gets the rear','Call it: whichever side reaches it first says so, so it is never skipped by both','The passenger side always does the rear','The driver side always does the rear'],a:1,why:'Call the rear out loud so it is never skipped by both sides.'},
      {q:'Why confirm the wipers are off before the car enters?',o:['It saves the customer\'s battery','A wiper arm caught in the tunnel equipment is a damage claim','The sensors need it','It is not important'],a:1,why:'Wiper arms snag cloth and mitters. Confirm off, every car.'}
    ]},
  { id:'d3', title:'Reading the Car: Damage Pre-Check', minutes:4,
    why:`Most damage claims are about damage that was already there. A thirty-second look before loading, and one sentence to the customer, turns a dispute into a conversation that already happened. It also keeps real problems, a loose bumper cover or a cracked mirror, out of the tunnel where they become real damage.`,
    html:`<p class="lead">Look at every car before it loads, and say what you see.</p>
    <h2>What to look for</h2>
    <ul><li>Loose or hanging trim, bumper covers, side moldings, and emblems.</li><li>Cracked or loose mirrors, mirror caps, and antennas.</li><li>Aftermarket parts: spoilers, light bars, bug deflectors, wraps, and tint peeling at the edges.</li><li>Pre-existing scratches, dents, and rust where paint could lift.</li><li>Roof racks, cargo boxes, and anything strapped on.</li></ul>
    <h2>When in doubt, point it out</h2>
    <p>Say it to the customer before loading: "I noticed your mirror cap is loose. The wash could pull it. Do you want to go ahead, or take it off first?" Then tell the Tunnel Captain. If the customer chooses to proceed, the Captain decides whether to load. A customer who heard you say it before the wash does not argue about it after.</p>
    <h2>Flag it, do not just remember it</h2>
    <p>Anything you flag gets to the Tunnel Captain before the car loads. If your site uses a pre-wash note or a tag, use it. Memory does not hold up in a claim; a note does.</p>`,
    quiz:[
      {q:'You see a loose mirror cap before loading. What do you do?',o:['Load the car; it is probably fine','Tell the customer what you see and why it matters, then tell the Tunnel Captain before loading','Pull the cap off and hand it to the customer','Load with extra spacing'],a:1,why:'Say it to the customer before the wash, then flag it to the Captain. The Captain decides whether to load.'},
      {q:'Why does the pre-check matter for claims?',o:['It proves the tunnel is safe','Most claims are about damage that was already there; a pre-check and one sentence turn a dispute into a conversation that already happened','It is required by insurance','It lets you refuse cars'],a:1,why:'A customer who heard you point it out before the wash does not argue about it after.'},
      {q:'Where does a flagged item go?',o:['In your memory','To the Tunnel Captain before the car loads, and on the site\'s pre-wash note or tag','To the MSA','To corporate'],a:1,why:'Flag it to the Captain before loading and record it. Memory does not hold up in a claim.'}
    ]},
  { id:'d4', title:'Pace and Throughput', minutes:4,
    why:`On a Saturday the line is the business. Every empty roller is a car that waited longer, and a long line is the number one reason customers pull out and leave. Pace is not rushing; it is a rhythm where prep, load, and belt speed match so the tunnel never starves and never jams.`,
    html:`<p class="lead">The tunnel can only wash what you load. Your rhythm sets the site's capacity.</p>
    <h2>The rhythm</h2>
    <ul><li>The Tunnel Captain sets belt speed for the conditions. Your prep time per car has to fit it. On a clean-car day that is quick; on a mud day the Captain slows the belt rather than you skipping prep.</li><li>Keep one car staged behind the one you are prepping. Greet it while the prep gun is still in your hand.</li><li>Never let the belt run empty while cars are waiting. If you are falling behind, say so; the Captain or a Supervisor can add a prepper.</li></ul>
    <h2>Watch the line</h2>
    <p>When the line backs up past the pay station, tell the MSA so they can work the line and keep customers from pulling out. When the vacuums are full, tell the exit so they can direct traffic.</p>
    <h2>Pace never beats safety</h2>
    <p>A fast load with a car in gear is slower than a careful one, because the stop that follows costs five minutes. Instructions and signals do not get shortened at peak.</p>`,
    quiz:[
      {q:'Who sets belt speed?',o:['The loader','The Tunnel Captain, for the conditions','The customer','The GM, by schedule'],a:1,why:'The Captain sets belt speed. Prep fits the belt; on a heavy-soil day the belt slows rather than prep being skipped.'},
      {q:'You are falling behind at peak. What do you do?',o:['Skip the wheels to catch up','Say so; the Captain or Supervisor can add a prepper','Shorten the driver instructions','Load two cars at once'],a:1,why:'Speak up. Adding a prepper is the answer; shortcuts on prep or instructions are not.'},
      {q:'The line is backing up past the pay station. Who needs to know?',o:['Nobody; it will clear','The MSA, so they can work the line and keep customers from leaving','The customers','Corporate'],a:1,why:'The MSA can work the line, answer questions, and keep customers from pulling out.'}
    ]},
  { id:'d5', title:'Members and First-Timers on the Lot', minutes:4,
    why:`Conversion happens at the pay station, but the handoff happens on the lot. You can see who is new before the MSA can. A first-timer who is greeted, helped, and introduced to the MSA is far more likely to join than one who figures out the menu alone. And a member who is thanked by name stays longer.`,
    html:`<p class="lead">You are not the salesperson, but you are the first step of the sale.</p>
    <h2>Members</h2>
    <ul><li>The pay station recognizes members by tag or plate. If you can see the name or the member lane, use it: "Thanks for being a member, Mr. Garza."</li><li>Members are the base. Treat every one like the #1 customer of the day.</li></ul>
    <h2>Spotting first-timers</h2>
    <ul><li>Reading the menu board slowly, hesitating at the pay station, asking what the packages are, or asking "how does this work?"</li><li>Out-of-town plates and rental cars.</li></ul>
    <h2>The handoff</h2>
    <p>Point them to the Sales Booth, or wave the MSA over on a site without one: "First time? Sarah in the booth can get you set up. Members wash unlimited for about the price of two washes." Then let the MSA do the W.A.S.H. You do not need to pitch, and you never pressure. Your job is to make sure every first-timer meets an MSA.</p>`,
    quiz:[
      {q:'What is your role in the sale as a prepper?',o:['Close the membership at the loading point','Spot first-timers and hand them to an MSA; never pressure','Explain all three packages','None; stay out of sales'],a:1,why:'Spot and hand off. The MSA runs W.A.S.H.; you make sure every first-timer meets one.'},
      {q:'Which of these is a sign of a first-timer?',o:['Member lane','Reading the menu board slowly and hesitating at the pay station','Folded mirrors','A clean car'],a:1,why:'Hesitation at the menu or pay station, questions about how it works, out-of-town plates.'},
      {q:'How do you treat a member you recognize?',o:['Skip the greeting; they know the drill','Thank them by name when you can; they are the base','Tell them about MVP','Move them to the front'],a:1,why:'Members are the base. Thank them by name when you can and give them the full standard.'}
    ]},
  { id:'d6', title:'Teaching the Passenger Side', minutes:4,
    why:`Most new hires at Mighty Wash learn the job from the driver's side prepper, not from a manager. The Leadership Manual says a new hire builds their model of normal from whoever they stand next to in the first shifts. That is you. How you teach the passenger side decides what standard the site has in two weeks.`,
    html:`<p class="lead">When a new QC / Passenger Side Prep starts, you are their first model of what normal looks like.</p>
    <h2>Set the standard in specific words</h2>
    <p>Not "keep the car clean." Instead: "Front bumper first, then lower panels, then wheels. Every car." Specific standards can be checked; vague ones cannot.</p>
    <h2>Show, then watch</h2>
    <ul><li>Do the first few cars yourself while they watch. Narrate what you are doing and why.</li><li>Then they do it while you watch. Correct in the moment, out loud, with the standard: "Lower panels first on this one, the film is heavy."</li><li>Recognize it when they get it right. "That bumper was perfect." People repeat what gets noticed.</li></ul>
    <h2>Hold it from day one</h2>
    <p>A new hire will hold your standard until they see one exception go by. If you skip the wheel wells when it is busy, that is the standard they learned. Enforce it evenly for yourself first.</p>`,
    quiz:[
      {q:'Which is a specific, teachable standard?',o:['"Do a good job on every car"','"Front bumper first, then lower panels, then wheels, every car"','"Be customer-focused"','"Use your judgment"'],a:1,why:'Specific standards can be observed and corrected. Vague ones cannot.'},
      {q:'How do you correct a new hire who skipped the wheels?',o:['Mention it at the end of the week','In the moment, out loud, with the standard','Report it to the Supervisor','Do the wheels yourself without saying anything'],a:1,why:'Correct in the moment and say the standard, so the correction reads as the rule.'},
      {q:'A new hire watches you skip the wheel wells on a busy day. What did they learn?',o:['That you are efficient','That wheel wells are optional when it is busy','Nothing; they were not paying attention','That the Captain sets the pace'],a:1,why:'They learned the real standard from what they saw. Enforce it on yourself first.'}
    ]}
  ]}],
  scenarios:[
    {t:'Lifted truck with a roof box',s:'A lifted pickup with oversized tires and a cargo box on the roof pulls up. The customer says he washes here all the time.',o:['Load it; he says he has done it before.','Check it against the site limits and call the Tunnel Captain before loading. If it is outside limits, it does not go in, politely.','Load it with extra spacing.','Ask him to drive through without the belt.'],a:1,why:'Site limits do not change because a customer says so. The Captain decides, and a turned-away car is a conversation while a damaged one is a claim.'},
    {t:'Foot on the brake',s:'A customer keeps her foot on the brake after you have given the instructions. The car is on the roller and the belt is moving.',o:['Wave the next car up; she will figure it out.','Stop signal, repeat the instruction clearly and make sure she takes her foot off before the roller engages. If she will not, signal the Captain to stop.','Knock on the window and move on.','Let it go; the roller will push through.'],a:1,why:'A car braking against the roller is how vehicles jump the belt. Repeat the instruction, confirm, and stop the belt if needed.'},
    {t:'The growing gap',s:'It is Saturday. The passenger side prepper is chatting with a customer and the belt has run empty for two rollers while six cars wait.',o:['Say nothing; it is not your job to correct them.','Say it in the moment: "Belt is empty, let\'s go," and keep loading. Mention it to the Supervisor if it keeps happening.','Report them to the GM after the shift.','Slow down to match them.'],a:1,why:'Correct in the moment, out loud, with the standard. An empty belt at peak is lost cars.'},
    {t:'Reading the menu',s:'A car with out-of-state plates sits at the pay station for a long time. The driver is scrolling the screen and looking at the menu board.',o:['Wait; they will pick something.','Walk over, greet them, and bring the MSA in: "First time? Sarah can get you set up."','Pick Mighty Protector for them so the line moves.','Tell them to pull forward so the line moves.'],a:1,why:'That is a first-timer. Your job is the handoff to the MSA, not the pitch.'},
    {t:'The new hire and the wheel wells',s:'The new QC prepper you are training skips the wheel wells on three cars in a row. It is busy and you are loading.',o:['Let it go until it slows down.','Between cars, say the standard out loud: "Wheels and wells every car, even when it is busy," and watch the next one.','Do the wells yourself from your side.','Tell the Supervisor at the end of the day.'],a:1,why:'Correct in the moment with the standard. They are building their model of normal right now.'}
  ],
  assessment:[
    {q:'Every driver is told: neutral, hands off the wheel, and ...',o:['lights on','foot off the brake','radio off','engine off'],a:1},
    {q:'Standard spacing at peak is ...',o:['bumper to bumper','one roller gap unless the Captain says otherwise','three rollers','the customer\'s choice'],a:1},
    {q:'An open bed with loose cargo ...',o:['loads normally','does not load until the Captain checks it','loads with extra spacing','loads if the customer insists'],a:1},
    {q:'Before the car enters, confirm the wipers are ...',o:['on','off','on intermittent','does not matter'],a:1},
    {q:'You see a loose mirror cap before loading. First you ...',o:['load it','say it to the customer and flag the Captain before loading','remove it','ignore it'],a:1},
    {q:'Belt speed is set by ...',o:['the loader','the Tunnel Captain','the customer','the schedule'],a:1},
    {q:'Falling behind at peak, you ...',o:['skip prep','say so and get a prepper added','shorten instructions','load two cars'],a:1},
    {q:'Your role in membership sales is to ...',o:['close the sale','spot first-timers and hand them to an MSA','explain pricing','stay out of it'],a:1},
    {q:'A new hire learns the real standard from ...',o:['the handbook','what they see you do in the first shifts','the GM','the quiz'],a:1},
    {q:'A correction should be given ...',o:['at the weekly meeting','in the moment, out loud, with the standard','by the GM only','in writing'],a:1}
  ],
  ack:{ statement:"I have completed the Driver's Side Prep training. I can load vehicles safely with full instructions and signals, prep to standard at pace, pre-check for damage, hand off first-timers, and teach the passenger side standard to a new hire." }
};

const L3 = { id:'l3', num:3, title:'Tunnel Captain', short:'Tunnel Captain', draft:true,
  role:'You own the wash process from the loading point to the exit: equipment, chemistry, stops, quality, and the lot crew when no Supervisor is on.',
  blurb:'Startup and shutdown, chemistry and quality, stops and jams, damage claims, and leading the crew.',
  why:`The Tunnel Captain is the first level where you are responsible for a result you do not produce with your own hands. Clean, dry, safe cars out the exit, all day, is the job. Everything in this level is how that happens.`,
  courses:[{ id:'l3c', title:'Tunnel Captain', lessons:[
  { id:'t1', title:'Owning the Tunnel', minutes:4,
    why:`A tunnel that is down costs every car in the line and every member who drives past the closed sign. A tunnel that is up but washing poorly costs more slowly and quietly. The Captain is the person on the lot who can see both coming, which is why this level exists between prep and supervision.`,
    html:`<p class="lead">The Tunnel Captain owns four things: the equipment runs, the chemistry is right, the cars come out clean and dry, and nobody gets hurt in the tunnel.</p>
    <h2>Your day</h2>
    <ul><li><strong>Before open:</strong> startup checklist and the test car.</li><li><strong>During the day:</strong> walk the tunnel every hour. Listen for changes. Watch the exit. Set belt speed for the conditions.</li><li><strong>When something goes wrong:</strong> you own the stop, the recovery, and the report.</li><li><strong>Close:</strong> shutdown checklist, chemical levels for tomorrow, and the log.</li></ul>
    <h2>Lead when no Supervisor is on</h2>
    <p>When you are the senior person on the lot, you are the qualified leader on that shift. Assignments, breaks, pace, corrections, and customer escalations come to you until a Supervisor or manager arrives.</p>
    <h2>Log it</h2>
    <p>Every stop, every chemical change, every maintenance issue goes in the daily log and, if it touched a customer, in the Notes feature. The GM and the RM manage from what is written down.</p>`,
    quiz:[
      {q:'What are the four things the Tunnel Captain owns?',o:['Sales, labor, scheduling, and admin','Equipment up, chemistry right, clean dry cars, and nobody hurt in the tunnel','Opening, closing, the cash drawer, and the schedule','Prep, loading, the exit, and vacuums'],a:1,why:'Equipment runs, chemistry is right, cars come out clean and dry, and nobody gets hurt in the tunnel.'},
      {q:'How often do you walk the tunnel during the day?',o:['Once at open','Every hour','Only when something sounds wrong','At close'],a:1,why:'Every hour. Changes in sound, spray pattern, or foam are the early warning.'},
      {q:'A Supervisor calls out and you are the senior person on the lot. What are you?',o:['Still just the Captain','The qualified leader on that shift until a Supervisor or manager arrives','Off the hook for the exit','In charge of the pay station only'],a:1,why:'Every shift needs a qualified leader. When it is you, assignments, pace, corrections, and escalations are yours.'}
    ]},
  { id:'t2', title:'Startup and Shutdown', minutes:6,
    why:`The RM checks the test car on camera every morning because a test car proves the whole system before a paying customer is in it. The startup checklist is what makes the test car pass. Shutdown is tomorrow's startup: chemical that ran out overnight is a tunnel that opens late.`,
    html:`<p class="lead">Startup is a fixed sequence. Do it the same way every day so a miss stands out.</p>
    <h2>Startup checklist</h2>
    <ol class="steps"><li><strong>Air and water.</strong> Compressor at operating pressure, no leaks. Water supply and reclaim system on and at pressure.</li><li><strong>Chemicals.</strong> Every drum has enough for the day. Lines primed. No dry tips. If a drum will not make it through peak, swap it now, not at 2 pm.</li><li><strong>Conveyor.</strong> Walk it. Rollers up and down cleanly, no debris on the belt, guide rail clear. Run it empty.</li><li><strong>Friction and mitters.</strong> Cloth and brushes intact, nothing tangled, spinning free.</li><li><strong>Arches and nozzles.</strong> Spray patterns even. A plugged nozzle shows up as a streak on the test car.</li><li><strong>Dryers.</strong> All blowers running, no rattles.</li><li><strong>Lights, signage, pay stations, vacuums.</strong> Everything a customer touches.</li><li><strong>Test car.</strong> Run it before the first customer. Inspect it at the exit like a customer's car. Fix what it shows before opening.</li></ol>
    <h2>Shutdown checklist</h2>
    <ul><li>Belt and equipment stopped and powered down per site procedure.</li><li>Chemical levels noted for tomorrow. Anything low on the order list tonight.</li><li>Tunnel bay hosed, drains clear, reclaim pit checked.</li><li>Any issue from the day written in the log for the GM.</li></ul>
    <h2>Late open</h2>
    <p>If the test car fails or equipment will not start, the leader reports to leadership immediately. A late open is never hidden; the RM sees it on camera anyway.</p>`,
    quiz:[
      {q:'A drum of presoak will probably run out mid-afternoon. When do you swap it?',o:['When it runs out','At startup, before peak','At shutdown','Next week'],a:1,why:'Swap it at startup. A tunnel that loses chemical at 2 pm on a Saturday washes poorly for an hour before anyone notices.'},
      {q:'What does the test car prove?',o:['That the pay station works','The whole system, before a paying customer is in it','That the lot is clean','That the crew is on time'],a:1,why:'The test car proves the system end to end. Inspect it at the exit like any customer\'s car.'},
      {q:'A plugged nozzle usually shows up as ...',o:['a loud noise','a streak on the test car','a late open','nothing visible'],a:1,why:'Uneven spray leaves a streak. The test car finds it before a customer does.'},
      {q:'The tunnel will not start and the site will open late. What happens?',o:['Open quietly when it is fixed','The leader reports to leadership immediately','Wait until the RM calls','Send customers to another site'],a:1,why:'Late openings are reported immediately. The RM sees opening time on camera regardless.'}
    ]},
  { id:'t3', title:'Chemistry and a Clean Car', minutes:5,
    why:`A clean car is five things working together: the right chemical, enough dwell time, mechanical friction, a full rinse, and a dry finish. When quality drops, it is almost always one of the five, and the Captain is the person who can tell which. Guessing wastes chemical and washes cars poorly while you guess.`,
    html:`<p class="lead">You do not need to be a chemist. You need to recognize the signs and know what to check.</p>
    <h2>The five parts of a clean car</h2>
    <div class="tablewrap"><table><tr><th>Part</th><th>What it does</th><th>When it is off, you see</th></tr>
    <tr><td class="k">Chemical</td><td>Presoak loosens film; soap carries it; drying agent and wax finish it</td><td>Film left on lower panels, poor foam, no beading</td></tr>
    <tr><td class="k">Dwell</td><td>Chemical needs seconds on the surface before friction</td><td>Clean on top, dirty low; belt too fast for the soil</td></tr>
    <tr><td class="k">Friction</td><td>Cloth and brushes lift what chemical loosened</td><td>Streaks in a pattern, same spot every car</td></tr>
    <tr><td class="k">Rinse</td><td>Removes chemical and dirt before drying</td><td>Haze, residue, spots after drying</td></tr>
    <tr><td class="k">Dry</td><td>Drying agent plus blowers</td><td>Water sheets, drips from mirrors, wet rear</td></tr></table></div>
    <h2>Rules</h2>
    <ul><li>Check concentration on the schedule the vendor and GM set for your site. Record it.</li><li>Never dilute a drum to stretch it, and never mix products.</li><li>Low chemical is called in before it is out. Out of chemical on a Saturday is a GM conversation.</li><li>When quality drops mid-day: check the exit, then the chemical tips and flows, then the belt speed, then friction. In that order.</li></ul>`,
    quiz:[
      {q:'Cars are coming out clean on top but filmy on the lower panels. Most likely cause?',o:['Dryers','Not enough dwell or presoak reaching the lower panels','The pay station','Too much rinse'],a:1,why:'Clean high and dirty low points to chemical and dwell on the lower panels. Check presoak flow and belt speed.'},
      {q:'A streak shows up in the same place on every car. Most likely cause?',o:['Chemical concentration','A friction or nozzle issue in a fixed position','The customer\'s paint','Dwell time'],a:1,why:'Same spot, every car, is mechanical: a plugged nozzle, a tangled mitter, a brush out of position.'},
      {q:'A drum is nearly out and the delivery is tomorrow. What do you do?',o:['Dilute it to stretch it','Call it in now and tell the GM; never dilute or mix','Mix in a similar product','Run without it'],a:1,why:'Never dilute or mix. Call it in before it is out, and tell the GM so the site is not surprised.'},
      {q:'Quality drops mid-day. What is the first check?',o:['Belt speed','The exit, to see what the cars actually look like','Friction','Chemical order'],a:1,why:'Look at the cars first. The symptom tells you which of the five to check next.'}
    ]},
  { id:'t4', title:'Stops, Jams, and Recovery', minutes:5,
    why:`A stop handled well is a five-minute delay and a story the customer tells about how calm the crew was. A stop handled badly is an injury or a damaged car. The sequence below exists so that nobody has to improvise with a vehicle on the belt and a line out to the street.`,
    html:`<p class="lead">Stop first, think second, restart last.</p>
    <h2>When to stop</h2>
    <ul><li>A person or animal in the tunnel. Always.</li><li>A vehicle off the roller, turned on the belt, or touching the vehicle ahead.</li><li>A door, hatch, or hood opening. Brake lights on and holding.</li><li>Equipment noise, smoke, or a piece of equipment hanging into the path.</li></ul>
    <h2>Recovery sequence</h2>
    <ol class="steps"><li><strong>Stop the belt.</strong> Emergency stop. Say "Stopping" to the lot.</li><li><strong>Customers stay in their cars.</strong> Tell them through the window. Nobody gets out in the tunnel.</li><li><strong>Assess from outside the path.</strong> Never go under or between vehicles on the belt.</li><li><strong>Clear it with two people.</strong> One directs, one acts. Back a vehicle off a roller only with the driver following your signals.</li><li><strong>Check equipment</strong> before restart: nothing tangled, nothing hanging, belt clear.</li><li><strong>Restart</strong> only you or the shift leader, with a "Restarting" call to the lot.</li><li><strong>Log it</strong> and tell the GM: what happened, which car, any damage, how long down.</li></ol>
    <h2>Talk to the line</h2>
    <p>Send someone to the pay station and the line: "Short stop, two minutes, we will have you through." Customers wait for information; they leave for silence.</p>`,
    quiz:[
      {q:'A customer\'s hatch opens in the tunnel. What do you do first?',o:['Call to them to close it','Stop the belt','Run in and close it','Speed up to get them through'],a:1,why:'Stop first. Then instruct the customer through the window. Nobody enters a running tunnel.'},
      {q:'During a jam, where do customers stay?',o:['They should get out and wait at the exit','In their cars','In the tunnel walkway','At the pay station'],a:1,why:'Customers stay in their vehicles. Nobody gets out in the tunnel.'},
      {q:'How many people clear a vehicle off a roller?',o:['One, quickly','Two: one directs, one acts, with the driver following signals','Three','The customer alone'],a:1,why:'Two people, with the driver following signals. Nobody goes under or between vehicles on the belt.'},
      {q:'After the restart, what is left to do?',o:['Nothing','Log it and tell the GM: what, which car, any damage, how long down','Apologize to the whole line','Reset the chemical'],a:1,why:'Every stop is logged and reported. The GM and RM manage from what is written.'}
    ]},
  { id:'t5', title:'Damage Claims', minutes:5,
    why:`How the first five minutes of a claim go decides whether it costs the company a conversation or a check. A customer who is heard, who sees you take photos and pull the camera, and who gets a clear next step usually stays a customer. A customer who is argued with calls corporate angry, and now it costs twice.`,
    html:`<p class="lead">You are not deciding the claim. You are making sure it can be decided fairly, and keeping the customer.</p>
    <h2>The first five minutes</h2>
    <ol class="steps"><li><strong>Move them aside</strong> so the exit keeps flowing, and give them your full attention.</li><li><strong>Listen all the way through.</strong> Then: "I am sorry this happened on your visit. Let me get this documented properly."</li><li><strong>Do not admit or deny fault.</strong> Not "the wash did that" and not "that was already there." Both are decisions you do not make.</li><li><strong>Photograph</strong> the damage, the whole panel, and the vehicle from four corners. Note plate, time, and which wash package.</li><li><strong>Pull the camera footage</strong> of the load and the tunnel while it is fresh, or tell the GM to.</li><li><strong>Fill out the incident form</strong> and put the interaction in Notes.</li><li><strong>Give the next step:</strong> "Our GM reviews every claim and will contact you by [when]." Get their name and number.</li><li><strong>Escalate same day</strong> to the Supervisor or GM. Corporate makes the decision.</li></ol>
    <h2>What not to say</h2>
    <p>"That was already there." "Our tunnel cannot do that." "You should have folded your mirror." Even when true, each one turns a claim into a fight.</p>`,
    quiz:[
      {q:'A customer says the wash broke his antenna. Which response is correct?',o:['"Our tunnel cannot do that."','"That was already loose."','"I am sorry this happened on your visit. Let me get this documented properly."','"You should have taken it off."'],a:2,why:'Acknowledge the experience, never admit or deny fault, and move to documentation.'},
      {q:'Who decides a damage claim?',o:['The Tunnel Captain on the spot','The customer','Corporate, after the GM reviews it','The MSA'],a:2,why:'You document and escalate. Corporate decides.'},
      {q:'What goes in the documentation?',o:['Photos of the damage only','Photos of the damage, panel, and vehicle; plate, time, package; camera footage; incident form; Notes','A verbal description to the GM','The customer\'s statement only'],a:1,why:'Full documentation lets the claim be decided fairly. Memory and one photo do not.'},
      {q:'When does the claim get escalated?',o:['At the weekly meeting','Same day, to the Supervisor or GM','When the customer calls back','Never; handle it on site'],a:1,why:'Same day. The customer was promised a next step and the footage is still fresh.'}
    ]},
  { id:'t6', title:'Leading the Crew', minutes:4,
    why:`The Captain is usually the first leadership role at Mighty Wash. The Leadership Manual's rules apply from here up: the standard you walk past is the standard you accept, and a crew learns what is required from what you correct and what you recognize, not from what the handbook says.`,
    html:`<p class="lead">When you lead the lot, the standards are yours to hold.</p>
    <h2>Run the shift</h2>
    <ul><li><strong>Assignments.</strong> Who is on passenger prep, driver prep, exit, vacuums. Rotate so everyone stays sharp and nobody is stuck.</li><li><strong>Breaks.</strong> Scheduled, covered, and taken. An uncovered lane at peak is a lost member.</li><li><strong>Pace.</strong> Set belt speed, watch the line, call for help before you need it.</li></ul>
    <h2>Hold the standard</h2>
    <ul><li>Correct in the moment, out loud, with the standard. "Wheels every car; let's get that one."</li><li>Correct everyone the same way, the veteran and the new hire, in view of each other.</li><li>Recognize the standard being met, by name, today. "Marcus, that exit check caught two rewashes. That is the job."</li><li>If you catch yourself thinking "I'll let it go this once," that is the moment the standard resets.</li></ul>
    <h2>Hand off</h2>
