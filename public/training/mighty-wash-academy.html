const L5 = { id:'l5', num:5, title:'Assistant General Manager', short:'Assistant GM', draft:true,
  role:'Second in command. You run the site in the GM\'s absence and own scheduling, daily numbers, onboarding, readiness, and administration alongside the GM.',
  blurb:'Scheduling and labor, daily numbers, hiring and the first two weeks, site readiness, administration, and escalations.',
  why:`The AGM is the GM in training. Every GM Standard applies to the site on the days the GM is off, and the AGM is who holds it. This level is the GM Standards from the second chair.`,
  courses:[{ id:'l5c', title:'Assistant General Manager', lessons:[
  { id:'c1', title:'Second in Command', minutes:4,
    why:`The GM Standards say the site's standards do not take a day off, and they single out Sundays and Mondays because that is when GMs are typically off. The AGM is the reason that sentence can be true. A site with a strong AGM runs the same on Sunday as on Wednesday.`,
    html:`<p class="lead">The GM owns the site. On the GM's days off, you do, to the same standard.</p>
    <h2>What the AGM owns</h2>
    <ul><li>The site on the GM's days off, start to finish: opening, test car, conversion, coverage, nightly clean.</li><li>The schedule, with the GM.</li><li>Daily numbers review on the mornings you open.</li><li>Onboarding every new hire's first two weeks.</li><li>Administration: Notes, Hellowash, email, calendar, maintenance follow-up.</li></ul>
    <h2>Work as one leadership team</h2>
    <ul><li>Same standards, same corrections, same words. The team should not be able to tell which of you is on by how the site runs.</li><li>Daily sync with the GM: numbers, issues, people. Five minutes.</li><li>Know where the site stands on every GM Standard. You will be measured on them next.</li></ul>
    <h2>Your Road Map</h2>
    <p>The AGM who runs the site to GM standard is the GM candidate. Ask the GM and the RM where you stand and what it takes.</p>`,
    quiz:[
      {q:'Why do the GM Standards call out Sundays and Mondays?',o:['They are the slowest days','They are the days GMs are typically off, and standards do not take a day off','Corporate audits on those days','Fleet accounts are billed then'],a:1,why:'The AGM is who holds the standard on the GM\'s days off.'},
      {q:'What should the team notice about the site when the AGM is on versus the GM?',o:['A more relaxed pace','Nothing; same standards, same corrections, same words','Different priorities','Fewer MSAs on the lot'],a:1,why:'One leadership team, one standard.'},
      {q:'What is the daily sync with the GM?',o:['A weekly meeting','Five minutes on numbers, issues, and people','An email at month end','Not needed'],a:1,why:'Numbers, issues, people, every day, five minutes.'}
    ]},
  { id:'c2', title:'Scheduling and Labor', minutes:6,
    why:`Labor is the largest controllable cost and the most direct lever on sales. The GM Standards call scheduling a core competency, not a support function, because the schedule is where coverage, cost, and sales get decided every week. Too thin at peak and members drive off unsold; too heavy and the budget breaks.`,
    html:`<p class="lead">A schedule is a forecast of traffic with people assigned to it.</p>
    <h2>Build it from traffic</h2>
    <ol class="steps"><li>Pull the last few weeks of cars by day and hour. Saturdays, after-work weekdays, and the day after rain are your peaks.</li><li>Staff the tunnel first: loader, passenger prep, exit QC, Captain. Then MSAs on every pay lane at peak. Then vacuums and interior.</li><li>A qualified leader on every shift, including the GM's days off. Write their name on the shift.</li><li>Check labor against budget. Trim the shoulders of the day before you trim peak.</li><li>Publish on time, every week, so the team can plan their lives.</li></ol>
    <h2>Manage it live</h2>
    <ul><li>Weather changes everything. Rain forecast: cut hours early. Rain cleared: call people in.</li><li>Call-outs: fill the lane before the shift starts, not during.</li><li>Overtime is a decision, not an accident. Approve it or prevent it.</li></ul>
    <div class="callout"><div class="eyebrow red">The rule</div><p><em>An unstaffed lane is a lost member. Never save labor at the pay station at peak.</em></p></div>`,
    quiz:[
      {q:'In what order do you staff a shift?',o:['MSAs first, then tunnel','Tunnel crew first, then MSAs on every lane at peak, then vacuums and interior','Vacuums first','Whoever is available'],a:1,why:'The tunnel has to run; then every lane needs a seller at peak; then the rest.'},
      {q:'Labor is over budget. Where do you trim first?',o:['Peak MSA coverage','The shoulders of the day, before and after peak','The Tunnel Captain','The qualified leader'],a:1,why:'Trim the slow edges of the day. Never the pay lanes at peak.'},
      {q:'Rain is forecast for the afternoon. What do you do?',o:['Keep the schedule; it might not rain','Cut hours early and call people back if it clears','Send everyone home now','Nothing; the GM decides'],a:1,why:'Manage in real time when weather or volume changes.'},
      {q:'Why is the schedule published on time?',o:['Payroll needs it','So team members can plan; it is a GM Standard','Corporate tracks it','It is not important'],a:1,why:'Publish schedules on time so team members can plan.'}
    ]},
  { id:'c3', title:'Daily Numbers', minutes:5,
    why:`The GM Standards expect a GM to know conversion, member sales, churn, and labor every day and act without being told. The AGM has to read the same numbers, because on the mornings you open there is no one else to review yesterday's conversion with the MSA team. A number you do not look at until Friday cost you four days.`,
    html:`<p class="lead">Four numbers, every morning. Then act on them that day.</p>
    <div class="tablewrap"><table><tr><th>Number</th><th>What it is</th><th>What you do with it</th></tr>
    <tr><td class="k">Conversion</td><td>New Members divided by eligible retail customers, yesterday</td><td>Under 15%: which MSA, which hours, coach today. Under 10%: expect an RM review; have the plan ready.</td></tr>
    <tr><td class="k">Member sales</td><td>Sign-ups and MVP upgrades by MSA</td><td>Recognize the top seller by name. Retrain below standard.</td></tr>
    <tr><td class="k">Churn</td><td>Cancels and failed payments</td><td>Failed cards get called this week. Cancel reasons from Notes go to the GM.</td></tr>
    <tr><td class="k">Labor</td><td>Hours and cost against budget and against cars washed</td><td>Adjust today's shoulders. Approve or stop overtime.</td></tr></table></div>
    <h2>Where the numbers live</h2>
    <p>The SiteWatch General Sales Report and the Flexwash accounting report. Review both. When they disagree, flag the discrepancy; do not pick the one you like.</p>
    <h2>The morning review</h2>
    <p>Yesterday's conversion is reviewed every morning and gaps are addressed with the MSA team that day. In the huddle: the number, the goal, one thing to do differently today.</p>`,
    quiz:[
      {q:'Yesterday\'s conversion was 12%. What happens this morning?',o:['Nothing; it is above the floor','Find which MSA and which hours, and coach it today','Wait for the weekly review','Change the target'],a:1,why:'Below 15% is a gap. Gaps are addressed with the MSA team the same day.'},
      {q:'The SiteWatch report and the Flexwash report disagree. You ...',o:['use the higher one','flag the discrepancy','use the lower one','ignore both'],a:1,why:'Review both and flag discrepancies. That is the standard.'},
      {q:'A failed payment shows in churn. What is the action?',o:['Cancel the Member','Contact them this week to update the card','Wait a cycle','Email corporate'],a:1,why:'Credit card churn is recovered by calling the same week.'}
    ]},
  { id:'c4', title:'Hiring and the First Two Weeks', minutes:5,
    why:`The Leadership Manual calls the hiring window the highest-leverage moment a leader has: a new hire holds the stated standard for about as long as it takes them to see one exception go unaddressed. The AGM runs onboarding, so the AGM decides what the new hire's version of normal is.`,
    html:`<p class="lead">What you say at hiring only survives if it matches what the new hire sees in the first two weeks.</p>
    <h2>At hiring: be specific, not aspirational</h2>
    <p>Not "we are customer-focused." Instead: "Every associate greets customers within the first 10 feet of the lot, every shift. No phones on the lot. Every car gets an exit check." Say the standards that will be enforced, in the words you will use to enforce them.</p>
    <h2>Days 1 to 3: show</h2>
    <ul><li>Pair them with your most consistent performer, not whoever is free.</li><li>Level 1 Academy lessons completed before the first solo shift.</li><li>You check in at the end of each shift: what did you see enforced today?</li></ul>
    <h2>Days 4 to 14: hold</h2>
    <ul><li>Correct their first miss in the moment, out loud, with the standard. That first correction teaches more than the interview did.</li><li>Recognize their first standard met, by name, in front of the team.</li><li>MSA hires: W.A.S.H. trained and observed before they work the lanes alone.</li></ul>
    <h2>The exception rule</h2>
    <p>If a new hire sees a veteran skip a standard and nothing happens, your hiring conversation is gone. Enforce evenly, especially in week one.</p>`,
    quiz:[
      {q:'Which hiring statement will survive the first two weeks?',o:['"We are a customer-first team"','"Every associate greets customers within the first 10 feet, every shift"','"We expect a lot here"','"Just do your best"'],a:1,why:'Specific and observable. It can be seen met or missed and corrected.'},
      {q:'Who does a new hire shadow in the first shifts?',o:['Whoever is free','Your most consistent performer','The newest employee','The GM'],a:1,why:'Their model of normal is built from whoever they stand next to.'},
      {q:'A new MSA has watched W.A.S.H. twice. Can they work the lanes alone?',o:['Yes','Not until they are trained and observed doing it to standard','Yes, if it is busy','Yes, with a script'],a:1,why:'Every new MSA is trained on W.A.S.H. before working the lanes alone.'},
      {q:'What ends a hiring conversation\'s effect fastest?',o:['A long first week','Seeing a veteran skip the standard with no correction','Too much training','A slow day'],a:1,why:'One exception unaddressed resets the new hire\'s standard.'}
    ]},
  { id:'c5', title:'Site Readiness and Maintenance', minutes:4,
    why:`On-time open, test car, and nightly clean are checked by the RM on camera every morning because they are the three things that fail quietly and cost immediately. Maintenance follow-up is in the standards because a broken vacuum reported once and forgotten is the same as never reported.`,
    html:`<p class="lead">Verify, do not assume. Then follow every issue until it is closed.</p>
    <h2>Every morning you open</h2>
    <ul><li>Doors open on time. If not, report to leadership immediately, before the RM sees it on camera.</li><li>Test car ran before the first customer, inspected at the exit.</li><li>Nightly clean verified against the checklist, not "looks fine."</li></ul>
    <h2>Maintenance</h2>
    <ol class="steps"><li>Anything affecting the customer experience is reported the day it is found: vacuums, pay stations, lights, signs, gates, tunnel equipment.</li><li>One list, one owner. Each item has a date reported, who is fixing it, and a status.</li><li>Follow until resolved. Check the list daily. Chase the vendor. Tell the GM what is still open and for how long.</li><li>Maintenance priorities are reviewed with the RM weekly. Bring the list.</li></ol>
    <h2>Walk the lot as a customer</h2>
    <p>Once a shift, from the entrance to the exit, through the vacuums. What would a first-timer notice? Fix it or list it.</p>`,
    quiz:[
      {q:'How do you confirm the nightly clean happened?',o:['Ask the closer','Verify against the full checklist','Assume it did','Check the camera at noon'],a:1,why:'Verify against the checklist. The RM is verifying on camera; so should you.'},
      {q:'A maintenance item was reported last week and is still open. What is the standard?',o:['It was reported; that is enough','Follow it until resolved: chase the vendor and tell the GM how long it has been open','Report it again next month','Remove it from the list'],a:1,why:'Reported and forgotten is the same as never reported. Follow until resolved.'},
      {q:'How often are maintenance priorities reviewed with the RM?',o:['Daily','Weekly, at the site visit','Quarterly','Never'],a:1,why:'Weekly site visits cover maintenance priorities.'}
    ]},
  { id:'c6', title:'Administration', minutes:4,
    why:`A multi-site company runs on the written record and the calendar. The admin standards exist because every one of them is a place where a customer, a vendor, or a colleague is waiting on the site: a Hellowash ticket is a customer who already called, an unanswered invite is a meeting that does not happen, and a missing Note is a history nobody can pick up.`,
    html:`<p class="lead">The same administration standards the GM is reviewed on. You share them.</p>
    <div class="tablewrap"><table><tr><th>Area</th><th>Standard</th></tr>
    <tr><td class="k">Notes feature</td><td>Every meaningful customer interaction, issue, and resolution, so anyone can pick up the history.</td></tr>
    <tr><td class="k">Hellowash tickets</td><td>Review and close out tickets from the AI answering service for your site promptly. Each one is a customer who already reached out.</td></tr>
    <tr><td class="k">Email and calendar</td><td>Respond in a timely manner. Accept or decline every Google Calendar invite.</td></tr>
    <tr><td class="k">Virtual meetings</td><td>Cameras on for every Google Meet call.</td></tr>
    <tr><td class="k">Fleet accounts</td><td>Contact and support Fleet accounts using the company's established process. Keep account information current.</td></tr>
    <tr><td class="k">Refunds</td><td>Direct customers to corporate. Do not quote the refund amount.</td></tr>
    <tr><td class="k">Sales reporting</td><td>Review SiteWatch General Sales Report and Flexwash accounting report. Flag discrepancies.</td></tr></table></div>
    <h2>Make it a routine</h2>
    <p>Fifteen minutes at open and fifteen at close: Hellowash, email, calendar, Notes from the shift, maintenance list. Done daily, admin is small. Done weekly, it is a Saturday.</p>`,
    quiz:[
      {q:'What is a Hellowash ticket?',o:['A maintenance request','A customer contact from the AI answering service that needs review and close-out','A fleet invoice','An RM note'],a:1,why:'Each ticket is a customer who already reached out. Close them promptly.'},
      {q:'A Google Calendar invite arrives. The standard is ...',o:['respond if you can attend','accept or decline every invite','ignore it if busy','forward to the GM'],a:1,why:'Accept or decline every invite. Respond to email in a timely manner.'},
      {q:'Why do interactions go in Notes?',o:['Corporate audits it','So anyone can pick up the history without the customer re-explaining','To track employees','They do not need to'],a:1,why:'Notes let the next person pick up where the last one left off.'}
    ]},
  { id:'c7', title:'Escalations and Judgment', minutes:4,
    why:`The GM Standards say: solve problems before they reach your Regional Manager, and when you escalate, bring the issue and your plan. The AGM makes the same judgment one level down. Most of what reaches a GM on their day off should have been handled, and what does reach them should arrive with a recommendation.`,
    html:`<p class="lead">Handle what you can. Escalate what you must. Always with a plan.</p>
    <h2>Decide at your level</h2>
    <ul><li><strong>Customer complaints:</strong> listen, apologize, fix it today if it is within your authority (rewash, interior redo, a Note and a follow-up call).</li><li><strong>Damage claims:</strong> documented by the Captain, reviewed by you the same day, sent up for the corporate decision. You do not promise an outcome.</li><li><strong>Refunds:</strong> corporate. No amount quoted.</li><li><strong>Staffing:</strong> call-outs, swaps, and sending people home are yours.</li><li><strong>Conduct:</strong> correct in the moment. Repeated misses: document and tell the GM.</li></ul>
    <h2>Escalate to the GM when</h2>
    <ul><li>A standard is being missed repeatedly by the same person.</li><li>A claim, injury, or incident involves police, an ambulance, or a threat.</li><li>Equipment is down with no fix in sight.</li><li>A decision will cost money beyond your authority.</li></ul>
    <h2>How to escalate</h2>
    <p>"Here is what happened. Here is what I have done. Here is what I recommend. Do you agree?" One message. The GM can say yes from their phone.</p>`,
    quiz:[
      {q:'Which of these do you handle without escalating?',o:['An injury requiring an ambulance','A rewash and a follow-up call for a complaint','A refund amount','A repeated conduct problem'],a:1,why:'Complaints you can fix today are yours. Injuries, refunds, and repeated misses go up.'},
      {q:'What does a good escalation message contain?',o:['The problem','What happened, what you did, what you recommend','Who is to blame','A request for the GM to come in'],a:1,why:'Bring the issue and your plan. The GM can answer from their phone.'},
      {q:'A damage claim is reviewed by the AGM and then ...',o:['decided by the AGM','sent up for the corporate decision, same day','paid from petty cash','closed if the customer does not call back'],a:1,why:'Document, review same day, send up. Corporate decides.'}
    ]}
  ]}],
  scenarios:[
    {t:'Saturday versus budget',s:'Labor is tracking 6% over budget this week. Saturday\'s schedule has two MSAs on each pay lane for the afternoon peak.',o:['Cut one MSA from each lane Saturday afternoon.','Keep peak coverage and trim the weekday shoulders and Saturday open and close instead.','Cut the Tunnel Captain\'s hours.','Ask the GM to raise the budget.'],a:1,why:'Trim the shoulders, never the pay lanes at peak. An unstaffed lane is a lost Member.'},
    {t:'Sunday call-out',s:'Sunday morning, the GM\'s day off. The scheduled Supervisor calls out an hour before open. You are at home.',o:['Let the Tunnel Captain run it and check in by text.','Fill the leader role: come in yourself or confirm a qualified leader is on before open. Report the call-out to the GM in the daily sync.','Open late with whoever shows up.','Close for the morning.'],a:1,why:'Every shift has a qualified leader, especially Sundays. The site\'s standards do not take a day off.'},
    {t:'Nine percent',s:'You open Monday and yesterday\'s conversion was 9%.',o:['Note it and watch the week.','Pull the MSA and hourly breakdown, address it with the MSA team in the huddle, coach live today, and have a plan ready for the RM review the floor triggers.','Change Sunday\'s target.','Wait for the GM on Tuesday.'],a:1,why:'Gaps are addressed with the MSA team the same day. Under 10% triggers an RM review; bring the plan.'},
    {t:'Tickets piling up',s:'There are eleven open Hellowash tickets for your site, some a week old.',o:['They are mostly simple; leave them for the GM.','Work them today, starting with the oldest. Each is a customer who already reached out. Then make the open-and-close routine so it never stacks again.','Close them all without reading.','Ask corporate to turn off Hellowash.'],a:1,why:'Tickets are reviewed and closed promptly. Build the daily routine so it stays small.'},
    {t:'The wrong trainer',s:'A Supervisor paired the new QC hire with a tenured prepper who cuts corners, because he was free.',o:['Leave it; the Supervisor made the call.','Move the new hire to your most consistent performer today and explain the standard to the Supervisor: new hires pair with the best, not the available.','Correct the tenured prepper in front of the new hire.','Wait for the 30-day review.'],a:1,why:'The new hire\'s model of normal is being built right now. Pair them with the most consistent performer and teach the Supervisor why.'}
  ],
  assessment:[
    {q:'Sundays and Mondays are called out because ...',o:['they are slow','GMs are typically off and standards do not take a day off','corporate audits','fleet billing'],a:1},
    {q:'Shifts are staffed in this order ...',o:['MSAs, tunnel, vacuums','tunnel crew, MSAs on every lane at peak, then vacuums and interior','vacuums first','whoever is available'],a:1},
    {q:'Over budget, trim ...',o:['peak lanes','the shoulders of the day','the Captain','the leader'],a:1},
    {q:'Schedules are published ...',o:['when ready','on time, every week','monthly','by corporate'],a:1},
    {q:'The four daily numbers are ...',o:['cars, cash, hours, tickets','conversion, member sales, churn, labor','revenue, cost, profit, churn','opens, test cars, cleans, audits'],a:1},
    {q:'Two reports disagree. You ...',o:['use the higher','flag the discrepancy','use the lower','ignore it'],a:1},
    {q:'A new hire shadows ...',o:['whoever is free','your most consistent performer','the newest','the GM'],a:1},
    {q:'A new MSA works lanes alone ...',o:['on day one','after W.A.S.H. training and observation','after a week','never'],a:1},
    {q:'A maintenance item is ...',o:['reported once','followed until resolved','the vendor\'s problem','reviewed quarterly'],a:1},
    {q:'A Hellowash ticket is ...',o:['a maintenance note','a customer who already reached out','a fleet invoice','spam'],a:1},
    {q:'A good escalation contains ...',o:['the problem','what happened, what you did, what you recommend','blame','a request to come in'],a:1},
    {q:'Refund amounts are ...',o:['quoted by the AGM','never quoted; corporate','estimated','paid on site'],a:1}
  ],
  ack:{ statement:'I have completed the Assistant General Manager training. I can run the site to the General Manager Standards in the GM\'s absence, build and manage a schedule, act on the daily numbers, onboard new hires through their first two weeks, keep the site ready and the administration current, and escalate with a plan.' }
};

const L7 = { id:'l7', num:7, title:'Regional Manager', short:'Regional Manager', draft:true,
  role:'You own a region of sites and get results through General Managers. You verify daily, visit weekly, coach continuously, and review quarterly with the VP.',
  blurb:'Multiplying GMs, the daily verification rhythm, site visits that change behavior, coaching and improvement plans, developing the bench, reading the region, and the quarterly meeting.',
  why:`The GM Standards name the Regional Manager as the person who verifies, visits, audits, and coaches. This level is the other side of that document: how an RM does those things so that seven or more sites run to one standard without the RM running any of them.`,
  courses:[{ id:'l7c', title:'Regional Manager', lessons:[
  { id:'r1', title:'Multiplying General Managers', minutes:4,
    why:`A Regional Manager who runs the best site in the region has failed at the job. The RM's result is the region, and the region is only as good as its weakest GM on the RM's day off. Everything in this level is about getting results through people who own their own site.`,
    html:`<p class="lead">You do not run a site. You make GMs who run sites to the standard.</p>
    <h2>What the RM owns</h2>
    <ul><li>Every GM Standard, at every site, verified rather than assumed.</li><li>The daily check, the weekly visit, the ongoing audit and coaching, and the quarterly review, as laid out in the GM Standards.</li><li>GM hiring, development, and the documented improvement plan when coaching is not enough.</li><li>Consistency: the same standard enforced the same way at every site. The Leadership Manual applies to you with GMs exactly as it applies to GMs with MSAs.</li></ul>
    <h2>Results through GMs</h2>
    <ul><li>Ask, do not tell: "What does your conversion say about yesterday, and what is your plan?" The GM who brings the plan is the GM who owns the site.</li><li>Fix the system, not the symptom. One site under the floor is coaching; three sites under the floor is a regional problem you own.</li><li>Your time is the scarcest resource in the region. Spend it where the standard is slipping, not where it is comfortable.</li></ul>`,
    quiz:[
      {q:'What is the RM\'s result?',o:['The best site in the region','The region: every site to the standard, including on the RM\'s day off','Personal site visits','The audit scores'],a:1,why:'The region is the result, and it is only as good as its weakest GM when the RM is not there.'},
      {q:'Three sites are under the conversion floor this week. What is that?',o:['Three coaching conversations','A regional problem the RM owns: find the common cause','Bad luck','The GMs\' problem'],a:1,why:'One site is coaching. Three is a system problem: pricing, training, staffing, something regional.'},
      {q:'How does the RM apply the Leadership Manual?',o:['It is for GMs only','The same way GMs apply it to MSAs: specific standards, even enforcement, correction in the moment, recognition','Only at the quarterly meeting','By forwarding it'],a:1,why:'The standard you walk past is the standard you accept, at every level.'}
    ]},
  { id:'r2', title:'The Daily Verification Rhythm', minutes:5,
    why:`The GM Standards say the RM verifies opening time, the test car, and the nightly clean by camera every morning, and reviews previous-day conversion. This is in the standards because those four things fail quietly: a late open is not reported unless someone looks, and a site under the floor does not call to say so. Twenty minutes a day is how the RM knows instead of hopes.`,
    html:`<p class="lead">Twenty minutes, every morning, every site, before anything else.</p>
    <h2>The four checks</h2>
    <div class="tablewrap"><table><tr><th>Check</th><th>How</th><th>If it missed</th></tr>
    <tr><td class="k">On-time open</td><td>Camera timestamp vs posted hours</td><td>Call the GM today. Was it reported? If not, that is the bigger miss.</td></tr>
    <tr><td class="k">Test car</td><td>Camera: a vehicle through before the first customer</td><td>Call the GM. Who opened? Is the Captain trained?</td></tr>
    <tr><td class="k">Nightly clean</td><td>Camera at close and at open: trash, vacuums, bay</td><td>Call the GM. Who closed? Was it verified against the checklist?</td></tr>
    <tr><td class="k">Previous-day conversion</td><td>Report by site and MSA</td><td>Under 15%: ask for the plan. Under 10%: the RM review the standard requires, today.</td></tr></table></div>
    <h2>The conversation</h2>
    <p>Coaching first. "Your site opened at 8:12. What happened, and what is the plan so it does not repeat?" Then listen. Log the miss. A pattern over two or three weeks is what moves from coaching to a documented plan.</p>
    <h2>Make it a habit the GMs can feel</h2>
    <p>When GMs know the RM looks every morning, the standard holds on the RM's day off too. When they know the RM looks sometimes, it holds sometimes.</p>`,
    quiz:[
      {q:'What does the RM verify by camera every morning?',o:['Sales Booth staffing','On-time open, test car, and nightly clean','MSA pitches','Labor hours'],a:1,why:'Those three, plus previous-day conversion from the report.'},
      {q:'A site opened late and the GM did not report it. Which is the bigger miss?',o:['The late open','Not reporting it; late openings are reported to leadership immediately','Neither','The camera'],a:1,why:'Late opens happen. Hiding one breaks the standard that lets the RM manage.'},
      {q:'Conversion at a site was 8% yesterday. The standard requires ...',o:['a note for the weekly visit','an RM review today and a conversation with leadership','nothing until it repeats','a new MSA'],a:1,why:'Any day under 10% triggers an RM review and a conversation with leadership.'},
      {q:'What moves a GM from coaching to a documented improvement plan?',o:['A single miss','A repeated or serious gap after coaching','The quarterly meeting','The VP'],a:1,why:'Coaching first. Repeated or serious gaps are addressed through a documented improvement plan.'}
    ]},
  { id:'r3', title:'Site Visits That Change Behavior', minutes:6,
    why:`The GM Standards put site visits, maintenance priorities, and coaching plans on a weekly rhythm. A visit that is a tour changes nothing. A visit with a structure, observed behavior, and one to three commitments is how a GM's site gets better between visits. The structure below is so every GM in the region gets the same visit.`,
    html:`<p class="lead">Every visit, same structure, so the GM knows what good looks like and you can compare sites.</p>
    <h2>Before you arrive</h2>
    <p>Last visit's commitments. This week's numbers. Open maintenance items. Any camera misses this week.</p>
    <h2>On site, in order</h2>
    <ol class="steps"><li><strong>Arrive as a customer.</strong> Pull in, read the menu, use a pay lane, go through the wash, use the vacuums. Note everything a first-timer would.</li><li><strong>Watch the exit</strong> for ten cars. Quality, QC behavior, rewash offers.</li><li><strong>Watch an MSA</strong> work three cars. Full W.A.S.H.? The Hook?</li><li><strong>Walk the tunnel</strong> with the Captain. Startup log, chemical levels, maintenance list.</li><li><strong>Sit with the GM.</strong> Numbers: conversion, MVP, churn, labor. Last visit's commitments: done or not. Maintenance priorities. People: who is ready to move up, who needs coaching.</li><li><strong>Leave one to three commitments</strong>, written, with dates. Not ten.</li></ol>
    <h2>Coaching plan for GMs who need support</h2>
    <p>If a GM is behind on a standard, the visit ends with a coaching plan: the standard, the gap, what the GM will do, what you will do, when you will check. Written down and shared.</p>
    <h2>Audit</h2>
    <p>Site audits are ongoing. Score the same items the same way at every site so the scores mean something at the quarterly meeting.</p>`,
    quiz:[
      {q:'How does the site visit start?',o:['In the GM\'s office','As a customer: pay lane, wash, vacuums','With the audit form','With the tunnel walk'],a:1,why:'See the site the way a first-timer does before anyone knows you are there.'},
      {q:'How many commitments does a visit end with?',o:['As many as needed','One to three, written, with dates','Ten','None; the GM knows'],a:1,why:'One to three gets done. Ten gets filed.'},
      {q:'Why score audits the same way at every site?',o:['Corporate requires it','So the scores can be compared at the quarterly meeting and the standard is the same everywhere','It is faster','It is not important'],a:1,why:'Consistency is what makes an audit a management tool rather than an opinion.'}
    ]},
  { id:'r4', title:'Coaching GMs and the Improvement Plan', minutes:5,
    why:`The GM Standards promise coaching first and a documented improvement plan for repeated or serious gaps. That promise only holds if every RM coaches the same way and documents the same way. Uneven enforcement across GMs does to a region exactly what it does to a lot: the real standard becomes whatever the most lenient RM allows.`,
    html:`<p class="lead">Coaching is a conversation with a structure. The improvement plan is that structure, written down.</p>
    <h2>The coaching conversation</h2>
    <ol class="steps"><li><strong>The standard.</strong> "The test car runs before the first customer, every day."</li><li><strong>The gap.</strong> "Three of the last seven days, it did not."</li><li><strong>The cause,</strong> from the GM, not from you. "What is getting in the way?"</li><li><strong>The commitment.</strong> What the GM will do, by when.</li><li><strong>The check.</strong> When you will look, and what you will see if it worked.</li></ol>
    <h2>The documented improvement plan</h2>
    <p>Used when coaching has not closed a gap, or for a serious miss. It contains: the specific standards missed, with dates; the measure of success; the support you are providing; the timeline; the review dates; and what happens if the plan is not met. Signed by both. Shared with the VP.</p>
    <h2>Even enforcement</h2>
    <ul><li>Your highest-performing GM gets the same conversation about a late open as your newest.</li><li>Correct in the moment: the day of the miss, not at the quarterly meeting.</li><li>Say the standard, not just the correction.</li><li>Recognize the GM who holds the standard on a hard week, by name, to the region.</li></ul>`,
    quiz:[
      {q:'In the coaching conversation, who names the cause?',o:['The RM','The GM, when asked what is getting in the way','The VP','The Supervisor'],a:1,why:'The GM owns the site. The GM names the cause and the commitment.'},
      {q:'What does a documented improvement plan contain?',o:['A warning','Specific standards missed with dates, the measure of success, support, timeline, review dates, and consequences','A list of complaints','A new bonus target'],a:1,why:'Specific, measurable, dated, supported, and signed.'},
      {q:'Your top GM opened late twice this week. What happens?',o:['Nothing; look at the numbers','The same coaching conversation your newest GM would get, this week','A note for the quarterly meeting','A text'],a:1,why:'Enforce evenly. The real standard in the region is whatever the most lenient treatment allows.'}
    ]},
  { id:'r5', title:'Developing the Bench', minutes:4,
    why:`The GM Standards tell GMs to ask their RM where they stand on the Road Map to Success. That only works if the RM has an answer. A region without a bench loses a site's standards every time a GM leaves, and loses good AGMs who did not see a path.`,
    html:`<p class="lead">Every site should have a next GM in it. Your job is to know who, and to tell them.</p>
    <h2>Know the bench</h2>
    <ul><li>For every site: who is the AGM, are they running the site to standard on the GM's days off, and when will they be ready.</li><li>For every AGM: which Supervisor or Captain is next. Ask the GM at every visit.</li><li>Track Academy completion by level across the region. A Supervisor who has finished the AGM level is telling you something.</li></ul>
    <h2>The "where you stand" conversation</h2>
    <p>Once a quarter with every GM, and with every AGM through their GM: where they are on the Road Map, what the next level requires, what they need to show you, and by when. Specific and written. "Keep it up" is not an answer.</p>
    <h2>Promote the standard-holders</h2>
    <p>GMs who consistently meet and exceed the standards are the leaders the company develops and promotes. Promote on standards held, not on tenure or on who asks loudest. The region watches who gets promoted and learns what is valued.</p>`,
    quiz:[
      {q:'What should the RM know about every site\'s bench?',o:['Nothing; the GM handles it','Who the AGM is, whether they run the site to standard on GM days off, and who is next behind them','Only who is leaving','The payroll'],a:1,why:'A region without a bench loses a site\'s standard every time a GM leaves.'},
      {q:'How often is the "where you stand" conversation held?',o:['At hiring only','Once a quarter, specific and written','When someone asks','Annually'],a:1,why:'Quarterly, with the next level\'s requirements and a date.'},
      {q:'Who gets promoted?',o:['The longest tenured','Those who consistently meet and exceed the standards','Whoever asks','The highest conversion only'],a:1,why:'Promote on standards held. The region learns what is valued from who moves up.'}
    ]},
  { id:'r6', title:'Reading the Region', minutes:5,
    why:`A GM can act on one site's numbers. Only the RM can see that four sites dipped the same week, or that one site's churn is twice the others'. Reading the region is how the RM decides where to spend the week, and what is a site problem versus a company problem to bring to the VP.`,
    html:`<p class="lead">Same five numbers, every site, side by side, every week.</p>
    <div class="tablewrap"><table><tr><th>Number</th><th>Standard</th><th>What an outlier usually means</th></tr>
    <tr><td class="k">Conversion</td><td>15 to 18%</td><td>Low at one site: MSA coverage or coaching. Low everywhere: pricing, weather, or training.</td></tr>
    <tr><td class="k">MVP penetration</td><td>25 to 35%</td><td>Low: MVP not presented first, or interior lane quality.</td></tr>
    <tr><td class="k">Churn</td><td>7 to 9%; voluntary 3% or less, card 4% or less</td><td>Card churn high: failed payments not being called. Voluntary high: read the Notes reasons.</td></tr>
    <tr><td class="k">Labor</td><td>Within budget with peak coverage</td><td>High with low conversion: schedule is not matching traffic.</td></tr>
    <tr><td class="k">Audit and camera misses</td><td>Zero late opens, test car and clean every day</td><td>Repeated misses: leadership gap on that shift.</td></tr></table></div>
    <h2>Site problem or regional problem</h2>
    <p>One site off: coach the GM. Most sites off together: look for the shared cause before anyone gets coached. Weather, a price change, a POS issue, a training gap. Fix the cause once.</p>
    <h2>Spend the week on the worst gap</h2>
    <p>Rank the sites on the standard furthest from target. That is where the next visit goes. The comfortable visit to the best site can wait.</p>`,
    quiz:[
      {q:'Card churn is high at one site and normal elsewhere. Most likely?',o:['Pricing','Failed payments are not being called at that site','Weather','The POS'],a:1,why:'Credit card churn is recovered by calling the same week. One site high means that site is not calling.'},
      {q:'Conversion dropped at five of seven sites the same week. First move?',o:['Coach five GMs','Look for the shared cause before coaching anyone','Change the target','Visit the best site'],a:1,why:'Most sites off together is a regional cause. Fix it once.'},
      {q:'Where does the next site visit go?',o:['The best site','The site furthest from standard','The closest site','In rotation'],a:1,why:'Spend the scarcest resource where the standard is slipping.'}
    ]},
  { id:'r7', title:'The GM Quarterly Meeting', minutes:4,
    why:`The GM Standards set the quarterly review and forward planning with the VP of Customer Experience and Field Leadership. For the RM it is the one time each quarter the whole region's results, people, and plans are on one table. A quarter's worth of daily checks and weekly visits should make the preparation easy; if it is hard, the rhythm slipped.`,
    html:`<p class="lead">Arrive with a scorecard per GM, a plan per site, and a view of the region.</p>
    <h2>Per GM</h2>
    <ul><li>Results against every standard: conversion, MVP, churn, labor, readiness, audits, administration.</li><li>Bonus standing per the GM bonus plan, and whether the GM is in good standing on the standards.</li><li>Coaching given, commitments kept, any improvement plan and its status.</li><li>Road Map standing: ready for more, on track, or needs support.</li></ul>
    <h2>Per site</h2>
    <ul><li>The one standard furthest from target and the plan to close it next quarter.</li><li>Maintenance items open more than 30 days.</li><li>Bench: the next GM and the next AGM.</li></ul>
    <h2>The region</h2>
    <ul><li>Shared causes you found and fixed, and the ones you need the VP's help with.</li><li>What you will do differently next quarter in your own rhythm.</li></ul>
    <p>Forward planning means commitments with dates, not a review of the past. Leave with yours written down.</p>`,
    quiz:[
      {q:'Who leads the quarterly review?',o:['The RM','The VP of Customer Experience and Field Leadership','Corporate HR','Each GM'],a:1,why:'Quarterly performance review and forward planning at the GM Quarterly Meeting, by the VP.'},
      {q:'What goes on each GM\'s scorecard?',o:['Conversion only','Results against every standard, bonus standing, coaching and commitments, Road Map standing','Attendance','Site photos'],a:1,why:'Every standard, because the bonus and the promotion decisions rest on all of them.'},
      {q:'If quarterly preparation is hard, what does that tell you?',o:['The quarter was busy','The daily and weekly rhythm slipped','The VP expects too much','Nothing'],a:1,why:'Daily checks and weekly visits should make the quarterly scorecard a summary, not a project.'}
    ]}
  ]}],
  scenarios:[
    {t:'Three days under the floor',s:'One site has posted 9%, 8%, and 9% conversion on three consecutive days. The GM has not called you.',o:['Wait for the weekly visit.','The standard requires an RM review on day one. Call today: the standard, the gap, the GM\'s cause and plan, your check date. Log it; the pattern plus the silence matters.','Email the GM a reminder of the target.','Send an MSA from another site.'],a:1,why:'Any day under 10% triggers an RM review. Three days and no call is two misses: the number and the ownership.'},
    {t:'The clean at the top site',s:'Your best site by conversion skipped the nightly clean twice this week, visible on camera. The GM is your strongest.',o:['Let it go; the numbers are great.','The same coaching conversation any GM would get, this week. Even enforcement is what makes the standard real across the region.','Mention it at the quarterly meeting.','Have the AGM handle it.'],a:1,why:'The region learns the real standard from who gets corrected. Your top GM gets the same conversation as your newest.'},
    {t:'Friend of the family',s:'A GM with repeated late opens after two coaching conversations is someone you have known for years. You are tempted to give it one more quarter.',o:['One more quarter; he will turn it around.','Repeated gaps after coaching get a documented improvement plan. Write it, with support and dates, and share it with the VP. That is what the standard says and what every other GM would get.','Transfer him to a quieter site.','Say nothing until the quarterly meeting.'],a:1,why:'"I\'ll let it go this once" is the moment the standard resets, for RMs too.'},
    {t:'The AGM who is ready',s:'An AGM has run her site to standard on every GM day off for six months and finished the GM level in the Academy. Her GM says she is "not quite ready" but cannot say what is missing.',o:['Defer to the GM.','Ask the GM for the specific standard she has not met. If there is none, she is ready, and the "where you stand" conversation needs to say so with a plan and a date.','Wait for an opening.','Move her to another site as AGM.'],a:1,why:'Promote on standards held. "Not quite ready" without a specific gap is not an answer the Road Map allows.'},
    {t:'Region-wide card churn',s:'Credit card churn rose above 4% at five of seven sites this month.',o:['Coach five GMs on retention.','Find the shared cause first: a POS or billing change, a processor issue, or a region-wide gap in calling failed cards. Fix the cause once, then check each site\'s call list.','Lower the churn target.','Wait a month.'],a:1,why:'Most sites off together is a regional cause. Fix it once before coaching anyone.'}
  ],
