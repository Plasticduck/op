const GM_COURSES = [
{ id:'standards', num:1, title:'General Manager Standards', issued:'Issued by the VP of Customer Experience and Field Leadership, October 2026',
  blurb:'What good looks like at a Mighty Wash site, how your performance is measured, and how your bonus is earned.',
  why:`These standards are the measures your daily RM checks, your quarterly review, and your bonus are built on. Knowing them is how you know where you stand before anyone tells you.`,
  lessons:[
  { id:'a1', title:'The Role of the General Manager', minutes:4,
    why:`Mighty Wash runs on the GM, not on the Regional Manager. The RM covers several sites and sees yours mostly through cameras and reports, so the person who can change tomorrow's result is you. When the GM knows the numbers daily and fixes problems early, issues stay small and the RM's time goes to coaching instead of firefighting. When the GM waits to be told, every problem costs a day or more before anyone acts. Ownership is the first standard because results are made on the lot, and that is where they have to be driven from.`,
    html:`<p class="lead">The General Manager owns the site. Every result at your wash is your responsibility: the way it looks, the way customers are treated, the number of members you sign, and the way your team shows up.</p>
    <p>These standards define what good looks like at Mighty Wash and how your performance, and your bonus, will be measured. The goal is bigger than getting cars clean. Mighty Wash is building a customer experience people choose to come back to, and a membership business that drives the company forward. The GM sets that tone every day.</p>
    <h2>What ownership means</h2>
    <ul>
      <li><strong>Treat the site like your own business.</strong> Its performance, appearance, and reputation are yours.</li>
      <li><strong>Know your numbers daily.</strong> Conversion, member sales, churn, and labor. Act on them without waiting to be told.</li>
      <li><strong>Solve problems before they reach your Regional Manager.</strong> When you do escalate, bring the issue and your plan.</li>
      <li><strong>Lead by example</strong> on professionalism, customer focus, and policy. Your team will mirror your standards.</li>
      <li><strong>Own your site seven days a week,</strong> including the days you are off.</li>
    </ul>
    <div class="callout"><div class="eyebrow red">The standard in one line</div><p><em>Every result at your wash is yours. Know the numbers, fix problems early, and bring a plan when you escalate.</em></p></div>`,
    quiz:[
      {q:'You need to escalate a problem to your Regional Manager. What do you bring?',o:['The issue, so the RM can decide what to do','The issue and your plan for solving it','A list of the team members involved','Nothing until the RM asks for details'],a:1,why:'The standard is to solve problems before they reach your RM, and when you do escalate, bring the issue and your plan.'},
      {q:'Which set of numbers is a GM expected to know every day?',o:['Total revenue only','Labor hours only','Conversion, member sales, churn, and labor','Whatever the weekly report shows'],a:2,why:'GMs know conversion, member sales, churn, and labor daily and act on them without being told.'},
      {q:'When does site ownership apply?',o:['Only on the shifts you are scheduled','Seven days a week, including your days off','Monday through Saturday','Only during peak hours'],a:1,why:'You own your site seven days a week, including the days you are off. Sundays and Mondays get their own standard in the Administration lesson.'}
    ]},
  { id:'a2', title:'Customer Experience and Professionalism', minutes:5,
    why:`Membership is a repeat decision. Every member decides each month whether Mighty Wash is worth keeping, and that decision is made at the pay station, the vacuums, and the tunnel exit, not at corporate. A manager on the lot catches a problem before it becomes a cancellation. The conduct rules matter for the same reason: a phone in hand or vaping in view tells a customer nobody is paying attention, and tells the team the standard is optional. Site readiness is non-negotiable because the first car of the day sets the tone for every car after it, and because it is the easiest thing for the RM to verify on camera.`,
    html:`<p class="lead">Every customer should feel like the #1 customer of the day. Management is expected to be visible, approachable, and active on the lot, not behind a desk or a phone.</p>
    <h2>On the lot</h2>
    <ul>
      <li>Greet customers all over the lot: pay stations, vacuums, tunnel exit, and interior lanes.</li>
      <li>Engage personally with members and first-time visitors. Resolve concerns on the spot whenever possible.</li>
      <li>Express Interiors are delivered to standard every time. Inspect quality and speed throughout the day.</li>
      <li>Every MSA works from the Sales Booth where the site is equipped, so customers know where to go to talk about Membership.</li>
    </ul>
    <h2>Professional conduct (all management)</h2>
    <ul>
      <li><strong>Dress code.</strong> Follow the Mighty Wash dress code at all times and enforce it for your team.</li>
      <li><strong>No cell phones.</strong> No personal cell phone use while on the lot or in front of customers.</li>
      <li><strong>No vaping.</strong> No vaping on the lot or in view of customers.</li>
      <li><strong>Respect.</strong> Speak to customers and team members with respect. No side conversations or behavior that distracts from service.</li>
    </ul>
    <h2>Site readiness, every day</h2>
    <ul>
      <li>Site opens on time, every day. Late openings are reported to leadership immediately.</li>
      <li>A test car is run through the wash before the first customer.</li>
      <li>A thorough cleaning of the site is completed the night before so the site opens customer-ready.</li>
      <li>Maintenance issues affecting customer experience are reported promptly and followed until resolved.</li>
    </ul>
    <div class="callout blue"><div class="eyebrow blue">How it is verified</div><p>Regional Managers verify opening time, the test car, and the nightly clean by camera each morning.</p></div>`,
    quiz:[
      {q:'Who verifies the opening time, test car, and nightly clean, and how?',o:['The GM, in a daily self-report','The Regional Manager, by camera each morning','Corporate, through the sales report','The opening MSA, on a checklist'],a:1,why:'Regional Managers verify all three by camera each morning.'},
      {q:'Which of these is a conduct rule for all management?',o:['MSAs may work from anywhere on the lot instead of the Sales Booth','No personal cell phone use on the lot or in front of customers','Vaping is allowed behind the tunnel','Dress code applies only to MSAs'],a:1,why:'No personal cell phone use while on the lot or in front of customers. Dress code and no vaping apply to everyone too.'},
      {q:'What must happen before the first customer of the day?',o:['The schedule is posted','A test car is run through the wash','The sales report is reviewed','The Sales Booth is opened'],a:1,why:'A test car runs through the wash before the first customer, and the site was cleaned the night before so it opens customer-ready.'},
      {q:'Where does the MSA work on a site that has one?',o:['The tunnel exit','The Sales Booth, so customers know where to go for Membership','The vacuum area','The GM office'],a:1,why:'The Sales Booth is where customers find the MSA and where Memberships get sold.'}
    ]},
  { id:'a3', title:'Sales and Conversion', minutes:7,
    why:`Retail washes are one-time revenue that rises and falls with the weather. Membership is predictable monthly revenue that funds payroll, equipment, and growth, which is why 75 to 80% is the target. Every number in this lesson protects that base: W.A.S.H. so the offer is made to every eligible customer, the 10% floor so a bad day gets attention the same day instead of at month end, MVP because interiors raise revenue per member, and the churn sub-targets because a lost member costs far more to replace than to keep. The GM owns this because MSAs sell the way they are trained and coached, and nobody else is on the lot to do it.`,
    html:`<p class="lead">Membership is the engine of Mighty Wash. The target is for membership to make up 75 to 80% of company revenue. MSAs are one of the most important operational levers, and the GM is responsible for hiring, training, and coaching them to sell.</p>
    <h2>The W.A.S.H. sales framework</h2>
    <div class="wash">
      <div><div class="L">W</div><div class="w">Welcome</div><p>Greet every vehicle warmly and make eye contact. First impressions set up the sale.</p></div>
      <div><div class="L">A</div><div class="w">Answer</div><p>Answer questions clearly and confidently on pricing, plans, and how membership works.</p></div>
      <div><div class="L">S</div><div class="w">Support</div><p>Show the customer how membership fits their needs and saves them money.</p></div>
      <div><div class="L">H</div><div class="w">Hook</div><p>Ask for the sale. Every eligible customer is offered a membership, every time.</p></div>
    </div>
    <h2>Sales targets</h2>
    <div class="tablewrap"><table>
      <tr><th>Metric</th><th>Standard</th><th>Notes</th></tr>
      <tr><td class="k">Conversion rate</td><td class="v">15 to 18%</td><td>20%+ stretch goal in mature markets</td></tr>
      <tr><td class="k">Daily conversion floor</td><td class="v">10%</td><td>Any day under 10% triggers an RM review and a conversation with leadership</td></tr>
      <tr><td class="k">MVP penetration</td><td class="v">25 to 35%</td><td>Of member base. MVP = unlimited exterior + Express Interiors</td></tr>
      <tr><td class="k">Monthly churn</td><td class="v">7 to 9%</td><td>Long-term target. Voluntary churn 3% or less; credit card churn 4% or less</td></tr>
      <tr><td class="k">Membership revenue mix</td><td class="v">75 to 80%</td><td>Company-wide target; every site contributes</td></tr>
    </table></div>
    <h2>GM sales responsibilities</h2>
    <ul>
      <li>Review the previous day's conversion every morning and address gaps with the MSA team that day.</li>
      <li>Train every new MSA on W.A.S.H. before they work the lanes alone. Re-train anyone below standard.</li>
      <li>Coach MSAs live on the lot: observe pitches, give immediate feedback, and recognize wins.</li>
      <li>Actively promote MVP and Express Interiors to grow interior revenue.</li>
      <li>Work to retain members: resolve cancellation reasons, recover failed credit card payments, and protect the base.</li>
    </ul>`,
    quiz:[
      {q:'What do the four letters in W.A.S.H. stand for?',o:['Wash, Ask, Sell, Hold','Welcome, Answer, Support, Hook','Welcome, Approach, Sell, Help','Wave, Answer, Smile, Hook'],a:1,why:'Welcome the vehicle, Answer questions, Support the fit, and Hook by asking for the sale.'},
      {q:'What is the standard conversion rate?',o:['10%','15 to 18%','25 to 35%','75 to 80%'],a:1,why:'15 to 18% is the standard, with 20%+ as the stretch goal in mature markets.'},
      {q:'A day with conversion below what level triggers an RM review?',o:['5%','10%','15%','18%'],a:1,why:'10% is the daily floor. Any day under it triggers an RM review and a conversation with leadership.'},
      {q:'What is an MVP member?',o:['A member for more than 12 months','Unlimited exterior plus Express Interiors','A fleet account','Any member on the Mighty Protector package'],a:1,why:'MVP = unlimited exterior + Express Interiors. The target is 25 to 35% of the member base.'},
      {q:'When should a new MSA be trained on W.A.S.H.?',o:['Within the first 30 days','Before they work the lanes alone','After their first sale','At the next GM meeting'],a:1,why:'Every new MSA is trained on W.A.S.H. before working the lanes alone, and anyone below standard is re-trained.'},
      {q:'What are the churn sub-targets inside the 7 to 9% monthly goal?',o:['Voluntary 3% or less, credit card 4% or less','Voluntary 5% or less, credit card 2% or less','Voluntary 7%, credit card 9%','There are no sub-targets'],a:0,why:'Voluntary churn 3% or less and credit card churn 4% or less. Recovering failed card payments is part of protecting the base.'}
    ]},
  { id:'a4', title:'Labor and Scheduling', minutes:3,
    why:`Labor is the largest cost the GM controls and the most direct lever on sales. Too many people and the budget breaks; too few at the wrong hour and members drive off unsold. Scheduling is a core competency because it is where the GM balances both, every week, by day and hour. A qualified leader on every shift matters because the standard is enforced by whoever is in charge, and if nobody is in charge the standard drops to whatever happens.`,
    html:`<p class="lead">Mighty Wash General Managers are expected to be proficient in labor management and scheduling. This is a core competency of the role, not a support function.</p>
    <ul>
      <li>Build schedules that match staffing to expected traffic by day and hour, including weekends and peak periods.</li>
      <li>Keep labor efficient and within budget without sacrificing customer experience or sales coverage.</li>
      <li>Always schedule enough MSAs to sell during peak volume. <strong>An unstaffed lane is a lost member.</strong></li>
      <li>Ensure a qualified leader is scheduled on every shift, including the GM's days off.</li>
      <li>Manage overtime, call-outs, and shift changes proactively. Adjust in real time when weather or volume changes.</li>
      <li>Publish schedules on time so team members can plan.</li>
    </ul>
    <div class="callout"><div class="eyebrow red">Remember</div><p><em>An unstaffed lane is a lost member. Peak coverage is a sales decision, not just a labor decision.</em></p></div>`,
    quiz:[
      {q:'Complete the standard: "An unstaffed lane is a ..."',o:['labor savings','lost member','maintenance risk','training opportunity'],a:1,why:'Enough MSAs to sell during peak volume is non-negotiable. An unstaffed lane is a lost member.'},
      {q:'What must be true of every shift, including the GM\'s days off?',o:['The GM is reachable by phone','A qualified leader is scheduled','At least four MSAs are on the lot','The RM has approved the schedule'],a:1,why:'A qualified leader is scheduled on every shift, including the GM\'s days off.'},
      {q:'How does Mighty Wash classify labor management and scheduling for GMs?',o:['A support function handled by the RM','A core competency of the role','An optional skill for larger sites','A corporate responsibility'],a:1,why:'It is a core competency of the role, not a support function.'}
    ]},
  { id:'a5', title:'Administration', minutes:5,
    why:`Each line protects something specific. Notes exist so a customer never has to re-explain their history to the next person who picks up the phone. The refund rule exists because quoting a number that corporate later calculates differently turns one complaint into two. A Hellowash ticket is a customer contact that already happened; an open one is a customer still waiting. Email, calendar, and cameras-on are how a multi-site company coordinates without being in the same room. Reviewing the sales reports catches cash and reporting errors while they are still small. Sunday and Monday coverage exists because customers do not know it is the GM's day off.`,
    html:`<p class="lead">Strong administration protects the customer experience behind the scenes. These duties are part of the job and are reviewed alongside your operational results.</p>
    <div class="tablewrap"><table>
      <tr><th>Area</th><th>Standard</th></tr>
      <tr><td class="k">Fleet accounts</td><td>Contact and support Fleet accounts using the company's established process. Keep account information current.</td></tr>
      <tr><td class="k">Notes feature</td><td>Document every meaningful customer interaction, issue, and resolution in the Notes feature so anyone can pick up the history.</td></tr>
      <tr><td class="k">Refunds</td><td>Direct customers to contact corporate for refunds. Do not quote the refund amount to the customer.</td></tr>
      <tr><td class="k">Hellowash tickets</td><td>Review and close out Hellowash (AI answering service) tickets for your site promptly.</td></tr>
      <tr><td class="k">Email and calendar</td><td>Respond to emails in a timely manner and accept or decline every Google Calendar invite.</td></tr>
      <tr><td class="k">Virtual meetings</td><td>Cameras on for every Google Meet call.</td></tr>
      <tr><td class="k">Sales reporting</td><td>Review site sales reports (SiteWatch General Sales Report and Flexwash accounting report) and flag discrepancies.</td></tr>
      <tr><td class="k">Sundays and Mondays</td><td>Prioritize coverage and follow-up on Sundays and Mondays, the days GMs are typically off. Your site's standards do not take a day off.</td></tr>
    </table></div>`,
    quiz:[
      {q:'A customer asks for a refund and wants to know how much they will get back. What do you do?',o:['Quote the amount and process it on site','Direct them to contact corporate and do not quote an amount','Give them a free wash instead','Ask the RM to approve an amount'],a:1,why:'Refunds go through corporate. Do not quote the refund amount to the customer.'},
      {q:'What is Hellowash?',o:['The nightly cleaning checklist','The AI answering service whose tickets you close out promptly','The fleet account portal','The scheduling tool'],a:1,why:'Hellowash is the AI answering service. Review and close its tickets for your site promptly.'},
      {q:'Which two reports does a GM review for discrepancies?',o:['Google Calendar and Notes','SiteWatch General Sales Report and Flexwash accounting report','Hellowash and the fleet log','The RM camera log and labor report'],a:1,why:'Review the SiteWatch General Sales Report and the Flexwash accounting report and flag discrepancies.'},
      {q:'Why do Sundays and Mondays get special attention?',o:['They are the busiest days','They are the days GMs are typically off, and standards do not take a day off','Corporate audits happen then','Fleet accounts are billed then'],a:1,why:'GMs are typically off Sundays and Mondays. Prioritize coverage and follow-up so the site holds its standards.'},
      {q:'What is the expectation for Google Meet calls?',o:['Join by phone if busy','Cameras on for every call','Only the RM needs a camera','Optional during peak hours'],a:1,why:'Cameras on for every Google Meet call.'}
    ]},
  { id:'a6', title:'Bonuses and Career Growth', minutes:3,
    why:`The bonus drivers line up with the standards on purpose. If the bonus paid on one number, GMs would chase that number at the expense of everything else. Tying it to sales, retention, customer experience, labor, and administration means the GM who runs a complete site is the one who earns the most. Good standing as the eligibility rule means the standards are the job, not a side list. The Road Map to Success exists so the path to more pay and more responsibility is written down and the same for everyone, instead of depending on who you know.`,
    html:`<p class="lead">Mighty Wash takes care of its people. The Road Map to Success shows every team member what they can earn, in pay and bonuses, as they grow. GM bonuses reward the results these standards are built around.</p>
    <h2>What drives your bonus</h2>
    <ul>
      <li><strong>Sales and conversion:</strong> hitting conversion, member growth, and MVP penetration targets.</li>
      <li><strong>Retention:</strong> keeping churn within target and protecting the member base.</li>
      <li><strong>Customer experience:</strong> site readiness, cleanliness, audit results, and customer feedback.</li>
      <li><strong>Labor:</strong> running efficient, well-covered schedules within budget.</li>
      <li><strong>Administration and professionalism:</strong> consistent follow-through on the standards in this program.</li>
    </ul>
    <p>Bonus amounts and payout timing follow the current Mighty Wash GM bonus plan. <strong>Bonus eligibility requires the GM to be in good standing on these standards.</strong></p>
    <h2>Growing with Mighty Wash</h2>
    <p>GMs who consistently meet and exceed these standards are the leaders Mighty Wash develops and promotes. Ask your Regional Manager where you stand on the Road Map to Success and what it takes to reach the next level.</p>`,
    quiz:[
      {q:'What is required for bonus eligibility?',o:['Two years of tenure','Being in good standing on the GM standards','A conversion rate above 20%','RM nomination'],a:1,why:'Bonus eligibility requires the GM to be in good standing on the standards.'},
      {q:'Which of these is NOT one of the five bonus drivers?',o:['Retention','Labor','Number of social media posts','Customer experience'],a:2,why:'The five drivers are sales and conversion, retention, customer experience, labor, and administration and professionalism.'},
      {q:'What does the Road Map to Success show?',o:['Site maintenance priorities','What every team member can earn in pay and bonuses as they grow','The weekly schedule template','Fleet account targets'],a:1,why:'It shows what every team member can earn, in pay and bonuses, as they grow. Ask your RM where you stand on it.'}
    ]},
  { id:'a7', title:'How Performance Is Reviewed', minutes:3,
    why:`A fixed review rhythm removes guesswork about where you stand. Daily checks cover the things that have to happen every single day. Weekly site visits handle maintenance and coaching while problems are still cheap. Quarterly reviews look forward instead of back. Coaching comes first because most misses are fixable once they are named, and a documented improvement plan comes second so repeated gaps are handled fairly and the same way at every site.`,
    html:`<p class="lead">Performance is reviewed on a fixed rhythm, and most of it is observable: cameras, reports, site visits, and quarterly planning.</p>
    <div class="tablewrap"><table>
      <tr><th>Frequency</th><th>What is reviewed</th><th>By</th></tr>
      <tr><td class="k">Daily</td><td>On-time opening, test car, nightly clean, previous-day conversion</td><td>Regional Manager (camera and reports)</td></tr>
      <tr><td class="k">Weekly</td><td>Site visits, maintenance priorities, coaching plan for GMs needing support</td><td>Regional Manager</td></tr>
      <tr><td class="k">Ongoing</td><td>Site audits, MSA sales training, customer experience coaching</td><td>Regional Manager</td></tr>
      <tr><td class="k">Quarterly</td><td>Performance review and forward planning at the GM Quarterly Meeting</td><td>VP of Customer Experience and Field Leadership</td></tr>
    </table></div>
    <div class="callout"><div class="eyebrow red">When a standard is missed</div><p>Falling short of a standard leads to coaching first. Repeated or serious gaps are addressed through a documented improvement plan.</p></div>`,
    quiz:[
      {q:'Who leads the quarterly performance review?',o:['The Regional Manager','The VP of Customer Experience and Field Leadership, at the GM Quarterly Meeting','Corporate HR','The site GM, as a self-review'],a:1,why:'Quarterly review and forward planning happen at the GM Quarterly Meeting, led by the VP of Customer Experience and Field Leadership.'},
      {q:'What does the daily review cover?',o:['Labor budget and overtime','On-time opening, test car, nightly clean, and previous-day conversion','Fleet account status','Hellowash tickets'],a:1,why:'Daily: on-time opening, test car, nightly clean, and previous-day conversion, verified by the RM through cameras and reports.'},
      {q:'What is the first response when a GM falls short of a standard?',o:['A written warning','Coaching','Loss of bonus eligibility','A documented improvement plan'],a:1,why:'Coaching comes first. Repeated or serious gaps move to a documented improvement plan.'}
    ]}
  ]},
{ id:'leadership', num:2, title:'Setting and Holding the Standard', issued:'Mighty Wash Leadership Development Series',
  blurb:'How expectations are set, why they slip, and how to hold the line, from hiring day forward.',
  why:`Course 1 only works if the standards are enforced on the lot every day. This course is about the GM behavior that makes them real, because a standard the team sees skipped stops being the standard.`,
  lessons:[
  { id:'b1', title:'The Core Principle', minutes:4,
    why:`Everything else in this course rests on this idea. If people learned the standard from the handbook, training would be enough and this course would not exist. They learn it from what gets enforced, which means the GM's daily behavior is the real training program at the site. Understanding that most drift is people matching what looks normal, not defiance, changes how you respond: with a clear correction and a visible standard instead of a lecture about attitude.`,
    html:`<p class="lead">People do not calibrate their effort and behavior to what is written in a handbook or said in an interview. They calibrate to what actually gets enforced: what they watch happen, day after day, on the lot and in the break room.</p>
    <p>This is sometimes summed up as: <strong>"The standard you walk past is the standard you accept."</strong> Whatever a GM allows to slide becomes the real standard for that site, no matter what the handbook says.</p>
    <div class="callout"><div class="eyebrow red">Core idea</div><p><em>New hires do not learn the rules from what you tell them at hiring. They learn the rules from what they see enforced in their first two weeks.</em></p></div>
    <h2>It is usually not about getting away with something</h2>
    <p>It is tempting to describe this as employees always doing what they can get away with, as if people are looking for an angle. That is mostly not what is happening. Most people are not testing limits out of some instinct to shirk. They are reading the room and matching whatever behavior looks normal on the team.</p>
    <p>A new MSA who sees a veteran skip greeting customers on the lot does not think "I am getting away with something." They think "I guess that is not actually required here."</p>
    <p>The practical result is the same either way: <strong>inconsistent enforcement teaches people the real rules faster than any onboarding conversation does.</strong></p>`,
    quiz:[
      {q:'According to the manual, what do people calibrate their behavior to?',o:['What the handbook says','What was said in the interview','What actually gets enforced, day after day','What the bonus plan rewards'],a:2,why:'People calibrate to what they watch get enforced on the lot and in the break room, not to the handbook.'},
      {q:'Complete the line: "The standard you walk past is the standard you ..."',o:['forget','accept','coach','report'],a:1,why:'Whatever a GM allows to slide becomes the real standard for that site.'},
      {q:'How does the manual describe most employees who drift from a standard?',o:['They are testing limits on purpose','They are reading the room and matching what looks normal','They did not read the handbook','They are waiting for a bonus incentive'],a:1,why:'Most people are not shirking. They match whatever looks normal on the team, which is why consistent enforcement matters so much.'},
      {q:'When do new hires learn the real rules?',o:['At the interview','During the handbook review','From what they see enforced in their first two weeks','At their 90-day review'],a:2,why:'New hires learn the rules from what they see enforced in their first two weeks.'}
    ]},
  { id:'b2', title:'Why Expectations Erode', minutes:3,
    why:`You cannot hold a standard you cannot see slipping. The four erosion points are the exact moments where it happens, and each one feels reasonable at the time: the veteran has earned some slack, the new hire will figure it out, it was not worth the confrontation today. Naming them lets you recognize the moment while it is still one exception, before it becomes the new normal that every new hire learns.`,
    html:`<p class="lead">Expectations do not usually collapse all at once. They erode in small, quiet moments, almost always because a GM is trying to avoid friction.</p>
    <h2>The four most common erosion points</h2>
    <ul class="steps">
      <li>A veteran employee breaks a known rule, and nothing visibly happens.</li>
      <li>A new hire is held to a different (lower) standard than what was described at hiring, and no one corrects it.</li>
      <li>Diligence and corner-cutting get the same outcome: same schedule, same recognition, same bonus.</li>
      <li>A GM enforces a rule only when a customer complains, not as a baseline.</li>
    </ul>
    <p>Each of these sends the same message: <strong>the real standard is lower than the stated one.</strong> And once that message lands with one employee, it spreads, because new hires watch tenured staff to figure out what is actually required, not what is in the handbook.</p>`,
    quiz:[
      {q:'Which of these is one of the four common erosion points?',o:['A new hire asks too many questions','A veteran breaks a known rule and nothing visibly happens','The schedule is published late','A customer leaves a bad review'],a:1,why:'All four erosion points involve a visible gap between the stated standard and what actually happens.'},
      {q:'Why do expectations usually erode?',o:['Because the handbook is unclear','Because a GM is trying to avoid friction in small, quiet moments','Because corporate changes the rules','Because new hires are poorly screened'],a:1,why:'Erosion happens in small, quiet moments, almost always because a GM is avoiding friction.'},
      {q:'What message does enforcing a rule only after a customer complains send to the team?',o:['Customers are the priority','The real standard is lower than the stated one','The GM is strict','Complaints are rare'],a:1,why:'Every erosion point sends the same message: the real standard is lower than the stated one. Then it spreads.'}
    ]},
  { id:'b3', title:'The Hiring Window', minutes:4,
    why:`A new hire arrives with no model of what normal looks like at your site and builds one within days. That makes the first two weeks the cheapest place to set a standard and the most expensive place to lose one. Specific, observable standards matter because "customer-focused" cannot be corrected, but "greet within the first 10 feet" can. The pairing rule exists because whoever the new hire stands next to in those first shifts does more teaching than you will.`,
    html:`<p class="lead">The hiring window is your highest-leverage moment. Whatever you say in the interview and the first week sets a new hire's baseline expectation. But that baseline only survives if it matches what they observe on the floor. If it does not, the observed standard wins, every time.</p>
    <div class="callout"><div class="eyebrow red">Rule of thumb</div><p><em>A new hire will hold your stated standard for about as long as it takes them to see one exception go unaddressed.</em></p></div>
    <h2>At hiring, be specific, not aspirational</h2>
    <p>"We are customer-focused" is aspirational and unenforceable. "Every associate greets customers within the first 10 feet of the lot, every shift" is specific and observable. Specific standards are easier to hold because everyone, including you, can tell instantly whether they are being met.</p>
    <h2>Show, do not just tell</h2>
    <p>Where possible, pair the new hire with your most consistent performer in their first shifts, not just whoever is available. Their first mental model of "normal" gets built from whoever they are standing next to.</p>`,
    quiz:[
      {q:'Which of these is a specific, observable standard?',o:['"We are customer-focused"','"Every associate greets customers within the first 10 feet of the lot, every shift"','"Treat people the way you want to be treated"','"Give it your best every day"'],a:1,why:'A specific standard names a behavior anyone can see being met or missed. A value statement cannot be enforced.'},
      {q:'Who should a new hire be paired with in their first shifts?',o:['Whoever is available','Your most consistent performer','The newest MSA, so they learn together','The RM'],a:1,why:'Their first model of normal is built from whoever they stand next to. Make that your most consistent performer.'},
      {q:'How long will a new hire hold your stated standard?',o:['Through their 90-day review','About as long as it takes to see one exception go unaddressed','Until the next team meeting','Indefinitely, if it was said at hiring'],a:1,why:'The stated standard survives only until the new hire sees one exception go unaddressed.'}
    ]},
  { id:'b4', title:'Holding the Line After Hiring', minutes:5,
    why:`Setting a standard costs nothing. Holding one costs a small amount of friction, repeatedly, often with people you like and depend on. The four habits keep that cost manageable. Even enforcement removes the sense of favoritism that kills a standard faster than anything else. Correcting in the moment is what makes the correction read as the rule. Saying the standard out loud teaches everyone within earshot, not just the person being corrected. Recognition makes meeting the standard the thing that gets noticed, so the team is never left guessing whether consistency actually matters here.`,
    html:`<p class="lead">Setting the expectation is the easy part. Holding it, especially with a tenured employee, or when you are short-staffed and do not want to make waves, is where most sites actually lose the standard.</p>
    <h2>Four habits that protect the standard</h2>
    <ul class="steps">
      <li><strong>Enforce evenly.</strong> The newest hire and your longest-tenured MSA are held to the same rule, in view of each other, without exception.</li>
      <li><strong>Correct in the moment, not later.</strong> A correction given a week after the fact reads as a suggestion. A correction given on the spot reads as the actual standard.</li>
      <li><strong>Say the standard out loud, not just the correction.</strong> "We greet every customer, every time. Let's go say hi to that car" teaches the rule. "Hey, come here a sec" does not.</li>
      <li><strong>Recognize the standard being met, not just violations of it.</strong> If the employee who does it right never hears about it, and the one who skips it only hears about it when caught, you have quietly told the team that consistency is not valued, just avoiding getting caught.</li>
    </ul>
    <div class="callout"><div class="eyebrow red">Watch for</div><p><em>If you find yourself thinking "I'll let it go this once," that is usually the moment the real standard is being reset. Not the exception, the new normal.</em></p></div>`,
    quiz:[
      {q:'How does a correction given a week after the fact read to the team?',o:['As the actual standard','As a suggestion','As a formal warning','As coaching'],a:1,why:'A correction on the spot reads as the standard. A week later, it reads as a suggestion.'},
      {q:'Which phrasing teaches the rule?',o:['"Hey, come here a sec"','"We greet every customer, every time. Let\'s go say hi to that car"','"You know better than that"','"Do not let me see that again"'],a:1,why:'Say the standard out loud, not just the correction, so the rule itself is what the team hears.'},
      {q:'If you only ever correct misses and never recognize the standard being met, what does the team learn?',o:['The GM is fair','Consistency is not valued, just avoiding getting caught','Standards are flexible','Recognition comes later'],a:1,why:'Recognition is how the team learns that meeting the standard is what is actually valued.'},
      {q:'What does "I\'ll let it go this once" usually signal?',o:['Reasonable flexibility','The moment the real standard is being reset to a new normal','Good judgment under pressure','A one-time exception with no lasting effect'],a:1,why:'That thought is usually the moment the real standard resets. It becomes the new normal, not the exception.'}
    ]},
  { id:'b5', title:'Set, Show, Enforce, Recognize', minutes:3,
    why:`The framework exists so you can diagnose where a standard broke instead of guessing. If the team does not know the standard, the gap is Set. If they learned the wrong version from a veteran, it is Show. If they know it and skip it, it is Enforce. If the people who do it right are starting to drift, it is Recognize. Each step closes one specific gap, which is why skipping any one of them undoes the other three.`,
    html:`<p class="lead">A simple framework ties the whole manual together. Each step covers a gap the others cannot.</p>
    <div class="loop">
      <div><div class="st">SET</div><p>Define the standard in specific, observable terms at hiring. Not a value statement, a behavior.</p></div>
      <div><div class="st">SHOW</div><p>Pair new hires with your most consistent performer so their model of normal is accurate from day one.</p></div>
      <div><div class="st">ENFORCE</div><p>Correct every miss, from every employee, in the moment. Not just when it is convenient or a customer is watching.</p></div>
      <div><div class="st">RECOGNIZE</div><p>Make sure the people meeting the standard visibly get something for it: attention, praise, or advancement.</p></div>
    </div>
    <h2>Skipping any one step breaks the loop</h2>
    <ul>
      <li><strong>Set without Enforce</strong> is just a poster on the wall.</li>
      <li><strong>Enforce without Recognize</strong> makes the standard feel punitive instead of normal.</li>
      <li><strong>Show without consistent role models</strong> undoes the other three.</li>
    </ul>`,
    quiz:[
      {q:'What are the four steps of the framework, in order?',o:['Set, Show, Enforce, Recognize','Hire, Train, Correct, Reward','Welcome, Answer, Support, Hook','Set, Enforce, Review, Promote'],a:0,why:'Set the standard, Show it through role models, Enforce every miss in the moment, Recognize the standard being met.'},
      {q:'"Set without Enforce" is ...',o:['a strong start','just a poster on the wall','enough for tenured teams','the RM\'s job'],a:1,why:'A standard that is defined but never enforced is just a poster on the wall.'},
      {q:'What happens with Enforce but no Recognize?',o:['The team works harder','The standard feels punitive instead of normal','Turnover drops','Nothing changes'],a:1,why:'Without recognition, enforcement makes the standard feel punitive instead of normal.'},
      {q:'What does SHOW mean in practice?',o:['Post the standards in the break room','Pair new hires with your most consistent performer','Demonstrate the W.A.S.H. pitch once','Share the camera footage'],a:1,why:'Show means pairing new hires with your most consistent performer so their model of normal is accurate from day one.'}
    ]},
  { id:'b6', title:'GM Self-Check', minutes:5, selfcheck:true,
    why:`Standards drift quietly, and the GM is usually the last to notice because the drift happens around them, one reasonable exception at a time. This check turns the whole manual into six observable questions about your own site this week. It ends with one focus item because fixing one thing this week works, and trying to fix six at once does not.`,
    html:`<p class="lead">Use this before your next site walk or team meeting. Be honest. This is a diagnostic, not a report card.</p>
    <p>Check each statement that is true at your site right now. If you cannot check every box, that is the starting point, not a failure. Pick the one item you cannot check and make it the thing you fix this week.</p>`}
  ]}
];

const L5_MAINT = { id:'l5m', title:'Level 2 Maintenance Qualification', draft:true, lessons:[
  { id:'c8', title:'Preventive Maintenance and Equipment Faults', minutes:7,
    why:`Level 1 fixes what is already broken. Level 2 keeps it from breaking. A tunnel that is maintained on a schedule fails on a Tuesday morning when a tech can come; a tunnel that is run until it breaks fails on a Saturday at 2 pm. The AGM owns the schedule, reads the faults, and decides when a reset is enough and when it is a call.`,
    html:`<p class="lead">Level 2 means you run the preventive maintenance program, read equipment faults, verify the crew's lockouts, and manage the vendor when it is beyond the site.</p>
    <h2>The PM schedule</h2>
    <div class="tablewrap"><table><tr><th>Frequency</th><th>What gets done</th></tr>
    <tr><td class="k">Daily</td><td>Captain's startup and shutdown checklist, test car, chemical levels, nozzle and spray pattern check, pit and track clear</td></tr>
    <tr><td class="k">Weekly</td><td>Conveyor walk: roller and chain wear, guide rail, drive sprocket. Cloth and brush condition and alignment. Dryer intake screens. Air compressor drained, filters checked. Reclaim pit level and screens. Vacuum separators and motors.</td></tr>
    <tr><td class="k">Monthly</td><td>Grease points per the equipment manual. Hydraulic power pack fluid level and leaks. Water softener or RO salt and filters. Chemical tip and flow calibration with the vendor. Belt and hose inspection on every arch. Lighting audit.</td></tr>
    <tr><td class="k">Quarterly and seasonal</td><td>Cloth and brush replacement per wear, not per calendar. Dryer motor and bearing check by the vendor. Freeze prep before the first freeze. Full pit clean-out.</td></tr></table></div>
    <p>The schedule lives in one place, each task has a name and a date, and completed tasks are logged. A PM that is not written down did not happen.</p>
    <h2>Reading faults</h2>
    <ul><li>The controller or PLC shows a fault code when something stops. Read it, write it down with the time, then look at the equipment it names before resetting anything.</li><li><strong>One reset.</strong> If the same fault returns within the shift, stop resetting and call it in with the code and what you observed. Repeated resets hide a failing part until it fails for good.</li><li>Learn the five or six faults your tunnel shows most. Keep a card at the controller: code, likely cause, what to check, when to call.</li></ul>
    <h2>Verify the crew's lockouts</h2>
    <p>A Level 1 clears a nozzle; a Level 2 confirms the disconnect is off and the tag is on before they reach in, and corrects it in the moment when it is not. The standard you walk past is the one the crew learns, and this one can hurt someone.</p>
    <h2>Vendors and parts</h2>
    <ul><li>Keep a critical spares list on site: nozzle tips, hoses, belts, fuses, vacuum hoses and nozzles, cloth sections. Reorder at the minimum, not at zero.</li><li>When you call a tech: fault code, what you observed, what you tried, since when, and a photo. Ask for the arrival window and tell the GM.</li><li>Log downtime: start, end, cause, fix, cost. The GM and RM manage the budget from this log.</li></ul>`,
    quiz:[
      {q:'A fault code appears and clears when you reset it. It comes back 40 minutes later. You ...',o:['reset it again; it cleared once','stop resetting, call it in with the code and what you observed','ignore it until close','swap the fuse'],a:1,why:'One reset. A returning fault is a failing part. Repeated resets hide it until it fails for good.'},
      {q:'Cloth and brushes are replaced ...',o:['every quarter on the calendar','per wear, checked weekly','when a customer complains','when the vendor says'],a:1,why:'Replacement is by condition. The weekly walk is where wear gets seen.'},
      {q:'What makes a PM task count as done?',o:['The Captain said so','It is logged with a name and a date','The tunnel is running','The vendor was called'],a:1,why:'A PM that is not written down did not happen. The log is how the GM and RM know the program is real.'},
      {q:'A Level 1 is about to clear a nozzle with the arch turned off at the control panel only. As Level 2 you ...',o:['let them; it is quick','stop them, confirm the disconnect and tag, then let them proceed','do it yourself','report them to the GM'],a:1,why:'Level 2 verifies the crew\'s lockouts in the moment. The control panel alone is not lockout.'}
    ]},
  { id:'c9', title:'Site Systems and POS Administration', minutes:7,
    why:`The AGM is usually the person who adds a new hire to the POS, pulls camera footage for a claim, and notices the end-of-day report does not match the deposit. Each of those is a place where a small mistake costs real money or a real claim. Knowing the site's systems as a map, not a mystery, is what lets you fix the small things and escalate the right things.`,
    html:`<p class="lead">Know how the site's systems connect, administer the POS correctly, and keep the camera and user records clean.</p>
    <h2>The site network, as a map</h2>
    <p>Internet comes in through the <strong>modem</strong>, to the <strong>router</strong>, to the <strong>switch</strong>. From the switch: pay stations, the Sales Booth terminal, the office computer, the camera recorder and cameras, the plate reader, and site Wi-Fi. Keep a one-page diagram with the ISP account number and support line, the POS vendor support line, and the camera vendor on it, taped inside the network cabinet. When something is down, the map tells you where to look.</p>
    <h2>POS administration (FlexWash)</h2>
    <ul><li><strong>Users:</strong> every employee has their own login with the permission level for their role. Added on day one, removed the day they leave. No shared logins, no generic accounts.</li><li><strong>Prices and packages:</strong> you do not change a price, a package, or a Membership plan without the GM's approval and the company's process. A wrong price on the pay station is live at every lane within seconds.</li><li><strong>End of day:</strong> run the daily report, compare it to the SiteWatch General Sales Report, and investigate any difference the same day. Document what you found.</li><li><strong>Member accounts:</strong> no duplicate accounts; fix the plate on the existing one. Failed payments worked weekly from the report, not from memory.</li></ul>
    <h2>Cameras and footage</h2>
    <ul><li>Know the recorder's retention window. Footage for a claim is exported and saved to the claim file the same day, before it rolls off.</li><li>Export the load, the tunnel, and the exit for the vehicle in question with the time stamp visible. Note the camera names.</li><li>A camera down is reported the same day. The RM's morning check depends on it.</li></ul>
    <h2>Security and incidents</h2>
    <ul><li>Offboarding is same day: POS, email, camera app, any site app. Keep a checklist.</li><li>Anything that looks like a breach (locked files, ransom message, accounts you did not create, a device you do not recognize on the network) is reported to the GM and IT immediately. Do not try to fix it. Do not pay anything.</li><li>Nobody writes down a card number. Ever. Card data stays in the terminal.</li></ul>`,
    quiz:[
      {q:'A new MSA starts Monday. What is the POS rule?',o:['Share the Supervisor\'s login until they are trained','Their own login with their role\'s permissions, created on day one, removed the day they leave','Use a generic "MSA" account','No login until 30 days'],a:1,why:'Personal logins, correct permissions, same-day add and remove.'},
      {q:'A Member asks you to drop the Super Shine Membership price for them at the pay station. You ...',o:['change it; it is one customer','do not change prices or plans without the GM\'s approval and the company process','change it and tell the GM later','ask corporate by email and change it meanwhile'],a:1,why:'Price and package changes go live at every lane. They follow the process, every time.'},
      {q:'A damage claim comes in on Tuesday for a wash on Saturday. First IT step?',o:['Wait for the GM','Export the footage today, before it rolls off the recorder, and save it to the claim file','Ask the customer for photos','Restart the recorder'],a:1,why:'Retention windows are short. Export the same day with time stamps visible.'},
      {q:'The office computer shows a message demanding payment to unlock files. You ...',o:['pay it; the site needs the computer','report it to the GM and IT immediately, touch nothing, pay nothing','restart it','delete the message and keep working'],a:1,why:'That is a security incident. Report immediately, do not try to fix it, never pay.'}
    ]},
  { id:'c10', title:'Facilities Program and Compliance Basics', minutes:6,
    why:`At Level 1 you walk the site and report. At Level 2 you run the program: the vendors show up because you manage them, the inspections happen because you track them, and the repair budget lasts the year because you know what it is. A missed backflow test or an expired extinguisher tag is a fine and a closed site; a vendor who misses three weeks is a site that looks abandoned.`,
    html:`<p class="lead">Own the facilities calendar, the vendors, and the small-spend decisions, and know the compliance items that can close a site.</p>
    <h2>The monthly facilities inspection</h2>
    <p>The weekly walk looks for what is wrong. The monthly inspection scores every area against the same checklist, with photos, so the GM and RM can see the trend. Lighting, pavement, signage, canopy, vacuums, restrooms, landscaping, trash, life safety. Score it, date it, file it.</p>
    <h2>Vendor management</h2>
    <ul><li>One list: every vendor, what they do, how often, the contact, the contract end date, and whether they are on schedule this month.</li><li>Misses get a dated note and a call the same week. Three misses is a conversation with the GM about replacing them.</li><li>Any contractor on site: insurance certificate on file, checked in with you, told where they may and may not work, and nobody inside the tunnel with equipment energized.</li></ul>
    <h2>Spending</h2>
    <ul><li>Know the site's repair and maintenance budget and where it stands this month.</li><li>Know your spending authority. Under it: fix it and log it. Over it: two quotes and the GM's approval. Emergency and safety: fix it, then tell the GM the same day.</li><li>Repair keeps it running; replacement is a capital request through the GM. Do not patch a failing item three times without flagging it.</li></ul>
    <h2>Compliance items that can close the site</h2>
    <div class="tablewrap"><table><tr><th>Item</th><th>What you track</th></tr>
    <tr><td class="k">Fire extinguishers</td><td>Monthly visual check initialed on the tag; annual inspection by the vendor</td></tr>
    <tr><td class="k">Backflow preventer</td><td>Annual test by a certified tester; report filed with the water utility</td></tr>
    <tr><td class="k">Chemical storage</td><td>SDS binder current and accessible; secondary containment; labels; eyewash tested and clear</td></tr>
    <tr><td class="k">Water discharge</td><td>Reclaim and discharge per the site's permit; no chemical to the storm drain, ever</td></tr>
    <tr><td class="k">Injuries</td><td>Every injury reported the same shift, documented, and sent up; serious injuries escalated immediately</td></tr>
    <tr><td class="k">Restrooms and signage</td><td>Health and sign permits current where the city requires them</td></tr></table></div>
    <p>Put every one of these on a calendar with a 30-day warning. The GM reviews the calendar monthly.</p>`,
    quiz:[
      {q:'A repair will cost more than your spending authority and it is not a safety issue. You ...',o:['fix it and log it','get two quotes and the GM\'s approval','wait for the quarterly meeting','ask the vendor to bill it in parts'],a:1,why:'Under your authority: fix and log. Over it: two quotes and the GM. Safety: fix, then tell the GM same day.'},
      {q:'The backflow preventer test is ...',o:['optional','annual, by a certified tester, with the report filed with the water utility','done by the Captain','done when the tunnel is replaced'],a:1,why:'A missed backflow test can close the site. It is on the compliance calendar with a 30-day warning.'},
      {q:'A contractor arrives to work on the dryers while the tunnel is running. You ...',o:['let them start; they are the experts','check their insurance certificate is on file, check them in, and make sure nothing is energized where they work','ask the Captain to slow the belt','leave them to it'],a:1,why:'Contractors follow the site\'s rules: certificate on file, checked in, no energized equipment where they work.'},
      {q:'The same vacuum motor has been patched three times in two months. You ...',o:['patch it again','flag it to the GM as a replacement, not a repair','take the vacuum out of service permanently','ask the vendor for a discount'],a:1,why:'Repair keeps it running; the third patch is a capital conversation.'}
    ]}
]};

const L6_MAINT = { id:'l6m', title:'Level 3 Maintenance', draft:true, issued:'Draft course, not part of the issued GM Standards',
  lessons:[
  { id:'a8', title:'Owning the Equipment and the R&M Budget', minutes:7,
    why:`The GM Standards say the site is yours: its performance, appearance, and reputation. Equipment is where appearance and performance meet the budget. A GM who runs the tunnel to failure spends more, loses more Saturdays, and washes worse cars than one who runs a maintenance program and plans replacements. Level 3 is the management layer above the wrench: budget, uptime, lifecycle, and the people who hold the qualifications below you.`,
    html:`<p class="lead">You do not need to turn the wrench. You need to make sure the program runs, the money is spent on the right things, and the tunnel is up when the cars are there.</p>
    <h2>Four numbers you own</h2>
    <div class="tablewrap"><table><tr><th>Number</th><th>Why it matters</th></tr>
    <tr><td class="k">Downtime hours per month</td><td>Every hour the tunnel is down at peak is lost cars and lost Members. Track cause, not just hours.</td></tr>
    <tr><td class="k">R&M spend vs budget</td><td>Repair and maintenance has a budget. Know it monthly. Over because of one failure is explainable; over because of no PM is not.</td></tr>
    <tr><td class="k">Cost per car</td><td>Chemical, water, and electricity per car washed. A rising number usually means a leak, a miscalibrated tip, or a reclaim problem.</td></tr>
    <tr><td class="k">PM completion</td><td>Percent of scheduled PM tasks logged on time. Under 90% is the leading indicator of next month's downtime.</td></tr></table></div>
    <h2>Lifecycle and capital</h2>
    <ul><li>Every major component has a life: cloth, brushes, dryer motors, conveyor chain, pumps, pay stations. Know roughly where each one is in that life.</li><li>When a component is patched three times, it goes on the replacement list with a cost, a lead time, and the downtime it will cause if it fails first.</li><li>Capital requests go to leadership with the cost, the failure risk, the customer impact, and the payback. "The dryer is old" is not a request; "the dryer has failed twice this quarter, a third failure on a Saturday costs about X cars, and replacement is Y" is.</li></ul>
    <h2>The qualifications on your team</h2>
    <ul><li>You certify Level 1 and Level 2 on your site. Watch them do it; do not sign off on a quiz score alone.</li><li>Every shift has at least one Level 1 on it. The AGM holds Level 2.</li><li>Audit lockout the way the RM audits your test car: unannounced, in the moment, with the standard said out loud.</li></ul>
    <h2>Vendors and contracts</h2>
    <p>Know what the service agreement covers, the response time it promises, and what it costs when they miss. Hold them to it the way the RM holds you to the standards.</p>`,
    quiz:[
      {q:'PM completion fell to 70% last month. What does that predict?',o:['Nothing; the tunnel is running','Next month\'s downtime','Lower chemical cost','A better audit'],a:1,why:'PM completion is the leading indicator. Downtime follows missed PM by weeks, not days.'},
      {q:'Which is a capital request leadership can decide on?',o:['"The dryer is old"','"The dryer failed twice this quarter; a Saturday failure costs about 200 cars; replacement is $X with a 6-week lead time"','"We need a new dryer"','"The vendor recommends replacing it"'],a:1,why:'Cost, failure risk, customer impact, and payback. That is a decision; the rest are opinions.'},
      {q:'How do you certify a Level 1 on your site?',o:['Quiz score of 100%','Watch them do the task to standard, including lockout, then sign off','The AGM says they are ready','Tenure of 90 days'],a:1,why:'Watch the work. A quiz proves knowledge; the sign-off certifies the behavior.'},
      {q:'Cost per car has risen 15% with no price change in chemical. Most likely?',o:['More cars','A leak, a miscalibrated tip, or a reclaim problem','Weather','The vendor'],a:1,why:'Rising cost per car is almost always a physical problem on the site. Walk it with the Captain.'}
    ]},
  { id:'a9', title:'Technology, Data, and Security Ownership', minutes:7,
    why:`A GM runs the site on reports and systems: FlexWash, SiteWatch, the cameras, the plate reader, Hellowash, Google Workspace. If the data in them is wrong, every daily number is wrong, and the GM is managing a site that does not exist. If access to them is loose, one departed employee or one bad click can cost more than a quarter's downtime. Level 3 is making sure the systems tell the truth and only the right people can touch them.`,
    html:`<p class="lead">Own the systems the site runs on: who has access, whether the data is right, and what happens when something goes wrong.</p>
    <h2>Access control</h2>
    <ul><li><strong>Quarterly access review:</strong> every user on every system, matched to the current roster. Anyone not on the roster is removed that day. Sign the review and keep it.</li><li>Permissions match roles. An MSA does not have price-change rights. A Supervisor does not have admin rights. You do not share yours.</li><li>Offboarding is same day, every system, checklist signed. Ask the AGM for the checklist, not the assurance.</li></ul>
    <h2>Data integrity</h2>
    <ul><li>The SiteWatch General Sales Report and the Flexwash accounting report are reconciled daily by the AGM and reviewed by you weekly. Discrepancies are investigated and the cause written down, not adjusted away.</li><li>Membership data hygiene: duplicate accounts merged, plates correct, failed payments worked weekly from the report. Churn numbers are only as good as the account data.</li><li>Price and package changes follow the company process and are verified at the pay station after the change. A price wrong at the lane is a refund problem by noon.</li></ul>
    <h2>Security and incident response</h2>
    <ul><li>Nobody at the site writes down or stores card numbers. Card data lives in the terminal and the processor. Period.</li><li>A suspected incident (ransomware, locked files, unknown accounts, a device you do not recognize, a phishing click) is reported to leadership and IT within the hour. The site does not try to fix it and never pays.</li><li>Phishing and social engineering: no one legitimate asks for a password, a code, or gift cards. Train it, test it, and recognize the person who reports it.</li><li>Site devices are site devices: no personal accounts, no downloads, screens locked.</li></ul>
    <h2>Rollouts and vendors</h2>
    <ul><li>A new system or a POS change is a project: a date, a test lane, a trained team before go-live, and a rollback plan. The first Saturday after a change gets the GM on the lot.</li><li>Hellowash and any AI-assisted tool is reviewed, not just closed. Read a sample of tickets weekly: is the answer the customer got the answer you would have given?</li><li>Vendor escalations go with a ticket number, a time line, and the business impact. "It is still down" gets a slower answer than "Lane 2 has been down 3 hours on a Saturday, ticket 4471."</li></ul>`,
    quiz:[
      {q:'What is the quarterly access review?',o:['Checking who has keys','Every user on every system matched to the current roster, with extras removed that day and the review signed','Changing all passwords','A vendor audit'],a:1,why:'Every system, every user, against the roster, every quarter, signed.'},
      {q:'The two sales reports disagree by $140 on Tuesday. The AGM proposes adjusting the entry so they match. You ...',o:['approve it; it is small','investigate the cause and write it down; discrepancies are explained, not adjusted away','ignore it under $200','report it to the RM only'],a:1,why:'A discrepancy adjusted away is a problem hidden. Find the cause and document it.'},
      {q:'A Supervisor clicked a link in an email and entered their POS password before realizing. You ...',o:['tell them to change it tomorrow','report to leadership and IT within the hour, have the password changed now, and treat it as an incident','write them up','do nothing if nothing looks wrong'],a:1,why:'A phished credential is an incident. Within the hour, report and reset. Then train it and recognize the report.'},
      {q:'How should Hellowash be managed?',o:['Close tickets promptly and nothing else','Close tickets promptly and review a weekly sample: did the customer get the answer you would have given?','Turn it off on weekends','Let corporate handle it'],a:1,why:'An AI tool is reviewed, not just closed. A weekly sample tells you whether it is representing the site well.'}
    ]},
  { id:'a10', title:'Facilities, Compliance, and Risk', minutes:7,
    why:`The GM Standards put site readiness, cleanliness, audit results, and customer feedback in the bonus. Facilities are most of what those words mean. Compliance and risk are the part the standards do not spell out because they assume it: a GM who lets an inspection lapse, an injury go unreported, or a contractor work uninsured has put the site, the company, and people at risk. Level 3 is the annual plan, the compliance calendar, and the judgment calls.`,
    html:`<p class="lead">Run the site like you own the building: a plan for the year, a calendar that never surprises you, and a clear head when something goes wrong.</p>
    <h2>The annual facilities plan</h2>
    <ul><li>Once a year, walk the whole site with the AGM and the RM. List everything that will need attention in the next 12 months: pavement, lighting, signage, canopy, vacuums, restrooms, landscaping, paint.</li><li>Sort it: repair this quarter, repair this year, capital request. Put dates and rough costs on it.</li><li>Curb appeal is marketing. A faded sign and a cracked lot say the wash is tired before the customer has seen a car come out. Budget for the entrance the way you budget for the tunnel.</li></ul>
    <h2>The compliance calendar</h2>
    <p>Every item below has an owner (usually the AGM), a due date, and a 30-day warning. You review it monthly and bring it to the RM quarterly.</p>
    <div class="tablewrap"><table><tr><th>Item</th><th>Cadence</th></tr>
    <tr><td class="k">Fire extinguishers and life safety</td><td>Monthly tag check; annual vendor inspection</td></tr>
    <tr><td class="k">Backflow preventer test</td><td>Annual, certified tester, filed with the utility</td></tr>
    <tr><td class="k">Water discharge and reclaim</td><td>Per permit; never chemical to the storm drain; spill kit stocked</td></tr>
    <tr><td class="k">Chemical storage and SDS</td><td>SDS binder current; containment; eyewash tested monthly</td></tr>
    <tr><td class="k">Injury and incident log</td><td>Every injury same shift; serious injuries escalated immediately; records kept per policy</td></tr>
    <tr><td class="k">Permits and licenses</td><td>Business, sign, health where applicable; renewal dates on the calendar</td></tr>
    <tr><td class="k">Contractor insurance</td><td>Certificate on file before any contractor works on site</td></tr></table></div>
    <h2>Risk and judgment</h2>
    <ul><li><strong>Injuries:</strong> care for the person first. Then document, report, and preserve footage. Never discourage a report.</li><li><strong>Damage claims:</strong> reviewed by you within 24 hours with the Captain's documentation and footage, then sent to corporate for decision. You promise a timeline, not an outcome.</li><li><strong>Severe weather, power outage, chemical spill:</strong> the site has a written plan for each, the team knows where it is, and you have walked through it once this year.</li><li><strong>Contractors:</strong> insured, checked in, nowhere near energized equipment. A contractor injury on your site is your incident.</li><li><strong>Security:</strong> lighting works at night, cameras cover the lanes and the booth, and any cash on site is handled by two people and dropped daily.</li></ul>`,
    quiz:[
      {q:'What goes on the annual facilities plan?',o:['Only capital items','Everything that will need attention in 12 months, sorted into this quarter, this year, and capital, with dates and rough costs','The vendor list','The nightly clean checklist'],a:1,why:'One list, sorted and dated, built on a walk with the AGM and RM.'},
      {q:'A team member is hurt and says it is nothing. You ...',o:['take their word for it','care for them first, then document, report the same shift, and preserve footage; never discourage a report','note it if they are still hurting tomorrow','ask them not to report it to keep the record clean'],a:1,why:'Every injury, same shift, every time. Discouraging a report is the one thing a GM must never do.'},
      {q:'Why is curb appeal in the facilities budget?',o:['The RM likes it','A faded sign and a cracked lot say the wash is tired before the customer sees a car come out; the entrance is marketing','It is not; marketing pays for it','For the audit score only'],a:1,why:'The entrance is the first impression and the cheapest marketing the site has.'},
      {q:'A contractor shows up without an insurance certificate on file. You ...',o:['let them work; they came a long way','do not let them start until the certificate is on file','let them work outside the tunnel only','ask the AGM to decide'],a:1,why:'Certificate on file before any contractor works on site. A contractor injury on your site is your incident.'}
    ]}
]};

L5.scenarios.push(
  {t:'The returning fault',s:'The conveyor throws the same fault code three times in one afternoon. The Captain has reset it each time and the tunnel runs for about an hour between faults.',o:['Keep resetting; it runs between faults.','Stop the resets, log the code and times, call the vendor with the details, and tell the GM. Plan for the belt to be down if it fails for good.','Slow the belt and hope.','Wait until Monday to call.'],a:1,why:'One reset. A returning fault is a failing part, and repeated resets hide it until it fails on a Saturday.'},
  {t:'The $140 difference',s:'End of day: the FlexWash report and the SiteWatch report differ by $140. The Supervisor offers to adjust the entry so they match.',o:['Let them; it is small.','Investigate the cause today, document it, and flag it. Discrepancies are explained, not adjusted away.','Ignore anything under $200.','Email corporate and move on.'],a:1,why:'Review both reports and flag discrepancies. Adjusting one to match hides the cause.'}
);
L5.assessment.push(

  {q:'Cloth and brushes are replaced ...',o:['quarterly','per wear','on complaint','never'],a:1},
  {q:'Price changes at the pay station require ...',o:['a Supervisor','the GM\'s approval and the company process','a customer request','nothing'],a:1},
  {q:'Over your spending authority and not a safety issue, you ...',o:['fix it','get two quotes and the GM\'s approval','wait','split the invoice'],a:1},
  {q:'A contractor works on site only with ...',o:['a business card','an insurance certificate on file and a check-in','the Captain\'s okay','nothing'],a:1}
);
GM_SCENARIOS.push(
  {t:'The third patch',s:'The AGM reports the main dryer motor has been repaired three times this quarter. The vendor can patch it again for $900 or replace it for $9,000 with a six-week lead time.',o:['Patch it; $900 is in budget.','Patch it to stay running, and submit a capital request today with the failure history, the Saturday downtime risk in cars, the replacement cost, and the lead time.','Replace it without asking.','Run without a dryer if it fails.'],a:1,why:'Keep it running, and turn the pattern into a decision leadership can make: cost, risk, customer impact, payback.'},
  {t:'The phished password',s:'A Supervisor tells you she entered her POS password on a link in an email that looked like it came from the POS vendor. Nothing looks wrong yet.',o:['Tell her to change it when she gets a chance.','Report to leadership and IT within the hour, reset the password now, treat it as an incident, and thank her for reporting it in front of the team.','Write her up.','Wait to see if anything happens.'],a:1,why:'A phished credential is an incident regardless of what has happened yet. Report, reset, and recognize the report so the next person speaks up too.'}

GM_FINAL.push(
  {q:'The leading indicator of next month\'s downtime is ...',o:['car count','PM completion rate','chemical cost','the weather'],a:1},

/* ---------- Level 6: General Manager, from the issued documents ---------- */
const L6 = { id:'l6', num:6, title:'General Manager', short:'General Manager', draft:false,
  role:'The General Manager owns the site: its results, its appearance, its customers, and its team.',
  blurb:'The General Manager Standards and the Leadership Manual, Setting and Holding the Standard.',
  why:`The GM Standards say what good looks like. The Leadership Manual explains why standards slip and how to hold them. One is the what, the other is the how, and the why sits with each lesson so GMs act on the reasons, not just the rules.`,
  courses:[...GM_COURSES, L6_MAINT], scenarios:GM_SCENARIOS, assessment:GM_FINAL, pass:80,
  ack:{ formal:true, statement:'I have read and understand the Mighty Wash General Manager Standards and agree to meet them at my site.' }
};
const LEVELS = [L1, L2, L3, L4, L5, L6, L7];
const PASS_PCT = 80;
const WHY = {
  program:`Every role at Mighty Wash is a step on one ladder, the Road Map to Success. Each level in this Academy teaches the standards for that role, explains why each one exists, lets you practice the decisions, checks that it stuck, and ends with a sign-off. Finish your level, then start the next one. The person who knows the next level's standards is the person who gets promoted into it.`,
  scenarios:`Knowing the standard and applying it under pressure are different skills. Each scenario is a moment where the easy option and the standard pull in opposite directions. Making the decision here, with time to think, makes it faster and more automatic on the lot.`,
  final:`The assessment confirms the standards made it from the page into memory, and gives you and your leader one shared record of that. The ${PASS_PCT}% pass mark is high on purpose: these are the standards your role is measured on, so knowing most of them is not enough.`,
  ack:`The sign-off turns the standards from an announcement into an agreement. It confirms you have completed the level, understand how your role is measured, and agree to hold the standard at your site. That is the same thing the Leadership Manual asks every leader to do with a new hire on day one.`
};
const whyBox = (t, label) => `<div class="whybox"><div class="eyebrow blue">${label||'Why this matters'}</div><p>${t}</p></div>`;
const ALL_LESSONS = []; const lessonIndex = {};
for (const L of LEVELS) for (const c of L.courses) for (const l of c.lessons) { const e = {...l, course:c, level:L}; ALL_LESSONS.push(e); lessonIndex[l.id]=e; }
const levelById = id => LEVELS.find(L=>L.id===id);
const lessonById = id => lessonIndex[id];
const levelLessons = L => L.courses.flatMap(c=>c.lessons);

/* ---------- State ---------- */
const LS_KEY='mw-academy-v2', OLD_KEY='mw-gm-academy-v1';
let S = {role:'', lessons:{}, scenarios:{}, assess:{}, ack:{}, selfcheck:{checks:[false,false,false,false,false,false], focus:''}, updatedAt:0};
let UI = {open:{}};
let db=null, user=null, uid=null, me=null, canAdmin=false, remoteDoc=null, saveTimer=null;

function migrate(o){
  if(!o||typeof o!=='object') return null;
  if(o.assess||o.role!==undefined) return o;           /* already v2 */
  const n = {role:'', lessons:o.lessons||{}, scenarios:{}, assess:{}, ack:{}, selfcheck:o.selfcheck||S.selfcheck, updatedAt:o.updatedAt||0};
  if(o.scenarios&&o.scenarios.done) n.scenarios.l6=o.scenarios;
  if(o.final) n.assess.l6=o.final;
  if(o.ack) n.ack.l6=o.ack;
  return n;
}
function lsLoad(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const o=migrate(JSON.parse(raw)); if(o) S={...S,...o}; return; } }catch(e){}
  try{ const raw=localStorage.getItem(OLD_KEY); if(raw){ const o=migrate(JSON.parse(raw)); if(o){ S={...S,...o}; lsSave(); } } }catch(e){}
  try{ const u=localStorage.getItem(LS_KEY+'-ui'); if(u) UI=JSON.parse(u)||UI; }catch(e){}
}
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function uiSave(){ try{ localStorage.setItem(LS_KEY+'-ui', JSON.stringify(UI)); }catch(e){} }

function levelProgress(L){
  const ls=levelLessons(L); const done=ls.filter(l=>S.lessons[l.id]&&S.lessons[l.id].done).length;
  const sc=!!(S.scenarios[L.id]&&S.scenarios[L.id].done), as=!!(S.assess[L.id]&&S.assess[L.id].passed), ak=!!S.ack[L.id];
  const units=ls.length+3, got=done+(sc?1:0)+(as?1:0)+(ak?1:0);
  return {done, total:ls.length, sc, as, ak, units, got, pct:Math.round(got/units*100), complete:got===units};
}
function progress(){
  let got=0, units=0; const per={};
  for(const L of LEVELS){ const p=levelProgress(L); per[L.id]=p; got+=p.got; units+=p.units; }
  return {pct:Math.round(got/units*100), per, levelsDone:LEVELS.filter(L=>per[L.id].complete).length};
}
function completionSummary(){
  const p=progress(); const levels={};
  for(const L of LEVELS){ const q=p.per[L.id]; levels[L.id]={pct:q.pct, lessons:q.done, total:q.total, scenarios:q.sc, assessed:q.as, score:S.assess[L.id]?S.assess[L.id].score:null, signed:q.ak, signedAt:S.ack[L.id]?S.ack[L.id].at:null, site:S.ack[L.id]?S.ack[L.id].site:''}; }
  const lastAck = Object.values(S.ack).sort((a,b)=>(b.at||0)-(a.at||0))[0];
  return {role:S.role||'', pct:p.pct, levelsDone:p.levelsDone, levels, ackName:lastAck?lastAck.name:'', ackSite:lastAck?lastAck.site:'', updatedAt:S.updatedAt};
}
function save(){
  S.updatedAt=Date.now(); lsSave(); paintProgress();
  if(remoteDoc){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async()=>{
      try{ await remoteDoc.set(S); await db.doc('completions/'+uid).set(completionSummary()); }
      catch(e){ if(e&&e.code==='invalid_argument'){ remoteDoc=null; toast('Progress is saved on this device only'); } }
    },600);
  }
}

/* ---------- Capabilities ---------- */
async function initCaps(){
  try{
    if(!window.claude||!window.claude.use) return;
    user=await claude.use('user');
    if(user){ me=await user.me(); uid=me.id; canAdmin=!!me.canEdit||!!me.isOwner; paintWho(); }
    db=await claude.use('db');
    if(db&&uid){
      const ref=db.doc('data/users/'+uid+'/progress');
      const snap=await ref.get();
      if(snap.exists){ const r=migrate(snap.data()); if(r&&(r.updatedAt||0)>=(S.updatedAt||0)){ S={...S,...r}; lsSave(); render(); } }
      remoteDoc=ref;
      if((S.updatedAt||0)>0&&!(snap.exists&&(snap.data().updatedAt||0)>=S.updatedAt)) save();
    }
    if(canAdmin) renderRail();
  }catch(e){}
}
function paintWho(){ const el=document.getElementById('who'); if(!me) return; el.innerHTML=''; const img=document.createElement('img'); img.src=me.avatarUrl; img.alt=''; const nm=document.createElement('span'); nm.className='nm'; nm.textContent=me.name||'Signed in'; el.append(img,nm); }

/* ---------- Routing ---------- */
function curHash(){ return (location.hash||'#home').slice(1).replace(/[^a-z0-9_.~-]/gi,'')||'home'; }
function route(){
  const h=curHash(); closeRail();
  let m;
  if(h==='home') renderHome();
  else if(h==='team') renderTeam();
  else if((m=h.match(/^lvl-(l\d)$/))&&levelById(m[1])) renderLevel(levelById(m[1]));
  else if((m=h.match(/^sc-(l\d)$/))&&levelById(m[1])) renderScenarios(levelById(m[1]));
  else if((m=h.match(/^as-(l\d)$/))&&levelById(m[1])) renderAssessment(levelById(m[1]));
  else if((m=h.match(/^ack-(l\d)$/))&&levelById(m[1])) renderAck(levelById(m[1]));
  else if(lessonById(h)) renderLesson(lessonById(h));
  else renderHome();
  renderRail(h); window.scrollTo({top:0});
}
window.addEventListener('hashchange', route);
function go(h){ if(location.hash==='#'+h) route(); else location.hash=h; }
function hashLevel(h){ let m; if((m=h.match(/^(?:lvl|sc|as|ack)-(l\d)$/))) return m[1]; const l=lessonById(h); return l?l.level.id:null; }

/* ---------- Rail ---------- */
function renderRail(active){
  active=active||curHash();
  const activeLevel=hashLevel(active);
  const rail=document.getElementById('rail'); const P=progress();
  let html=`<button class="navitem util ${active==='home'?'active':''}" data-go="home" style="margin-bottom:8px"><span class="dot" style="border-color:transparent;background:transparent"></span><strong>Road Map to Success</strong></button>`;
  for(const L of LEVELS){
    const p=P.per[L.id]; const open=(UI.open[L.id]!==undefined)?UI.open[L.id]:(L.id===activeLevel||L.id===S.role);

function paintProgress(){ const p=progress(); document.getElementById('ringPct').textContent=p.pct+'%'; document.getElementById('ringBar').setAttribute('stroke-dasharray',(p.pct/100*97.4).toFixed(1)+' 97.4'); }

/* ---------- Helpers ---------- */
const main=document.getElementById('main');
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(ts){ try{ return new Date(ts).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }catch(e){ return ''; } }
function wire(){ main.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go))); }
function render(){ route(); paintProgress(); }
let toastT=null; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function draftNote(L){ return L.draft?`<div class="draft">Draft standards for this level, written to match the issued GM Standards and Leadership Manual. Pending review by Mighty Wash leadership; details may change.</div>`:''; }
function nextStepIn(L){ const ls=levelLessons(L); const l=ls.find(l=>!(S.lessons[l.id]&&S.lessons[l.id].done)); if(l) return l.id; const p=levelProgress(L); if(!p.sc) return 'sc-'+L.id; if(!p.as) return 'as-'+L.id; if(!p.ak) return 'ack-'+L.id; return 'lvl-'+L.id; }
function myLevel(){ return levelById(S.role)||LEVELS.find(L=>!levelProgress(L).complete)||LEVELS[0]; }

/* ---------- Lesson ---------- */
function renderLesson(l){
  const L=l.level, c=l.course, ls=levelLessons(L), idx=ls.findIndex(x=>x.id===l.id), done=S.lessons[l.id]&&S.lessons[l.id].done, nxt=ls[idx+1], prev=ls[idx-1];
