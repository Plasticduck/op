    <p>When the Supervisor or manager arrives or at shift change: what happened, what is pending, who did well. Two minutes, every time.</p>`,
    quiz:[
      {q:'A veteran prepper skips the greeting while a new hire watches. What do you do?',o:['Let it go; he is reliable otherwise','Correct it in the moment, out loud, with the standard, the same way you would for the new hire','Tell the new hire not to copy him','Note it for the GM'],a:1,why:'Enforce evenly, in the moment, in view of each other. That is how the crew learns the real standard.'},
      {q:'Why recognize the standard being met, not just the misses?',o:['It is polite','If only misses get attention, the crew learns that avoiding getting caught is what matters','It is required by HR','It fills time'],a:1,why:'Recognition tells the crew that meeting the standard is what gets noticed.'},
      {q:'What does a shift handoff include?',o:['Just "all good"','What happened, what is pending, who did well','The chemical order','Nothing; the log covers it'],a:1,why:'Two minutes: what happened, what is pending, who did well.'}
    ]}
  ]}],
  scenarios:[
    {t:'Streaky at 2 pm',s:'Cars were perfect at open. Now every car has a haze on the hood and a streak on the driver door in the same spot.',o:['Speed up the belt to clear the line.','Look at the exit, then check nozzles and the mitter on that side; the same-spot streak is mechanical. Fix or call it in, and slow the belt if needed.','Add more soap.','Wait until close to look.'],a:1,why:'Same spot every car is mechanical. Haze points to rinse or drying agent. Check in order: exit, chemical, belt, friction.'},
    {t:'Off the roller',s:'A sedan turns slightly on the belt and the rear tire drops off the roller. The driver starts to open the door.',o:['Wave the driver to drive out.','Stop the belt, tell the driver to stay in the car, assess from outside the path, and clear it with two people before anyone restarts.','Push the car back on with two preppers.','Keep the belt running; the next roller will catch it.'],a:1,why:'Stop first. Customer stays in. Two people clear it. Only the Captain or shift leader restarts.'},
    {t:'The mirror claim',s:'A customer at the exit says the wash cracked her mirror cap. You remember the loader flagging a loose cap on that car before it went in.',o:['Tell her the loader saw it was already loose.','Apologize for the experience, document fully including the loader\'s pre-wash note, pull footage, give her the next step, and escalate to the GM today.','Tell her to call corporate.','Replace it from petty cash.'],a:1,why:'Never say "that was already there," even when you believe it. The pre-wash note goes in the documentation; corporate decides.'},
    {t:'Phone on the lot',s:'You are the senior person on shift. A prepper checks his phone between cars, twice.',o:['Ignore it; you are not a Supervisor.','Correct it in the moment: "Phones off the lot," the same way you would for anyone.','Text the GM.','Wait for the Supervisor tomorrow.'],a:1,why:'When you are the senior person, you are the qualified leader. The standard is yours to hold.'},
    {t:'Friday chemical check',s:'Friday close. The drying agent drum will not make it through Saturday. The delivery is Monday.',o:['Dilute it to stretch through the weekend.','Call it in tonight and tell the GM now so they can source it before Saturday. Never dilute or mix.','Run Saturday without it.','Borrow a different product from the auto center.'],a:1,why:'Low chemical is called in before it is out, and the GM is told. A Saturday without drying agent is wet cars all day.'}
  ],
  assessment:[
    {q:'The Tunnel Captain walks the tunnel ...',o:['at open only','every hour','when something breaks','at close'],a:1},
    {q:'The test car runs ...',o:['after open','before the first customer','at noon','weekly'],a:1},
    {q:'A drum that will not last through peak is swapped ...',o:['when it runs out','at startup','at close','tomorrow'],a:1},
    {q:'Clean on top, filmy on the lower panels points to ...',o:['dryers','chemical and dwell on the lower panels','the pay station','rinse'],a:1},
    {q:'Same streak, same spot, every car is ...',o:['chemical','mechanical: nozzle, mitter, or brush','the customer','dwell'],a:1},
    {q:'Stretching a low drum by diluting it is ...',o:['fine on weekends','never done','fine with GM approval','standard'],a:1},
    {q:'During a jam, customers ...',o:['get out at the exit','stay in their cars','walk out the entrance','help clear it'],a:1},
    {q:'A damage claim is decided by ...',o:['the Captain','the customer','corporate after GM review','the MSA'],a:2},
    {q:'"That was already there" is ...',o:['fine if true','never said to a customer','required for the form','said by the GM only'],a:1},
    {q:'When you are the senior person on the lot you are ...',o:['just the Captain','the qualified leader for that shift','off duty for leadership','the MSA'],a:1},
    {q:'Corrections are given ...',o:['weekly','in the moment, out loud, with the standard, to everyone the same way','by the GM','in writing only'],a:1},
    {q:'Every stop is ...',o:['forgotten','logged and reported to the GM','reported monthly','only logged if there was damage'],a:1}
  ],
  ack:{ statement:'I have completed the Tunnel Captain training. I can run startup and shutdown, read and correct wash quality, manage a stop safely, document a damage claim, and lead the lot crew to the Mighty Wash standard.' }
};

const L4 = { id:'l4', num:4, title:'Supervisor and MSA', short:'Supervisor / MSA', draft:true,
  role:'Mighty Sales Associate: you sign up Members and protect the base. Supervisor: you run the shift as the qualified leader.',
  blurb:'W.A.S.H. in depth, MVP and Express Interiors, the pay station, retention, running a shift, coaching in the moment, and the Level 1 Maintenance Qualification: basic maintenance, IT, and facilities.',
  why:`Membership is 75 to 80% of the business and the MSA is where it is made. The Supervisor is the qualified leader the standards require on every shift. This level is both, because at Mighty Wash the person who can sell is the person who should be running the shift.`,
  courses:[{ id:'l4c', title:'Supervisor and Mighty Sales Associate', lessons:[
  { id:'m1', title:'Membership Is the Engine', minutes:4,
    why:`Retail revenue depends on the weather. Membership revenue arrives on the first of the month whether it rains or not. That is why the company target is 75 to 80% from Members, why the Sales Booth exists, and why the GM Standards call MSAs one of the most important operational levers in the business.`,
    html:`<p class="lead">You are the person in the Sales Booth. Every eligible customer is offered Membership, every time.</p>
    <h2>The numbers you work toward</h2>
    <div class="tablewrap"><table><tr><th>Metric</th><th>Standard</th></tr>
    <tr><td class="k">Conversion rate</td><td><b>15 to 18%</b> of eligible retail customers join. 20%+ is the stretch in mature markets.</td></tr>
    <tr><td class="k">Daily floor</td><td><b>10%</b>. Under that triggers an RM review.</td></tr>
    <tr><td class="k">MVP penetration</td><td><b>25 to 35%</b> of Members on MVP (unlimited exterior + Express Interiors).</td></tr>
    <tr><td class="k">Monthly churn</td><td><b>7 to 9%</b>. Voluntary 3% or less; credit card 4% or less.</td></tr></table></div>
    <h2>The Sales Booth</h2>
    <p>On sites that have one, you work from the Sales Booth. It is where customers go to ask about Membership and where sign-ups happen, so it is staffed whenever the lanes are open. On a site without a booth, you work the pay lanes so every customer still meets you.</p>
    <h2>The packages</h2>
    <p>Three washes: <strong>Wonder</strong>, <strong>Super Shine</strong>, and <strong>Mighty Protector</strong>. Every package is available as a Membership, so the question is never "do you want a Membership" but "which one." MVP adds Express Interiors to a Membership.</p>
    <h2>Eligible means everyone who is not a Member</h2>
    <p>Retail customers, lapsed Members, fleet drivers in their personal cars, the person who says "I only come once a month." Everyone is offered. Nobody is pressured.</p>`,
    quiz:[
      {q:'What is the conversion rate standard?',o:['10%','15 to 18%','25 to 35%','75 to 80%'],a:1,why:'15 to 18%, with 20%+ as the stretch. Under 10% on any day triggers an RM review.'},
      {q:'Who is eligible to be offered Membership?',o:['Only customers who ask','Everyone who is not already a Member','Only customers buying Mighty Protector','Only locals'],a:1,why:'Every eligible customer, every time. Eligible means everyone who is not a Member.'},
      {q:'Which packages are available as a Membership?',o:['Only Mighty Protector','Only Wonder','All three: Wonder, Super Shine, and Mighty Protector','None; Membership is separate'],a:2,why:'Every package has a Membership. The question for the customer is which one, not whether.'}
    ]},
  { id:'m2', title:'W.A.S.H. in Depth', minutes:7,
    why:`W.A.S.H. exists so the offer is made the same way to every customer, not only when an MSA feels confident. The objections below are the same five you will hear every day. Knowing the answer before the customer asks is the difference between 10% and 18%.`,
    html:`<p class="lead">Welcome, Answer, Support, Hook. Four steps, under a minute, every car.</p>
    <div class="wash">
      <div><div class="L">W</div><div class="w">Welcome</div><p>Approach from the front so they see you. Eye contact. "Welcome to Mighty Wash! First time with us?"</p></div>
      <div><div class="L">A</div><div class="w">Answer</div><p>Know Wonder, Super Shine, and Mighty Protector, the Member price for each, and how it works cold. "Members wash unlimited for about the price of two washes."</p></div>
      <div><div class="L">S</div><div class="w">Support</div><p>Ask how often they wash. Do the math with them. Connect it to their car and their week.</p></div>
      <div><div class="L">H</div><div class="w">Hook</div><p>Ask. "Want me to get you set up today? Takes about a minute." Then stop talking.</p></div>
    </div>
    <h2>The five objections</h2>
    <div class="tablewrap"><table><tr><th>They say</th><th>You say</th></tr>
    <tr><td class="k">"Too expensive"</td><td>"Two washes a month and it has paid for itself. Most Members come every week once it is free to."</td></tr>
    <tr><td class="k">"I don't come enough"</td><td>"That is the thing about unlimited. Members stop deciding whether it is worth it and just pull in. Rain, dust, pollen, whatever."</td></tr>
    <tr><td class="k">"Let me think about it"</td><td>"Sure. Quick version: it is month to month and you can change or cancel. Want me to set it up now so today's wash counts?"</td></tr>
    <tr><td class="k">"I have one somewhere else"</td><td>"How is that going for you? We have Express Interiors on MVP and free vacuums every visit. Worth a comparison next month?"</td></tr>
    <tr><td class="k">"I'm just visiting"</td><td>"No problem. Enjoy the wash." Not every customer is eligible today. Thank them and move on.</td></tr></table></div>
    <h2>Rules</h2>
    <ul><li>Every eligible customer gets the Hook. Not most. Every.</li><li>Never pressure, never guilt, never argue. One ask, one follow-up, then thank them.</li><li>If you cannot answer a question about pricing or plans, you are not ready for the lanes alone. Ask to be retrained.</li></ul>`,
    quiz:[
      {q:'A customer says "I don\'t come often enough for that." Best response?',o:['"Then it is probably not for you."','"That is the thing about unlimited. Members stop deciding whether it is worth it and just pull in."','"You should come more."','"It is cheaper than you think."'],a:1,why:'Reframe: unlimited removes the decision. Then ask.'},
      {q:'What happens after you ask for the sale?',o:['Repeat the offer','Stop talking and let them answer','List the packages again','Offer a discount'],a:1,why:'Ask, then stop. The silence is where the yes happens.'},
      {q:'A customer says "let me think about it." What is the standard?',o:['Let them go','One short follow-up with the month-to-month fact and an offer to set it up now, then thank them either way','Keep pitching until they decide','Give them a flyer'],a:1,why:'One ask, one follow-up, then thank them. Never pressure.'},
      {q:'You cannot confidently answer a pricing question. What does that mean?',o:['Guess','You are not ready to work the lanes alone; ask to be retrained on W.A.S.H.','Send them to the GM','Skip the Answer step'],a:1,why:'Every MSA is trained on W.A.S.H. before working the lanes alone and retrained if below standard.'}
    ]},
  { id:'m3', title:'Selling MVP and Express Interiors', minutes:4,
    why:`A Member on the base plan is worth a monthly payment. A Member on MVP is worth more every month and visits more often, because the inside of the car is what people actually live in. MVP penetration of 25 to 35% is a company target because it is the fastest way to grow revenue without a single new customer.`,
    html:`<p class="lead">The best time to sell MVP is at sign-up. The second best time is every visit after.</p>
    <h2>At sign-up</h2>
    <p>Present MVP first, not as an add-on. "Most Members go with MVP: unlimited exterior plus Express Interiors, so the inside gets done too. Or there is exterior-only." Lead with the full picture; let them step down if they want.</p>
    <h2>Existing Members</h2>
    <ul><li>Member with kids, a dog, or a work truck: "You know MVP includes Express Interiors? I can upgrade you right here."</li><li>Member at the vacuums doing it themselves: that is an MVP conversation.</li><li>Retail customer buying an interior: "You would save money on MVP after two visits."</li></ul>
    <h2>Deliver the interior to standard</h2>
    <p>Express Interiors are delivered to standard every time. If the interior lane is slow or sloppy, MVP churns. Watch the lane; it is your product.</p>`,
    quiz:[
      {q:'How do you present MVP at sign-up?',o:['As an add-on after they pick exterior','First, with the full picture, and let them step down','Only if they ask','Only to customers with new cars'],a:1,why:'Lead with MVP. People step down more readily than they step up.'},
      {q:'Why does MVP penetration matter to the company?',o:['It is easier to sell','It grows revenue per Member without needing a new customer','It reduces labor','It replaces retail'],a:1,why:'Each MVP upgrade raises revenue per Member and visit frequency. 25 to 35% is the target.'},
      {q:'A Member is at the vacuums cleaning their own interior. What is that?',o:['A satisfied customer','An MVP conversation','A complaint waiting to happen','Nothing'],a:1,why:'They value a clean interior and are doing the work themselves. Offer the upgrade.'}
    ]},
  { id:'m4', title:'The Pay Station and POS', minutes:5,
    why:`A sign-up done wrong at the pay station becomes a declined card, a wrong plate on the tag, or a Member who cannot get through the gate next week. Each of those is a churn event you created. Accuracy at the pay station is retention.`,
    html:`<p class="lead">The pay station is where Membership becomes real. Get the details right the first time.</p>
    <h2>A clean sign-up</h2>
    <ol class="steps"><li>Confirm the plan (MVP or exterior) and the price out loud.</li><li>Plate or tag: match it to the vehicle in front of you. Read it back.</li><li>Payment: run it while they are there. A declined card at sign-up is handled now, not next month.</li><li>Contact info: phone and email correct. That is how failed payments get recovered.</li><li>Tell them how it works: "Your plate is recognized at the pay station. Pull into the Member lane and go."</li></ol>
    <h2>Changes, cancellations, refunds</h2>
    <ul><li><strong>Plan changes</strong> you can do on the spot. Upgrades especially.</li><li><strong>Cancellation requests</strong> follow the company's cancellation process. First, understand why (see Retention). Then route it correctly and put it in Notes.</li><li><strong>Refunds:</strong> direct the customer to corporate. Do not quote an amount. Ever.</li></ul>
    <h2>Notes</h2>
    <p>Every meaningful interaction, issue, and resolution goes in the Notes feature so the next person can pick up the history. If it is not in Notes, it did not happen.</p>`,
    quiz:[
      {q:'A customer\'s card declines at sign-up. What do you do?',o:['Sign them up and let billing sort it out','Handle it now: try another card or payment, so the account starts clean','Give them a free month','Cancel the sign-up'],a:1,why:'A declined card at sign-up is a churn event waiting to happen. Fix it while they are there.'},
      {q:'A Member asks how much their refund will be. You ...',o:['look it up and tell them','direct them to corporate and do not quote an amount','estimate it','refund it at the pay station'],a:1,why:'Refunds go through corporate and the amount is never quoted on site.'},
      {q:'Why read the plate back during sign-up?',o:['It is polite','A wrong plate means the gate will not recognize them next visit','It speeds things up','Corporate requires it'],a:1,why:'The plate is how the Member gets through the gate. Read it back and match it to the car.'},
      {q:'Where does a cancellation conversation get recorded?',o:['Nowhere','In the Notes feature','In an email','On a sticky note'],a:1,why:'Every meaningful interaction goes in Notes so anyone can pick up the history.'}
    ]},
  { id:'m5', title:'Retention and Save Conversations', minutes:5,
    why:`A lost Member takes months of new sign-ups to replace. The churn targets split into voluntary (people who chose to leave) and credit card (people who did not choose to leave and are gone anyway) because they need different fixes. Half of retention is a phone call about an expired card.`,
    html:`<p class="lead">Protecting the base is as much the job as growing it.</p>
    <h2>Credit card churn (target 4% or less)</h2>
    <ul><li>A failed payment is a Member who still wants to be a Member. Call, text, or catch them at the gate the same week.</li><li>"Hi, this is Mighty Wash. Your card on file did not go through. Takes a minute to update, want to do it now?"</li><li>Update it at the pay station when they visit. Never let a failed card sit for a second cycle.</li></ul>
    <h2>Voluntary churn (target 3% or less)</h2>
    <p>Ask why before you process anything. Then match the save to the reason:</p>
    <div class="tablewrap"><table><tr><th>Reason</th><th>Save</th></tr>
    <tr><td class="k">"Not using it enough"</td><td>Remind them of Express Interiors and free vacuums. Offer a step down to exterior rather than a cancel.</td></tr>
    <tr><td class="k">"Too expensive right now"</td><td>Step down, or a pause if the company offers one. Keep the relationship.</td></tr>
    <tr><td class="k">"Moving"</td><td>Check our locations. If none nearby, thank them and make the cancel easy. They will tell people how it ended.</td></tr>
    <tr><td class="k">"Bad experience"</td><td>Listen, apologize, fix what you can today, get a leader. This is the one you can save in person.</td></tr></table></div>
    <h2>Record it</h2>
    <p>Cancellation reasons go in Notes. The GM reads them to find what is driving churn at your site.</p>`,
    quiz:[
      {q:'A Member\'s card failed this month. What is the standard?',o:['Wait for them to notice','Contact them the same week and update it at the pay station when they visit','Cancel the Membership','Send a letter'],a:1,why:'A failed card is a Member who still wants to be one. Same week, never a second cycle.'},
      {q:'A Member wants to cancel because they are not using it enough. First move?',o:['Process the cancellation','Ask about Express Interiors and vacuums, then offer a step down instead of a cancel','Offer a free month','Tell them to come more'],a:1,why:'Match the save to the reason. "Not using it" often means they forgot what is included.'},
      {q:'Why do cancellation reasons go in Notes?',o:['Corporate requires it','The GM reads them to find what is driving churn at the site','To track the MSA','They do not'],a:1,why:'Reasons in Notes are how the site learns what is causing churn.'},
      {q:'What are the two churn sub-targets?',o:['Voluntary 3% or less, credit card 4% or less','Voluntary 7%, credit card 9%','Voluntary 4%, credit card 3%','There are none'],a:0,why:'Voluntary 3% or less; credit card 4% or less, inside the 7 to 9% monthly target.'}
    ]},
  { id:'m6', title:'Running a Shift as Supervisor', minutes:5,
    why:`The GM Standards require a qualified leader on every shift, including the GM's days off. That is the Supervisor. A shift without a leader runs on whatever happens; a shift with one runs on the standard. Sundays and Mondays, when GMs are typically off, are where this matters most.`,
    html:`<p class="lead">When you are the leader on shift, the site's standards are yours to hold until the next leader arrives.</p>
    <h2>Open the shift</h2>
    <ul><li>Confirm the site opened on time and the test car ran. If either missed, report it up immediately.</li><li>Two-minute huddle: yesterday's conversion, today's focus, who is where, breaks.</li><li>Walk the lot as a customer once. Trash, hoses, signage, vacuums.</li></ul>
    <h2>Run the shift</h2>
    <ul><li>MSA coverage on every pay lane at peak. An unstaffed lane is a lost Member.</li><li>Watch the exit, the line, and the interior lane. Move people before the problem, not after.</li><li>Handle escalations: complaints, claims, stops. Bring the issue and your plan when you call the GM.</li><li>Hellowash tickets and Notes for your shift, closed out before you leave.</li></ul>
    <h2>Close the shift</h2>
    <ul><li>Nightly clean verified to the full checklist, not "looked fine."</li><li>Shutdown confirmed with the Tunnel Captain. Chemical for tomorrow noted.</li><li>Handoff note to the GM: numbers, issues, who did well.</li></ul>`,
    quiz:[
      {q:'Why must every shift have a qualified leader?',o:['For payroll','Without one, the shift runs on whatever happens instead of the standard','So someone can take breaks','It is optional'],a:1,why:'The GM Standards require a qualified leader on every shift, including GM days off.'},
      {q:'What is in the shift huddle?',o:['Company history','Yesterday\'s conversion, today\'s focus, who is where, breaks','The schedule for next month','Nothing; just start'],a:1,why:'Two minutes: yesterday\'s number, today\'s focus, assignments, breaks.'},
      {q:'When you call the GM about a problem, you bring ...',o:['the problem','the problem and your plan','a list of who caused it','nothing; the GM decides'],a:1,why:'Solve what you can; when you escalate, bring the issue and your plan.'},
      {q:'How is the nightly clean closed out?',o:['"Looked fine"','Verified against the full checklist','By the Captain only','Skipped on slow nights'],a:1,why:'Verified to the full checklist. The RM sees the result on camera in the morning.'}
    ]},
  { id:'m7', title:'Coaching in the Moment', minutes:4,
    why:`The GM Standards say MSAs are coached live on the lot: observe the pitch, give immediate feedback, recognize wins. A correction a week later is a suggestion; a correction on the spot is the standard. The Supervisor is on the lot with the team all shift, which makes you the main coach at the site.`,
    html:`<p class="lead">Watch the pitch. Say what you saw. Say the standard. Recognize what was right.</p>
    <h2>Observe W.A.S.H. live</h2>
    <p>Stand where you can hear an MSA work a car. Did they Welcome from the front? Answer confidently? Support with the math? Hook with a real ask? Most misses are a skipped Hook.</p>
    <h2>Feedback in 30 seconds</h2>
    <ol class="steps"><li>What you saw: "You answered the price question well."</li><li>The standard: "We ask for the sale on every eligible car."</li><li>The fix: "Next car, after the math, say: want me to set you up today?"</li><li>Watch the next one and recognize it: "That was it. That is the Hook."</li></ol>
    <h2>Rules that protect the standard</h2>
    <ul><li>Enforce evenly: the top seller and the new MSA get the same correction, in view of each other.</li><li>Below standard after coaching: retrain on W.A.S.H. before they work the lanes alone again.</li><li>Recognize by name, today. The team repeats what gets noticed.</li></ul>`,
    quiz:[
      {q:'What is the most common W.A.S.H. miss?',o:['Welcome','Answer','Support','The Hook: not asking for the sale'],a:3,why:'Most MSAs can greet and answer. Skipping the ask is the usual miss.'},
      {q:'Feedback is given ...',o:['at the end of the week','in the moment, in about 30 seconds, with the standard','in writing','only by the GM'],a:1,why:'Correct in the moment. A correction a week later reads as a suggestion.'},
      {q:'An MSA is still below standard after coaching. What is next?',o:['Move them to the exit','Retrain on W.A.S.H. before they work the lanes alone again','Write them up','Lower the target'],a:1,why:'Re-train anyone below standard before they work the lanes alone.'}
    ]}
  ]},
{ id:'l4m', title:'Level 1 Maintenance Qualification', lessons:[
  { id:'m8', title:'Basic Maintenance', minutes:7,
    why:`Most tunnel downtime starts as something small: a plugged nozzle, a worn tip, a slipping roller, a vacuum with a torn bag. A Supervisor who can see it, fix the safe ones, and write a clear ticket for the rest keeps the site open and keeps the maintenance team working on real problems instead of driving out to clear a nozzle. The qualification exists so you know exactly what is yours to touch and what is not.`,
    html:`<p class="lead">Level 1 Maintenance means you can inspect, do the safe routine tasks, and write a ticket that gets the rest fixed fast. It does not mean you work on anything powered, pressurized, or electrical.</p>
    <h2>Lockout first, every time</h2>
    <ol class="steps"><li><strong>Stop</strong> the equipment at the control and tell the lot you are working on it.</li><li><strong>Disconnect</strong> at the equipment's disconnect switch, not just the control panel.</li><li><strong>Tag</strong> it with your name and the time so nobody restarts it.</li><li><strong>Verify</strong> it will not start before you put a hand on anything. Then work.</li><li><strong>Clear and restart</strong> only after your tools and hands are out and the tag is removed by you.</li></ol>
    <h2>What Level 1 can do</h2>
    <ul><li><strong>Daily walk with the Tunnel Captain:</strong> listen for new noises, look for leaks, drips, loose hoses, worn cloth, and anything hanging into the vehicle path.</li><li><strong>Nozzles and tips:</strong> clear a plugged nozzle and replace a worn tip with the arch off and locked out. Match the tip to the one you removed.</li><li><strong>Vacuums:</strong> empty and clean the separator or bag, clear a blocked hose, replace a cracked hose or nozzle, check the intake screen.</li><li><strong>Dryers:</strong> clean intake screens of lint and debris. Report any rattle or vibration; do not open a blower housing.</li><li><strong>Conveyor:</strong> keep the pit and track clear of debris. Report any roller that sticks, drags, or does not drop.</li><li><strong>Chemical station:</strong> swap drums, prime lines per the vendor procedure, replace a cracked tube, keep the area clean and labeled. Gloves and eye protection.</li><li><strong>Lights and signs:</strong> replace plug-in bulbs and signage inserts you can reach from the ground or a stepladder with a spotter.</li></ul>
    <h2>What Level 1 does not do</h2>
    <ul><li>Anything inside an electrical panel, including resetting a tripped breaker more than once. One reset, and if it trips again it is a ticket.</li><li>Hydraulic lines, pumps, motors, gearboxes, air compressor internals, or anything under pressure.</li><li>Conveyor drive, chain, or roller mechanism repairs.</li><li>Working at height beyond a stepladder, or inside the tunnel with any equipment energized.</li></ul>
    <h2>Write a ticket that gets fixed</h2>
    <p>What is wrong, where exactly (which arch, which vacuum, which lane), when it started, what you already tried, and a photo. Mark it <strong>urgent</strong> if it affects customers or safety right now. Follow it until it is closed; a ticket that sits is a problem that stays.</p>`,
    quiz:[
      {q:'Before clearing a plugged nozzle on an arch, what must happen?',o:['Turn the arch off at the control panel','Stop, disconnect at the equipment, tag it, and verify it will not start','Wait for a gap between cars','Ask the Captain to slow the belt'],a:1,why:'Lockout is the whole sequence: stop, disconnect, tag, verify. The control panel alone is not enough.'},
      {q:'A breaker trips, you reset it, and it trips again. What now?',o:['Reset it again and watch it','Stop. A second trip is a ticket, not a second reset','Hold it in','Move the load to another breaker'],a:1,why:'One reset. If it trips again there is a fault, and that is beyond Level 1.'},
      {q:'Which task is within Level 1?',o:['Replacing a hydraulic hose','Opening a dryer blower housing','Replacing a cracked vacuum hose and cleaning the separator','Adjusting the conveyor drive chain'],a:2,why:'Vacuums, nozzles, chemical drums, screens, and reachable bulbs are Level 1. Hydraulics, drives, and blower internals are not.'},
      {q:'What makes a maintenance ticket useful?',o:['"Tunnel broken"','What, exactly where, when it started, what you tried, a photo, and the right priority','A phone call with no record','The vendor\'s name'],a:1,why:'A specific ticket gets fixed on the first visit. A vague one gets a second visit.'}
    ]},
  { id:'m9', title:'Basic IT', minutes:6,
    why:`When the pay station freezes or the internet drops, the site stops selling Memberships until someone fixes it, and the first person who can is whoever is on shift. Most site IT problems clear with a correct restart in the correct order. The rules on logins and links exist because one shared password or one bad click can take down more than one site.`,
    html:`<p class="lead">Know the restart order, know what to check before you call, and never guess on security.</p>
    <h2>The restart order</h2>
    <p>When "the internet is down," power-cycle in this order and wait a full two minutes between steps: <strong>modem → router → network switch → the device that is failing</strong> (pay station, POS terminal, camera). Restarting the pay station first, before the network, wastes ten minutes.</p>
    <h2>Pay stations and POS</h2>
    <ul><li>Frozen screen: restart the station per the site procedure. If it comes back and freezes again within the hour, open a ticket; do not keep restarting through peak.</li><li>Card reader not reading: check the reader for debris and a loose cable before anything else.</li><li>Receipt paper: keep two rolls at every station. Out of paper looks like a broken station to a customer.</li><li>Plate or tag not recognized: wipe the camera lens, check the plate is readable and the Member's account is active in the POS. Do not create a duplicate account.</li></ul>
    <h2>Cameras</h2>
    <p>A camera offline means the RM cannot verify your open, test car, and clean. Check power and the network cable at the camera and the switch, then restart in order. Still down: ticket it the same day and tell the GM, because the RM will ask.</p>
    <h2>Security rules that are not optional</h2>
    <ul><li>Logins are personal. Never share yours and never use someone else's, including the GM's.</li><li>No personal accounts, downloads, or browsing on site devices.</li><li>Lock the screen when you walk away from the office computer.</li><li>Nobody from "IT," "the bank," or "corporate" will ever call or email asking for a password, a code, or gift cards. Hang up, do not click, and report it.</li><li>Lost phone or tablet with site apps on it: report it the same hour so access can be cut.</li></ul>
    <h2>Google Workspace and Hellowash</h2>
    <p>Email answered in a timely manner, every Calendar invite accepted or declined, cameras on in Meet, and Hellowash tickets closed out promptly. These are GM Standards and they start at Supervisor.</p>
    <h2>When to call IT</h2>
    <p>After the restart order has been done once, correctly. Have ready: the site, the device, what it shows, what you tried, and since when.</p>`,
    quiz:[
      {q:'The internet is down and the pay station shows offline. What is the correct restart order?',o:['Pay station, then router, then modem','Modem, router, switch, then the pay station, two minutes between each','Switch first','Call IT before touching anything'],a:1,why:'Network first, from the outside in, then the device. Restarting the device before the network wastes time.'},
      {q:'A pay station freezes, restarts fine, then freezes again 30 minutes later. You ...',o:['keep restarting it through peak','open a ticket; repeated freezes are a fault, not a restart problem','unplug it for the day','swap it with another lane\'s station'],a:1,why:'One restart. A repeat within the hour is a ticket.'},
      {q:'Someone calls saying they are from corporate IT and needs your login to fix the POS. You ...',o:['give it; they sound legitimate','refuse, hang up, and report it. Nobody will ever ask for a password by phone or email','give them the GM\'s login instead','ask them to email you'],a:1,why:'No legitimate request for a password, code, or gift cards ever comes by phone or email.'},
      {q:'A camera is offline. Why does it matter today?',o:['It does not; cameras are for security only','The RM verifies open, test car, and nightly clean on it every morning','Only the vendor cares','Corporate reviews it monthly'],a:1,why:'The RM cannot verify your site without it. Check power and cable, restart in order, then ticket it the same day.'}
    ]},
  { id:'m10', title:'Basic Facilities', minutes:6,
    why:`A customer judges the wash before the car touches water: the entrance, the signs, the lights, the vacuum area, the restroom. Facilities are the part of the customer experience the tunnel cannot fix. The nightly clean keeps the site presentable day to day; the facilities walk catches what wears out slowly, so it is fixed before the RM's site visit or a customer's review finds it.`,
    html:`<p class="lead">The nightly clean is daily. The facilities walk is weekly. Both are checklists, not impressions.</p>
    <h2>The weekly facilities walk</h2>
    <div class="tablewrap"><table><tr><th>Area</th><th>Look for</th></tr>
    <tr><td class="k">Entrance and signage</td><td>Menu boards readable and current, package names correct, lights working, no faded or broken panels, directional signs and striping visible</td></tr>
    <tr><td class="k">Lot and drive lanes</td><td>Potholes, loose concrete, standing water, drain grates clear, cones and bollards in place, trash enclosure closed and clean</td></tr>
    <tr><td class="k">Pay stations and Sales Booth</td><td>Clean, lit, screens clear, booth stocked and presentable, no exposed wiring</td></tr>
    <tr><td class="k">Tunnel exterior and canopy</td><td>Lights, gutters, roof leaks, loose panels, bird and wasp nests</td></tr>
    <tr><td class="k">Vacuum area</td><td>Every station working, hoses and nozzles intact, mats, trash cans lined and emptied, lighting at night</td></tr>
    <tr><td class="k">Restrooms</td><td>Clean, stocked, locks and fixtures working, no odor</td></tr>
    <tr><td class="k">Landscaping and curb appeal</td><td>Mowed, trimmed, beds clear, no weeds in the lot, flags and banners in good shape</td></tr>
    <tr><td class="k">Life safety</td><td>Fire extinguishers charged and tagged, first aid kit stocked, eyewash accessible, exits and walkways clear</td></tr></table></div>
    <h2>Seasonal</h2>
    <ul><li><strong>Freeze:</strong> West Texas and eastern New Mexico freeze hard. Before the first freeze, confirm heat tape and heaters on exposed lines, know the site's freeze procedure for the tunnel and vacuums, and keep ice melt on hand for the lanes and walkways.</li><li><strong>Wind and dust:</strong> secure banners and signs, check canopy fasteners, clean dust from pay station screens and camera lenses more often.</li><li><strong>Storms:</strong> clear drains before the rain, not after. Lightning on the lot: clear it.</li></ul>
    <h2>Vendors and tickets</h2>
    <p>Landscaping, pest control, trash, and janitorial run on schedules. Know the schedule and the contact. When a vendor misses, it is a ticket with the date they missed. Anything that affects customers is reported the day it is found and followed until resolved, and the weekly list goes to the GM for the RM's maintenance review.</p>`,
    quiz:[
      {q:'How often is the facilities walk done?',o:['Nightly','Weekly, against a checklist','Monthly','When the RM is coming'],a:1,why:'The nightly clean is daily; the facilities walk is weekly and catches what wears out slowly.'},
      {q:'A menu board still shows an old package name. Which standard does that touch?',o:['None; it is cosmetic','Customer experience and sales: the first thing a customer reads has to be correct and readable','Only the brand guide','Only IT'],a:1,why:'The menu board is the start of the sale. Wrong or faded means a confused first-timer.'},
      {q:'Before the first freeze, what is confirmed?',o:['Nothing; the tunnel is heated','Heat tape and heaters on exposed lines, the site freeze procedure, and ice melt on hand','That the vacuums are off','That the RM has been told'],a:1,why:'A frozen line on a January morning is a late open. Prepare before the freeze.'},
      {q:'The landscaping vendor missed this week. You ...',o:['mow it yourself','open a ticket with the missed date and add it to the weekly list for the GM','wait and see if they come next week','cancel the vendor'],a:1,why:'Vendor misses are tickets with dates. The weekly list goes to the GM for the RM maintenance review.'}
    ]}
]}],
  scenarios:[
    {t:'"Too expensive"',s:'A retail customer buying Mighty Protector says Membership is too expensive for her.',o:['"Okay, enjoy your wash."','"Two Mighty Protector washes a month and it has paid for itself. Most Members come weekly once it is free to. Want me to set it up so today counts?"','"We have a cheaper plan."','"Everyone says that."'],a:1,why:'Support with the math, then Hook. One ask, one follow-up, then thank her either way.'},
    {t:'Cancel at the pay station',s:'A Member pulls up and says he wants to cancel. The line is building behind him.',o:['Process it so the line moves.','Ask him to pull aside, ask why, match the save to the reason, and record it in Notes. Route the cancellation correctly if he still wants it.','Tell him to call corporate.','Offer a free month.'],a:1,why:'Ask why first. Half of cancellations have a save. Whatever happens, it goes in Notes.'},
    {t:'Two o\'clock dip',s:'Saturday, 2 pm. Both lanes are backed up, one MSA is on break, and you can see the line but no one is working it.',o:['Wait for the break to end.','Work the line yourself or move someone onto the lane now. At peak, every lane has an MSA.','Close one lane.','Text the GM.'],a:1,why:'An unstaffed lane at peak is a lost Member. Move people before the problem, not after.'},
    {t:'The skipped Hook',s:'You watch your best MSA greet, answer, and do the math perfectly, then let the customer drive off without asking.',o:['Say nothing; he is your best.','Thirty seconds, in the moment: what you saw, the standard, the fix. Watch the next car and recognize it.','Mention it at the next meeting.','Ask the GM to talk to him.'],a:1,why:'Enforce evenly and in the moment. The best MSA gets the same coaching as the newest.'},
    {t:'Declined card at the gate',s:'A Member\'s plate is not recognized at the gate. The system shows a failed payment from last week.',o:['Let him through this once.','Explain the card did not go through, update it at the pay station right now, and thank him. Put it in Notes.','Tell him to call billing.','Charge him retail today.'],a:1,why:'A failed card is a Member who still wants to be one. Fix it now, never let it sit a second cycle.'},
    {t:'Frozen pay station at noon',s:'Saturday, noon. Lane 2\'s pay station is frozen. The line is building and the internet light on the switch looks normal.',o:['Restart the modem and router first.','Restart the pay station per the site procedure; the network looks fine so start with the device. If it freezes again within the hour, open a ticket and move the MSA to work lane 1.','Unplug it and send everyone to lane 1 for the day.','Call IT before touching it.'],a:1,why:'If the network is up, the device is the problem. One restart; a repeat is a ticket, and the Sales Booth keeps selling either way.'},
    {t:'The nozzle',s:'The Tunnel Captain shows you a plugged nozzle on the presoak arch leaving a dry stripe on every car. He wants to clear it between cars.',o:['Let him; it takes ten seconds.','Stop the belt, disconnect and tag the arch, verify, then clear it. Ten seconds is not a reason to skip lockout.','Open a ticket and leave the stripe until the tech comes.','Turn the arch off at the control panel and let him reach in.'],a:1,why:'Clearing a nozzle is Level 1 work, but only locked out. The control panel alone is not lockout.'}
  ],

    {q:'The conversion standard is ...',o:['10%','15 to 18%','25 to 35%','50%'],a:1},
    {q:'The H in W.A.S.H. is ...',o:['Help','Hook: ask for the sale, every eligible customer','Hand off','Hold'],a:1},
    {q:'After you ask for the sale, you ...',o:['repeat the offer','stop talking','list packages','offer a discount'],a:1},

    {q:'A refund amount is ...',o:['quoted from the system','never quoted; direct to corporate','estimated','paid from the register'],a:1},
    {q:'A failed card is contacted ...',o:['next month','the same week','never','after two cycles'],a:1},

    {q:'Someone calls asking for your login to fix the POS. You ...',o:['give it','refuse, hang up, report it','give the GM\'s','email it'],a:1},

  ack:{ statement:'I have completed the Supervisor and MSA training and the Level 1 Maintenance Qualification. I can run W.A.S.H. with every eligible customer, sell MVP, run a clean sign-up, work retention, lead a shift as the qualified leader, coach in the moment, and handle basic maintenance, IT, and facilities tasks within the Level 1 scope, with lockout every time.' }
